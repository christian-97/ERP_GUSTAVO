<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sazón — Gestión Operativa</title>
<meta name="description" content="Sistema interno de gestión operativa · Sazón Restaurante">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ================================================================
   DESIGN TOKENS
================================================================ */
:root {
  /* Backgrounds */
  --bg-base:      #111009;
  --bg-sidebar:   #0D0B08;
  --bg-surface:   #1C1810;
  --bg-surface-2: #241E14;
  --bg-surface-3: #2D2518;

  /* Borders */
  --border:       #352B1E;
  --border-2:     #443825;

  /* Text */
  --text-1:       #EDE4D5;
  --text-2:       #AE9E8C;
  --text-3:       #6E5E4A;

  /* Brand / Actions */
  --accent:       #C0571E;   /* terracotta */
  --accent-h:     #CF6428;
  --accent-dim:   #261308;

  /* Semantic */
  --gold:         #B8882A;
  --gold-dim:     #221A08;
  --green:        #4A8235;
  --green-dim:    #192810;
  --red:          #A83828;
  --red-dim:      #270E08;

  /* Typography */
  --font:         'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:    'IBM Plex Mono', 'Courier New', monospace;

  /* Geometry */
  --r-xs:  3px;
  --r-sm:  6px;
  --r-md:  10px;
  --r-lg:  14px;

  --sidebar-w: 226px;
}

/* ================================================================
   RESET & BASE
================================================================ */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg-base);
  color: var(--text-1);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }
button { font-family: var(--font); cursor: pointer; }
::selection { background: var(--accent); color: #fff; }

/* ================================================================
   LAYOUT SHELL
================================================================ */
#root { display: flex; min-height: 100vh; }

/* App layout: sidebar + main */
.g-shell {
  display: flex;
  width: 100%;
  min-height: 100vh;
}

/* ================================================================
   SIDEBAR
================================================================ */
.g-sidebar {
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
  overflow-x: hidden;
}

/* Brand / Logo area */
.sb-brand {
  padding: 22px 18px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sb-logo-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}

/* Reserved logo slot — replace with <img> when logo is ready */
.sb-logo-mark {
  width: 34px;
  height: 34px;
  background: var(--accent);
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.04em;
  flex-shrink: 0;
  user-select: none;
}

.sb-logo-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
}

.sb-logo-sub {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* Navigation */
.sb-nav { flex: 1; padding: 10px 0; }

.sb-group-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 14px 18px 5px;
}

.nb {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 9px 18px;
  background: none;
  border: none;
  border-left: 2px solid transparent;
  color: var(--text-2);
  font-size: 13.5px;
  font-weight: 500;
  font-family: var(--font);
  text-align: left;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  line-height: 1.3;
}

.nb:hover { color: var(--text-1); background: rgba(255,255,255,0.03); }

.nb.a {
  color: var(--accent);
  background: var(--accent-dim);
  border-left-color: var(--accent);
  font-weight: 600;
}

.nb-icon {
  font-size: 15px;
  width: 18px;
  text-align: center;
  flex-shrink: 0;
  opacity: 0.8;
}
.nb.a .nb-icon { opacity: 1; }

/* Sidebar user footer */
.sb-user {
  border-top: 1px solid var(--border);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.sb-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--bg-surface-3);
  border: 1px solid var(--border-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-2);
  flex-shrink: 0;
  text-transform: uppercase;
}

.sb-user-info { flex: 1; min-width: 0; }
.sb-user-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sb-user-role {
  font-size: 10.5px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.logout-btn {
  background: none;
  border: none;
  color: var(--text-3);
  cursor: pointer;
  padding: 4px;
  font-size: 15px;
  display: flex;
  align-items: center;
  transition: color 0.15s;
  flex-shrink: 0;
}
.logout-btn:hover { color: var(--red); }

/* ================================================================
   MAIN CONTENT AREA
================================================================ */
.g-main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg-base);
}

/* Sticky page header (desktop) */
.g-page-hd {
  padding: 20px 32px 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg-base);
  position: sticky;
  top: 0;
  z-index: 50;
}

.page-title {
  font-size: 21px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
}

.page-sub {
  font-size: 12.5px;
  color: var(--text-3);
  margin-top: 2px;
  padding-bottom: 14px;
}

/* Content area */
.g-content {
  padding: 24px 32px;
  flex: 1;
  max-width: 960px;
  width: 100%;
}

/* ================================================================
   MOBILE HEADER
================================================================ */
.m-header {
  display: none;
  position: sticky;
  top: 0;
  z-index: 90;
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--border);
  padding: 11px 16px;
  align-items: center;
  justify-content: space-between;
}

.m-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
}

.m-brand-mark {
  width: 28px;
  height: 28px;
  background: var(--accent);
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.m-user-area { display: flex; align-items: center; gap: 8px; }
.m-user-tag {
  font-size: 11px;
  color: var(--text-2);
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  padding: 3px 9px;
  border-radius: var(--r-xs);
}

/* ================================================================
   MOBILE BOTTOM NAV
================================================================ */
.m-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg-sidebar);
  border-top: 1px solid var(--border);
  z-index: 90;
  padding: 4px 0 calc(4px + env(safe-area-inset-bottom));
}

.m-nav-row { display: flex; }

.m-nb {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 4px;
  background: none;
  border: none;
  color: var(--text-3);
  font-size: 9.5px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  transition: color 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.m-nb .mn-i { font-size: 18px; line-height: 1; }
.m-nb.a { color: var(--accent); }

/* ================================================================
   SECTION HEADERS
================================================================ */
.sec-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 0 10px;
}

.sec-hd:first-child { margin-top: 0; }

.sec-label {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.09em;
}

/* ================================================================
   CARDS
================================================================ */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 18px;
  overflow: hidden;
}

.card-body { padding: 18px 20px; }

/* ================================================================
   STAT BOXES
================================================================ */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}

.stat-box {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px;
}

.stat-lbl {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

.stat-val {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 600;
  color: var(--text-1);
  margin-top: 5px;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.stat-val.c-accent { color: var(--accent); }
.stat-val.c-gold   { color: var(--gold); }
.stat-val.c-green  { color: var(--green); }
.stat-val.c-red    { color: var(--red); }

/* ================================================================
   DATA TABLES
================================================================ */
.dt { width: 100%; border-collapse: collapse; }

.dt thead { background: var(--bg-surface-2); }

.dt th {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 9px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.dt th.r { text-align: right; }
.dt th.c { text-align: center; }

.dt td {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
  color: var(--text-1);
  vertical-align: middle;
}

.dt td.r { text-align: right; }
.dt td.c { text-align: center; }
.dt td.muted { color: var(--text-2); }
.dt tr:last-child td { border-bottom: none; }
.dt tbody tr:hover td { background: var(--bg-surface-2); }

.dt-num {
  font-family: var(--font-mono);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--text-1);
}

/* ================================================================
   PROGRESS BAR
================================================================ */
.prog {
  height: 5px;
  background: var(--bg-surface-3);
  border-radius: 99px;
  overflow: hidden;
}
.prog-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s;
  min-width: 2px;
}
.prog-bar.g { background: var(--green); }
.prog-bar.gold { background: var(--gold); }

/* ================================================================
   PRODUCT TRACKING ROWS
================================================================ */
.prod-row {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}
.prod-row:last-child { border-bottom: none; }

.prod-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-1);
}
.prod-meta {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 2px;
}
.prod-prog-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.prod-nums {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-2);
  white-space: nowrap;
  min-width: 72px;
  font-weight: 500;
}
.prod-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}
.qbtn {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border-2);
  background: var(--bg-surface-2);
  color: var(--text-1);
  border-radius: var(--r-xs);
  font-size: 18px;
  font-weight: 400;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  transition: background 0.12s, border-color 0.12s;
  flex-shrink: 0;
}
.qbtn:hover:not(:disabled) { background: var(--bg-surface-3); border-color: var(--accent); }
.qbtn:active:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }
.qbtn:disabled { opacity: 0.35; cursor: not-allowed; }
[data-inc] { background: var(--accent-dim); border-color: rgba(192,87,30,0.35); color: var(--accent); }
[data-admininc] { background: var(--accent-dim); border-color: rgba(192,87,30,0.35); color: var(--accent); }
.qty-disp {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 15px;
  min-width: 30px;
  text-align: center;
  color: var(--text-1);
}

/* ================================================================
   BUTTONS
================================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: var(--r-sm);
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
  white-space: nowrap;
  text-decoration: none;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: scale(0.98); }

.btn.pri  { background: var(--accent); color: #fff; }
.btn.pri:hover:not(:disabled) { background: var(--accent-h); }

.btn.gho  { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
.btn.gho:hover:not(:disabled) { background: var(--bg-surface-2); color: var(--text-1); border-color: var(--border-2); }

.btn.dan  { background: var(--red-dim); color: #F5A090; border: 1px solid rgba(168,56,40,0.35); }
.btn.dan:hover:not(:disabled) { background: var(--red); color: #fff; }

.btn.full { width: 100%; }

.btn.sm   { padding: 5px 10px; font-size: 12px; }

/* ================================================================
   BADGES
================================================================ */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--r-xs);
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border: 1px solid;
}
.badge.def  { background: var(--bg-surface-2); color: var(--text-2); border-color: var(--border); }
.badge.acc  { background: var(--accent-dim);   color: var(--accent); border-color: rgba(192,87,30,0.35); }
.badge.grn  { background: var(--green-dim);    color: var(--green);  border-color: rgba(74,130,53,0.35); }
.badge.red  { background: var(--red-dim);      color: #F5A090;       border-color: rgba(168,56,40,0.35); }
.badge.gld  { background: var(--gold-dim);     color: var(--gold);   border-color: rgba(184,136,42,0.35); }

/* ================================================================
   WORKER ACCORDION
================================================================ */
.worker-hd {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: background 0.12s;
}
.worker-hd:hover { background: var(--bg-surface-2); }
.worker-hd:last-child { border-bottom: none; }

.w-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-surface-3);
  border: 1px solid var(--border-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
  text-transform: uppercase;
  flex-shrink: 0;
}
.w-info { flex: 1; min-width: 0; }
.w-name { font-weight: 600; font-size: 13.5px; color: var(--text-1); }
.w-meta { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.w-chevron { color: var(--text-3); font-size: 11px; flex-shrink: 0; }

.worker-body {
  background: var(--bg-base);
  border-bottom: 1px solid var(--border);
}

/* ================================================================
   TASK ITEMS
================================================================ */
.task-item {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.task-item:last-child { border-bottom: none; }

.task-chk {
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--border-2);
  border-radius: var(--r-xs);
  background: var(--bg-surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: transparent;
  flex-shrink: 0;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 1px;
}
.task-chk.done {
  background: var(--green-dim);
  border-color: var(--green);
  color: var(--green);
}

.task-body { flex: 1; min-width: 0; }
.task-name { font-weight: 600; font-size: 14px; color: var(--text-1); }
.task-name.done-text { text-decoration: line-through; color: var(--text-3); }
.task-foot {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.task-actions { flex-shrink: 0; display: flex; gap: 6px; }

/* ================================================================
   EVENT ITEMS
================================================================ */
.event-item {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 16px;
}
.event-item:last-child { border-bottom: none; }

.event-date {
  text-align: center;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  min-width: 52px;
  flex-shrink: 0;
}
.event-day {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 600;
  color: var(--text-1);
  line-height: 1;
}
.event-mon {
  font-size: 9.5px;
  text-transform: uppercase;
  color: var(--text-3);
  letter-spacing: 0.06em;
  margin-top: 3px;
}

.event-body { flex: 1; min-width: 0; }
.event-title { font-weight: 600; font-size: 14px; color: var(--text-1); }
.event-desc { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
.event-time { font-size: 12px; color: var(--text-2); margin-top: 5px; display: flex; align-items: center; gap: 5px; }
.event-actions { flex-shrink: 0; }

/* ================================================================
   CONFIG ROWS
================================================================ */
.cfg-row {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.cfg-row:last-child { border-bottom: none; }
.cfg-row-info { flex: 1; min-width: 0; }
.cfg-row-name { font-weight: 600; font-size: 13.5px; color: var(--text-1); }
.cfg-row-meta { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.cfg-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ================================================================
   PROJECTION METRICS
================================================================ */
.proj-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 20px;
  border-bottom: 1px solid var(--border);
}
.proj-row:last-child { border-bottom: none; }
.proj-lbl { font-size: 13px; color: var(--text-2); }
.proj-val {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 14px;
  color: var(--text-1);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.proj-val.pos { color: var(--green); }
.proj-val.neg { color: var(--red); }
.proj-val.gold { color: var(--gold); }

/* ================================================================
   SUBTABS (Mozos / Anfitrionas)
================================================================ */
.subtab-row {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
  overflow-x: auto;
}
.st {
  padding: 9px 20px;
  background: none;
  border: none;

/* ================================================================

================================================================ */

window.onerror = function(m,s,l) {

    document.getElementById('root').insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:20px;left:12px;right:12px;background:#2A0E08;color:#F5A090;border:1px solid #6B2018;padding:10px 14px;border-radius:8px;font-size:12px;z-index:999">Error: '+m+' (línea '+l+')</div>'
    );

<script>
(function(){
// ================================================================
// API ENDPOINT CONFIG
// ================================================================
const CONFIG_KEY = 'sazon_api_url';
if (localStorage.getItem(CONFIG_KEY) && localStorage.getItem(CONFIG_KEY).includes('christian-97.workers.dev')) {
  localStorage.removeItem(CONFIG_KEY);
}
const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
const DEFAULT_REMOTE_API = 'https://sazon-api.christhiangutierrezrosas.workers.dev';
const API_URL = localStorage.getItem(CONFIG_KEY) || (isLocalhost ? window.location.origin : DEFAULT_REMOTE_API);

// ================================================================
// API CLIENT
// ================================================================
const api = {
  token: localStorage.getItem('sazon_auth_token') || null,
  setToken(t) {
    this.token = t;
    if (t) localStorage.setItem('sazon_auth_token', t);
    else localStorage.removeItem('sazon_auth_token');
  },
  async request(path, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    if (this.token) headers['Authorization'] = `Bearer ${this.token}`;
    const res = await fetch(`${API_URL}${path}`, { ...options, headers });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error en la solicitud a la API');
    return data;
  },
  async health() { return this.request('/api/health'); },
  async login(code) {
    const data = await this.request('/api/auth/login', { method: 'POST', body: JSON.stringify({ code }) });
    if (data.token) this.setToken(data.token);
    return data;
  },
  async getUsers() { return this.request('/api/users'); },
  async createUser(u) { return this.request('/api/users', { method: 'POST', body: JSON.stringify(u) }); },
  async updateUser(id, u) { return this.request(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify(u) }); },
  async getProducts(all = false) { return this.request(`/api/products${all ? '?all=true' : ''}`); },
  async createProduct(p) { return this.request('/api/products', { method: 'POST', body: JSON.stringify(p) }); },
  async updateProduct(id, p) { return this.request(`/api/products/${id}`, { method: 'PUT', body: JSON.stringify(p) }); },
  async deleteProduct(id) { return this.request(`/api/products/${id}`, { method: 'DELETE' }); },
  async getSales(params = {}) {
    const qs = new URLSearchParams(params).toString();
    return this.request(`/api/sales${qs ? '?' + qs : ''}`);
  },
  async recordSale(s) { return this.request('/api/sales', { method: 'POST', body: JSON.stringify(s) }); },
  async updateSale(id, s) { return this.request(`/api/sales/${id}`, { method: 'PUT', body: JSON.stringify(s) }); },
  async getGoals(params = {}) {
    const qs = new URLSearchParams(params).toString();
    return this.request(`/api/goals${qs ? '?' + qs : ''}`);
  },
  async saveGoal(g) { return this.request('/api/goals', { method: 'POST', body: JSON.stringify(g) }); },
  async getPromotions() { return this.request('/api/promotions'); },
  async createPromotion(p) { return this.request('/api/promotions', { method: 'POST', body: JSON.stringify(p) }); },
  async getTasks() { return this.request('/api/tasks'); },
  async createTask(t) { return this.request('/api/tasks', { method: 'POST', body: JSON.stringify(t) }); },
  async updateTask(id, t) { return this.request(`/api/tasks/${id}`, { method: 'PUT', body: JSON.stringify(t) }); },
  async deleteTask(id) { return this.request(`/api/tasks/${id}`, { method: 'DELETE' }); },
  async toggleTask(id, completed, observations) {
    return this.request(`/api/tasks/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ action: 'toggle_complete', completed, observations })
    });
  },
  async getEvents() { return this.request('/api/events'); },
  async createEvent(e) { return this.request('/api/events', { method: 'POST', body: JSON.stringify(e) }); },
  async deleteEvent(id) { return this.request(`/api/events/${id}`, { method: 'DELETE' }); },
  async getKpi(params = {}) {
    const qs = new URLSearchParams(params).toString();
    return this.request(`/api/kpi${qs ? '?' + qs : ''}`);
  }
};

// ================================================================
// GLOBAL STATE
// ================================================================
function today() { return new Date(); }
function dim() { const d = today(); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }

const S = {
  session: JSON.parse(localStorage.getItem('sazon_session') || 'null'),
  tab: 'ventas',
  sub: 'mozo',
  toast: null,
  modal: null,
  expandedWaiter: null,
  loading: false,
  users: [],
  products: [],
  sales: [],
  goals: { storeTargets: [], productGoals: [] },
  promotions: [],
  tasks: [],
  events: [],
  kpi: null,
  monthDays: dim(),
  currentDay: today().getDate()
};

function saveSession(sess) {
  S.session = sess;
  if (sess) localStorage.setItem('sazon_session', JSON.stringify(sess));
  else localStorage.removeItem('sazon_session');
}

function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function money(n) { return 'S/ ' + (Math.round(n || 0)).toLocaleString('es-PE'); }
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }
function toast(m) { S.toast = m; render(); setTimeout(() => { S.toast = null; render(); }, 2200); }
function openM(type, data) { S.modal = { type, data: data || {} }; render(); }
function closeM() { S.modal = null; render(); }

// ================================================================
// DATA SYNC
// ================================================================
async function syncFromD1() {
  if (!S.session) return;
  S.loading = true;
  try {
    const now = today();
    const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const [uRes, pRes, sRes, gRes, tRes, eRes, kRes, proRes] = await Promise.all([
      api.getUsers(),
      api.getProducts(true),
      api.getSales({ month: currentMonth }),
      api.getGoals({ month: currentMonth }),
      api.getTasks(),
      api.getEvents(),
      api.getKpi({ month: currentMonth }),
      api.getPromotions().catch(() => ({ promotions: [] }))
    ]);
    S.users      = uRes.users      || [];
    S.products   = pRes.products   || [];
    S.sales      = sRes.sales      || [];
    S.goals      = gRes;
    S.tasks      = tRes.tasks      || [];
    S.events     = eRes.events     || [];
    S.kpi        = kRes;
    S.promotions = proRes.promotions || [];
  } catch (e) {
    console.error('Error sincronizando con D1:', e);
    toast('Aviso: ' + e.message);
  } finally {
    S.loading = false;
    render();
  }
}

// ================================================================
// DATA HELPERS
// ================================================================
function catalog(role) {
  return S.products.filter(p => p.active && (p.target_role === 'ALL' || p.target_role === (role || 'MOZO').toUpperCase()));
}

function goalForProduct(productId, workerId) {
  let found;
  if (workerId) {
    found = (S.goals.productGoals || []).find(g => g.product_id === productId && g.worker_id === workerId);
    if (!found) found = (S.goals.productGoals || []).find(g => g.product_id === productId && (g.worker_id === null || g.worker_id === undefined || g.worker_id === ''));
  } else {
    found = (S.goals.productGoals || []).find(g => g.product_id === productId && (g.worker_id === null || g.worker_id === undefined || g.worker_id === ''));
  }
  if (found) return found.target_quantity;
  const p = S.products.find(x => x.id === productId);
  return (p && p.name === '1/4 Pollo') ? 200 : 40;
}

function qtyForWorkerProduct(workerId, productId) {
  return S.sales
    .filter(s => s.worker_id === workerId && s.product_id === productId)
    .reduce((acc, s) => acc + (s.quantity || 0), 0);
}

function totalPollosForWorker(workerId) {
  const pCuarto = S.products.find(p => p.name === '1/4 Pollo');
  if (!pCuarto) return 0;
  return qtyForWorkerProduct(workerId, pCuarto.id) / 4;
}

function goalPace(goal) {
  return Math.round(goal * (S.currentDay / S.monthDays));
}

// ================================================================
// VIEW: LOGIN
// ================================================================
function vLogin() {
  return `
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-mark">S</div>
        <div>
          <div class="login-brand-name">Sazón</div>
          <div class="login-brand-sub">Sistema de gestión</div>
        </div>
      </div>
      <div class="field">
        <label>Código de empleado</label>
        <input id="lc" type="password" placeholder="••••"
          style="font-size:22px;letter-spacing:5px;text-align:center;padding:14px">
      </div>
      <div class="login-err" id="le"></div>
      <button class="btn pri full" id="lb" style="padding:12px;font-size:14px">
        Ingresar al sistema
      </button>
    </div>
  </div>`;
}

function wLogin(r) {
  const ic = r.querySelector('#lc'), b = r.querySelector('#lb'), e = r.querySelector('#le');
  async function go() {
    const c = ic.value.trim();
    if (!c) { e.textContent = 'Ingresa tu código de empleado.'; return; }
    b.disabled = true;
    b.innerHTML = '<span class="spinner"></span> Verificando...';
    try {
      const data = await api.login(c);
      saveSession(data.user);
      S.tab = 'ventas';
      await syncFromD1();
    } catch (err) {
      e.textContent = err.message || 'Código no reconocido.';
      b.disabled = false;
      b.textContent = 'Ingresar al sistema';
    }
  }
  b.addEventListener('click', go);
  ic.addEventListener('keydown', ev => { if (ev.key === 'Enter') go(); });
}

// VIEW: VENTAS (USUARIO)

function vVentasUser() {
  const w = S.session;
  const prods = catalog(w.role);
  const done = prods.filter(p => qtyForWorkerProduct(w.id, p.id) >= goalForProduct(p.id, w.id)).length;
  const pollos = totalPollosForWorker(w.id);

  let html = `
  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-lbl">Metas logradas</div>
      <div class="stat-val c-accent">${done} / ${prods.length}</div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">Pollos (apoyo)</div>
      <div class="stat-val">${pollos.toFixed(1)}</div>
    </div>
  </div>`;

  html += `<div class="sec-hd"><div class="sec-label">Seguimiento de productos</div></div>`;
  html += `<div class="card" style="padding:0">`;

  if (prods.length === 0) {
    html += `<div class="empty-box"><div class="empty-icon">📋</div><div class="empty-title">Sin productos asignados</div><div class="empty-hint">No hay productos activos para tu rol en este momento.</div></div>`;
  } else {
    prods.forEach(prod => {
      const g    = goalForProduct(prod.id, w.id);
      const q    = qtyForWorkerProduct(w.id, prod.id);
      const pace = goalPace(g);
      const p    = pct(q, g);
      const ahead = q >= pace;
      const pBar = Math.min(100, p);
      html += `
      <div class="prod-row">
        <div>
          <div class="prod-name">${esc(prod.name)}</div>
          <div class="prod-meta">S/ ${prod.price.toFixed(2)} · Ritmo esperado: <span style="color:${ahead ? 'var(--green)' : 'var(--red)'};font-weight:600">${pace}</span></div>
          <div class="prod-prog-row">
            <div class="prod-nums">${q} / ${g} u.</div>
            <div class="prog" style="flex:1"><div class="prog-bar ${ahead ? 'g' : ''}" style="width:${pBar}%"></div></div>
            <div class="prod-nums" style="text-align:right;min-width:36px">${p}%</div>
          </div>
        </div>
        <div class="prod-controls">
          <button class="qbtn" data-dec="${prod.id}" title="Restar 1">−</button>
          <span class="qty-disp">${q}</span>
          <button class="qbtn" data-inc="${prod.id}" title="Sumar 1">+</button>
        </div>
      </div>`;
    });
  }
  html += `</div>`;

  html += `<div class="sec-hd" style="margin-top:20px"><div class="sec-label">Equipo — ${w.role === 'MOZO' ? 'Mozos' : 'Anfitrionas'}</div></div>`;
  html += `<div class="card" style="padding:0">`;
  const team = S.users.filter(x => x.role === w.role && x.active);
  if (team.length === 0) {
    html += `<div class="empty-box"><div class="empty-icon">👥</div><div class="empty-title">Sin colaboradores</div><div class="empty-hint">No hay colaboradores activos en tu rol.</div></div>`;
  } else {
    html += `<table class="dt"><thead><tr>
      <th>Colaborador</th><th class="r">Metas</th>
    </tr></thead><tbody>`;
    team.forEach(x => {
      const d2 = prods.filter(p => qtyForWorkerProduct(x.id, p.id) >= goalForProduct(p.id, x.id)).length;
      const isMe = x.id === w.id;
      html += `<tr>
        <td><span class="fw600">${esc(x.name)}</span>${isMe ? ' <span class="badge acc" style="margin-left:6px">tú</span>' : ''}</td>
        <td class="r dt-num">${d2} / ${prods.length}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;
  return html;
}

// VIEW: TAREAS
// ================================================================
function vTareas() {
  const isAdmin = S.session.role === 'ADMIN';
  let html = '';

  if (isAdmin) {
    html += `<div class="flex-end" style="margin-bottom:16px;justify-content:flex-start">
      <button class="btn pri" id="add-task">+ Nueva tarea</button>
    </div>`;
  }

  html += `<div class="card" style="padding:0">`;

  if (S.tasks.length === 0) {
    html += `<div class="empty-box">
      <div class="empty-icon">✅</div>
      <div class="empty-title">Sin tareas pendientes</div>
      <div class="empty-hint">${isAdmin ? 'Crea una tarea para asignarla al equipo.' : 'No tienes tareas asignadas en este momento.'}</div>
    </div>`;
  } else {
    const now = today();
    S.tasks.forEach(t => {
      const dl       = new Date(t.deadline + 'T23:59:59');
      const diffD    = Math.ceil((dl - now) / 86400000);
      const late     = diffD < 0;
      const myAssign = (t.assignees || []).find(a => a.user_id === S.session.id);
      const done     = myAssign && myAssign.completed;

      html += `<div class="task-item">`;

      if (!isAdmin) {
        html += `<div class="task-chk ${done ? 'done' : ''}" data-donetask="${t.id}" title="Marcar tarea">${done ? '✓' : ''}</div>`;
      }

      html += `<div class="task-body">
        <div class="task-name${done ? ' done-text' : ''}">${esc(t.name)}</div>
        <div class="task-foot">
          <span class="badge ${late ? 'red' : 'def'}">${late ? 'Vencida hace ' + Math.abs(diffD) + ' d' : 'Plazo: ' + diffD + ' d'}</span>
          <span class="text-muted">${t.deadline}</span>
        </div>`;

      if (myAssign && myAssign.observations) {
        html += `<div style="margin-top:6px;font-size:12px;color:var(--text-3);font-style:italic">"${esc(myAssign.observations)}"</div>`;
      }

      if (isAdmin) {
        const completedList = (t.assignees || []).filter(a => a.completed);
        if (completedList.length === 0) {
          html += `<div style="margin-top:6px;font-size:12px;color:var(--text-3)">Pendiente — ningún colaborador la ha completado aún.</div>`;
        } else {
          completedList.forEach(c => {
            html += `<div style="margin-top:4px;font-size:12px;color:var(--green)">✓ ${esc(c.worker_name || '')}${c.observations ? ' — "' + esc(c.observations) + '"' : ''}</div>`;
          });
        }
      }

      html += `</div>`;

      if (isAdmin) {
        html += `<div class="task-actions">
          <button class="btn dan sm" data-deltask="${t.id}" title="Eliminar tarea">✕</button>
        </div>`;
      }

      html += `</div>`;
    });
  }

  html += `</div>`;
  return html;
}

    title = 'Configuración de endpoint';
    f = `<div class="field"><label>URL del Worker sazon-api</label><input id="mf-api" type="text" value="${esc(API_URL)}"></div>`;
  } else if (m.type === 'add-prod') {
    title = 'Nuevo producto — ' + m.data.role;
    f = `
    <div class="field"><label>Nombre del producto</label><input id="mf-name" type="text" placeholder="Ej: 1/2 Pollo a la Brasa"></div>
    <div class="field"><label>Categoría</label><input id="mf-cat" type="text" placeholder="POLLOS, BEBIDAS, PARRILLAS..."></div>
    <div class="field"><label>Precio de venta (S/)</label><input id="mf-price" type="number" step="0.5" value="20"></div>`;
  } else if (m.type === 'edit-goal') {
    const prod = S.products.find(p => p.id === m.data.id);
    const curr = goalForProduct(m.data.id, null);
    title = 'Editar meta — ' + esc(prod ? prod.name : '');
    f = `<div class="field"><label>Meta mensual en unidades</label><input id="mf-goal" type="number" value="${curr}"></div>`;
  } else if (m.type === 'add-user') {
    title = 'Nuevo colaborador';
    f = `
    <div class="field"><label>Nombre completo</label><input id="mf-name" type="text" placeholder="Ej: Juan Pérez"></div>
    <div class="field"><label>Código de empleado</label><input id="mf-code" type="text" placeholder="Ej: 1011"></div>
    <div class="field"><label>Rol</label><select id="mf-role"><option value="MOZO">Mozo</option><option value="ANFITRIONA">Anfitriona</option></select></div>`;
  } else if (m.type === 'add-admin') {
    title = 'Nuevo administrador';
    f = `
    <div class="field"><label>Nombre</label><input id="mf-name" type="text" placeholder="Ej: Administrador Turno"></div>
    <div class="field"><label>Código de acceso</label><input id="mf-code" type="text" placeholder="Ej: 2581"></div>`;
  } else if (m.type === 'edit-profile') {
    const u = S.users.find(x => x.id === m.data.id) || S.session;
    title = 'Editar datos — ' + esc(u.name);
    f = `
    <div class="field"><label>Nombre</label><input id="mf-name" type="text" value="${esc(u.name)}"></div>
    <div class="field"><label>Código de acceso</label><input id="mf-code" type="text" value="${esc(u.code)}"></div>`;
  } else if (m.type === 'add-task') {
    title = 'Nueva tarea';
    f = `
    <div class="field"><label>Descripción</label><input id="mf-name" type="text" placeholder="Ej: Limpieza de estación 2"></div>
    <div class="field"><label>Fecha límite</label><input id="mf-date" type="date"></div>`;
  } else if (m.type === 'add-event') {
    title = 'Nuevo evento';
    f = `
    <div class="field"><label>Título</label><input id="mf-name" type="text" placeholder="Ej: Briefing de turno noche"></div>
    <div class="field"><label>Fecha</label><input id="mf-date" type="date"></div>
    <div class="field"><label>Hora</label><input id="mf-time" type="time" value="10:00"></div>
    <div class="field"><label>Detalles</label><input id="mf-desc" type="text" placeholder="Observaciones o temas a tratar"></div>`;
  } else if (m.type === 'task-note') {
    title = 'Completar tarea';
    f = `<div class="field"><label>Observación (opcional)</label><input id="mf-note" type="text" placeholder="Ej: Realizado junto al equipo"></div>`;
  } else if (m.type === 'edit-store-target') {
    const curr = (S.kpi && S.kpi.kpis && S.kpi.kpis.totalTarget) || 350000;
    title = 'Meta financiera mensual';
    f = `<div class="field"><label>Monto proyectado (S/)</label><input id="mf-target" type="number" value="${curr}"></div>`;
  }

  return `
  <div class="mbd" id="mbd">
    <div class="mbox">
      <h3>${title}</h3>
      ${f}
      <button class="btn pri full" id="m-save" style="margin-top:8px">Guardar cambios</button>
      <div style="height:8px"></div>
      <button class="btn gho full" id="m-cancel">Cancelar</button>
    </div>
  </div>`;
}

// ================================================================
// RENDER — MAIN
// ================================================================
const NAV_ITEMS = [
  { id: 'ventas',     icon: '📋', label: 'Ventas' },
  { id: 'general',   icon: '🎯', label: 'Metas' },
  { id: 'proyectado',icon: '📈', label: 'Proyectado' },
  { id: 'tareas',    icon: '✅', label: 'Tareas' },
  { id: 'cronos',    icon: '📅', label: 'Cronograma' },
  { id: 'config',    icon: '⚙️', label: 'Config' },
];

const PAGE_INFO = {
  ventas:     { t: (a,r) => a ? 'Ventas por Personal' : 'Mi Desempeño',         s: (a) => a ? 'Seguimiento de comandas y desempeño del equipo' : 'Control de metas y registros de tu turno' },
  general:    { t: () => 'Metas del Período',       s: () => 'Avance consolidado de metas por producto y tienda' },
  proyectado: { t: () => 'Proyección Financiera',   s: () => 'Análisis de ritmo y estimación de cierre mensual' },
  tareas:     { t: (a) => a ? 'Tareas Operativas' : 'Mis Tareas',               s: (a) => a ? 'Asignación y seguimiento de tareas del equipo' : 'Tareas pendientes de tu turno' },
  cronos:     { t: () => 'Cronograma',              s: () => 'Reuniones, eventos y actividades del restaurante' },
  config:     { t: (a) => a ? 'Configuración' : 'Mi Perfil',                    s: (a) => a ? 'Gestión de personal y sistema' : 'Datos de tu cuenta de acceso' },
};

function render() {
  const root = document.getElementById('root');

  if (!S.session) {
    root.innerHTML = vLogin();
    wLogin(root);
    return;
  }

  const isAdmin = S.session.role === 'ADMIN';
  const pi = PAGE_INFO[S.tab] || PAGE_INFO.ventas;
  const ptitle = pi.t(isAdmin);
  const psub   = pi.s(isAdmin);
  const uInit  = (S.session.name || '?').charAt(0).toUpperCase();

  let html = `<div class="g-shell">`;

  /* ── SIDEBAR ── */
  html += `<aside class="g-sidebar">
    <div class="sb-brand">
      <div class="sb-logo-row">
        <div class="sb-logo-mark">S</div>
        <div class="sb-logo-name">Sazón</div>
      </div>
      <div class="sb-logo-sub">Sistema de Gestión</div>
    </div>
    <nav class="sb-nav">
      <div class="sb-group-label">Operaciones</div>`;

  NAV_ITEMS.forEach(n => {
    html += `<button class="nb ${S.tab === n.id ? 'a' : ''}" data-tab="${n.id}">
      <span class="nb-icon">${n.icon}</span>${n.label}
    </button>`;
  });

  html += `</nav>
    <div class="sb-user">
      <div class="sb-avatar">${uInit}</div>
      <div class="sb-user-info">
        <div class="sb-user-name">${esc(S.session.name)}</div>
        <div class="sb-user-role">${S.session.role}</div>
      </div>
      <button class="logout-btn" id="lo" title="Cerrar sesión">⏻</button>
    </div>
  </aside>`;

  /* ── MOBILE HEADER ── */
  html += `<div class="m-header">
    <div class="m-brand">
      <div class="m-brand-mark">S</div>
      Sazón
    </div>
    <div class="m-user-area">
      <span class="m-user-tag">${esc(S.session.name)}</span>
      <button class="logout-btn" id="lo-m" title="Cerrar sesión">⏻</button>
    </div>
  </div>`;

  /* ── MAIN ── */
  html += `<main class="g-main">
    <div class="g-page-hd">
      <div class="page-title">${ptitle}</div>
      <div class="page-sub">${psub}</div>
    </div>
    <div class="g-content">`;

  if      (S.tab === 'ventas')      html += isAdmin ? vVentasAdmin() : vVentasUser();
  else if (S.tab === 'general')     html += vGeneral();
  else if (S.tab === 'proyectado')  html += vProyectado();
  else if (S.tab === 'tareas')      html += vTareas();
  else if (S.tab === 'cronos')      html += vCronogramas();
  else if (S.tab === 'config')      html += vConfig();

  html += `</div></main>`;

  /* ── MOBILE NAV ── */
  html += `<nav class="m-nav"><div class="m-nav-row">`;
  NAV_ITEMS.forEach(n => {
    html += `<button class="m-nb nb ${S.tab === n.id ? 'a' : ''}" data-tab="${n.id}">
      <span class="mn-i">${n.icon}</span>
      <span class="mn-t">${n.label}</span>
    </button>`;
  });
  html += `</div></nav>`;

  html += `</div>`; /* g-shell */

  /* Toast */
  if (S.toast) {
    const isErr = S.toast.toLowerCase().startsWith('error') || S.toast.toLowerCase().startsWith('aviso');
    html += `<div class="sazon-toast ${isErr ? 'err' : ''}">${esc(S.toast)}</div>`;
  }

  html += renderM();
  root.innerHTML = html;
  wire(root);
}

// ================================================================
// WIRE — EVENT HANDLERS
// ================================================================
function wire(root) {
  /* Logout */
  const lo  = root.querySelector('#lo');
  const loM = root.querySelector('#lo-m');
  const doLogout = () => { api.setToken(null); saveSession(null); render(); };
  if (lo)  lo.addEventListener('click', doLogout);
  if (loM) loM.addEventListener('click', doLogout);

  /* Navigation (sidebar + mobile) */
  root.querySelectorAll('.nb').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.tab) { S.tab = b.dataset.tab; render(); }
  }));

  /* Subtabs (Mozos / Anfitrionas) */
  root.querySelectorAll('.st').forEach(b => b.addEventListener('click', () => { S.sub = b.dataset.sub; render(); }));

  const isAdmin = S.session && S.session.role === 'ADMIN';

  /* ── REGISTRO DE VENTAS (USUARIO) ── */
  if (!isAdmin && S.tab === 'ventas') {
    root.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', async () => {
      b.disabled = true;
      try {
        await api.recordSale({ product_id: b.dataset.inc, quantity: 1 });
        toast('+1 unidad registrada');
        await syncFromD1();
      } catch (e) { toast('Error: ' + e.message); }
      finally { b.disabled = false; }
    }));

    root.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', async () => {
      b.disabled = true;
      try {
        await api.recordSale({ product_id: b.dataset.dec, quantity: -1 });
        toast('Ajuste −1 registrado');
        await syncFromD1();
      } catch (e) { toast('Error: ' + e.message); }
      finally { b.disabled = false; }
    }));
  }

  /* ── VENTAS ADMIN ── */
  if (isAdmin && S.tab === 'ventas') {
    root.querySelectorAll('[data-toggleuser]').forEach(b => b.addEventListener('click', () => {
      S.expandedWaiter = S.expandedWaiter === b.dataset.toggleuser ? null : b.dataset.toggleuser;
      render();
    }));

    root.querySelectorAll('[data-admininc]').forEach(b => b.addEventListener('click', async () => {
      const [wid, pid] = b.dataset.admininc.split(':');
      b.disabled = true;
      try {
        await api.recordSale({ worker_id: wid, product_id: pid, quantity: 1 });
        toast('Venta registrada');
        await syncFromD1();
      } catch (e) { toast('Error: ' + e.message); }
      finally { b.disabled = false; }
    }));

    root.querySelectorAll('[data-admindec]').forEach(b => b.addEventListener('click', async () => {
      const [wid, pid] = b.dataset.admindec.split(':');
      b.disabled = true;
      try {
        await api.recordSale({ worker_id: wid, product_id: pid, quantity: -1 });
        toast('Ajuste registrado');
        await syncFromD1();
      } catch (e) { toast('Error: ' + e.message); }
      finally { b.disabled = false; }
    }));

    const apb = root.querySelector('#add-prod-btn');
    if (apb) apb.addEventListener('click', () => openM('add-prod', { role: apb.dataset.role }));
  }

  /* ── ACCIONES GENERALES ── */
  root.querySelectorAll('[data-editgoal]').forEach(b => b.addEventListener('click', () => openM('edit-goal', { id: b.dataset.editgoal, role: b.dataset.role || 'GENERAL' })));
  root.querySelectorAll('[data-editprofile]').forEach(b => b.addEventListener('click', () => openM('edit-profile', { id: b.dataset.editprofile })));
  root.querySelectorAll('[data-editadmin]').forEach(b => b.addEventListener('click', () => openM('edit-profile', { id: b.dataset.editadmin })));

  const emp = root.querySelector('#edit-my-profile');
  if (emp) emp.addEventListener('click', () => openM('edit-profile', { id: S.session.id }));

  const au  = root.querySelector('#add-user');
  if (au) au.addEventListener('click', () => openM('add-user'));

  const aab = root.querySelector('#add-admin-btn');
  if (aab) aab.addEventListener('click', () => openM('add-admin'));

  const at = root.querySelector('#add-task');
  if (at) at.addEventListener('click', () => openM('add-task'));

  const ae = root.querySelector('#add-event');
  if (ae) ae.addEventListener('click', () => openM('add-event'));

  const est = root.querySelector('#edit-store-target');
  if (est) est.addEventListener('click', () => openM('edit-store-target'));

  const ce = root.querySelector('#cfg-endpoint');
  if (ce) ce.addEventListener('click', () => openM('config-api'));

  /* ── PRODUCTOS: DESACTIVAR ── */
  root.querySelectorAll('[data-delprod]').forEach(b => b.addEventListener('click', async () => {
    const prodId = b.dataset.delprod;
    const prod   = S.products.find(p => p.id === prodId);
    if (!prod) return;
    if (!confirm(`¿Desactivar el producto "${prod.name}"? Quedará oculto del catálogo.`)) return;
    b.disabled = true;
    try {
      await api.deleteProduct(prodId);
      toast('Producto desactivado');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); b.disabled = false; }
  }));

  /* ── TAREAS: ELIMINAR (admin) ── */
  root.querySelectorAll('[data-deltask]').forEach(b => b.addEventListener('click', async () => {
    const taskId = b.dataset.deltask;
    const task   = S.tasks.find(t => t.id === taskId);
    if (!task) return;
    if (!confirm(`¿Eliminar la tarea "${task.name}"?`)) return;
    b.disabled = true;
    try {
      await api.deleteTask(taskId);
      toast('Tarea eliminada');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); b.disabled = false; }
  }));

  /* ── TAREAS: MARCAR / DESMARCAR ── */
  root.querySelectorAll('[data-donetask]').forEach(b => b.addEventListener('click', () => {
    const tid    = b.dataset.donetask;
    const task   = S.tasks.find(t => t.id === tid);
    const assign = (task.assignees || []).find(a => a.user_id === S.session.id);
    if (assign && assign.completed) {
      api.toggleTask(tid, 0, '').then(() => { toast('Tarea desmarcada'); syncFromD1(); });
    } else {
      openM('task-note', { taskId: tid });
    }
  }));

  /* ── EVENTOS: ELIMINAR ── */
  root.querySelectorAll('[data-delevent]').forEach(b => b.addEventListener('click', async () => {
    try {
      await api.deleteEvent(b.dataset.delevent);
      toast('Evento eliminado');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); }
  }));

  /* ── MODAL: GUARDAR / CANCELAR ── */
  const mc  = root.querySelector('#m-cancel');
  if (mc) mc.addEventListener('click', closeM);

  const mbd = root.querySelector('#mbd');
  if (mbd) mbd.addEventListener('click', e => { if (e.target === mbd) closeM(); });

  const ms = root.querySelector('#m-save');
  if (ms) ms.addEventListener('click', async () => {
    const m = S.modal;
    if (!m) return;
    const v = id => { const el = root.querySelector('#' + id); return el ? el.value.trim() : ''; };
    ms.disabled = true;
    try {
      if (m.type === 'config-api') {
        const url = v('mf-api');
        if (url) { localStorage.setItem(CONFIG_KEY, url); location.reload(); }

      } else if (m.type === 'add-prod') {
        const name     = v('mf-name');
        const category = v('mf-cat') || 'GENERAL';
        const price    = parseFloat(v('mf-price')) || 0;
        await api.createProduct({ name, category, price, target_role: m.data.role });
        toast('Producto agregado'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-goal') {
        const g = parseFloat(v('mf-goal')) || 0;
        await api.saveGoal({ type: 'PRODUCT_GOAL', product_id: m.data.id, target_quantity: g });
        toast('Meta actualizada'); closeM(); await syncFromD1();

      } else if (m.type === 'add-user') {
        const name = v('mf-name'), code = v('mf-code'), role = v('mf-role');
        await api.createUser({ name, code, role });
        toast('Colaborador creado'); closeM(); await syncFromD1();

      } else if (m.type === 'add-admin') {
        const name = v('mf-name'), code = v('mf-code');
        await api.createUser({ name, code, role: 'ADMIN' });
        toast('Administrador creado'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-profile') {
        const name = v('mf-name'), code = v('mf-code');
        await api.updateUser(m.data.id, { name, code });
        toast('Perfil actualizado'); closeM(); await syncFromD1();

      } else if (m.type === 'add-task') {
        const name = v('mf-name'), deadline = v('mf-date');
        await api.createTask({ name, deadline });
        toast('Tarea creada'); closeM(); await syncFromD1();

      } else if (m.type === 'add-event') {
        const title       = v('mf-name');
        const event_date  = v('mf-date');
        const event_time  = v('mf-time');
        const description = v('mf-desc');
        await api.createEvent({ title, event_date, event_time, description });
        toast('Evento programado'); closeM(); await syncFromD1();

      } else if (m.type === 'task-note') {
        const note = v('mf-note');
        await api.toggleTask(m.data.taskId, 1, note);
        toast('Tarea completada'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-store-target') {
        const target = parseFloat(v('mf-target')) || 350000;
        await api.saveGoal({ type: 'STORE_TARGET', target_amount: target });
        toast('Meta de tienda actualizada'); closeM(); await syncFromD1();
      }
    } catch (err) {
      toast('Error: ' + err.message);
    } finally {
      ms.disabled = false;
    }
  });
}

// ================================================================
// INIT
// ================================================================
render();
if (S.session) syncFromD1();

})();
</script>
</body>
</html>
