<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sazón — Gestión Operativa</title>
<meta name="description" content="Sistema interno de gestión operativa · Sazón Restaurante">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ================================================================
   DESIGN TOKENS
================================================================ */
:root {
  /* Backgrounds */
  --bg-base:      #F7F9F7;
  --bg-sidebar:   #214936;
  --bg-surface:   #FFFFFF;
  --bg-surface-2: #F1F5F2;
  --bg-surface-3: #E5F0E9;

  /* Borders */
  --border:       #DCE5DF;
  --border-2:     #C5D4CA;

  /* Text */
  --text-1:       #1F2923;
  --text-2:       #66736B;
  --text-3:       #8A958E;

  /* Brand / Actions */
  --accent:       #2F6B4F;   /* verde principal */
  --accent-h:     #3D7F60;
  --accent-dim:   #E5F0E9;

  /* Semantic */
  --gold:         #B88A2B;
  --gold-dim:     #FBF3DC;
  --green:        #3F805C;
  --green-dim:    #E8F5EE;
  --red:          #B84A4A;
  --red-dim:      #FDEAEA;

  /* Typography */
  --font:         'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:    'IBM Plex Mono', 'Courier New', monospace;

  /* Geometry */
  --r-xs:  3px;
  --r-sm:  6px;
  --r-md:  10px;
  --r-lg:  14px;

  --sidebar-w: 226px;
}

/* ================================================================
   RESET & BASE
================================================================ */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg-base);
  color: var(--text-1);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }
button { font-family: var(--font); cursor: pointer; }
::selection { background: var(--accent); color: #fff; }

/* ================================================================
   LAYOUT SHELL
================================================================ */
#root { display: flex; min-height: 100vh; }

/* App layout: sidebar + main */
.g-shell {
  display: flex;
  width: 100%;
  min-height: 100vh;
}

/* ================================================================
   SIDEBAR
================================================================ */
.g-sidebar {
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
  overflow-x: hidden;
}

/* Brand / Logo area */
.sb-brand {
  padding: 22px 18px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sb-logo-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}

/* Reserved logo slot — replace with <img> when logo is ready */
.sb-logo-mark {
  width: 34px;
  height: 34px;
  background: var(--accent);
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.04em;
  flex-shrink: 0;
  user-select: none;
}

.sb-logo-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
}

.sb-logo-sub {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* Navigation */
.sb-nav { flex: 1; padding: 10px 0; }

.sb-group-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 14px 18px 5px;
}

.nb {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 9px 18px;
  background: none;
  border: none;
  border-left: 2px solid transparent;
  color: var(--text-2);
  font-size: 13.5px;
  font-weight: 500;
  font-family: var(--font);
  text-align: left;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  line-height: 1.3;
}

.nb:hover { color: var(--text-1); background: rgba(0,0,0,0.04); }

.nb.a {
  color: var(--accent);
  background: var(--accent-dim);
  border-left-color: var(--accent);
  font-weight: 600;
}

.nb-icon {
  font-size: 15px;
  width: 18px;
  text-align: center;
  flex-shrink: 0;
  opacity: 0.8;
}
.nb.a .nb-icon { opacity: 1; }

/* Sidebar user footer */
.sb-user {
  border-top: 1px solid var(--border);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.sb-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--bg-surface-3);
  border: 1px solid var(--border-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-2);
  flex-shrink: 0;
  text-transform: uppercase;
}

.sb-user-info { flex: 1; min-width: 0; }
.sb-user-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sb-user-role {
  font-size: 10.5px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.logout-btn {
  background: none;
  border: none;
  color: var(--text-3);
  cursor: pointer;
  padding: 4px;
  font-size: 15px;
  display: flex;
  align-items: center;
  transition: color 0.15s;
  flex-shrink: 0;
}
.logout-btn:hover { color: var(--red); }

/* ================================================================
   MAIN CONTENT AREA
================================================================ */
.g-main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg-base);
}

/* Sticky page header (desktop) */
.g-page-hd {
  padding: 20px 32px 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg-base);
  position: sticky;
  top: 0;
  z-index: 50;
}

.page-title {
  font-size: 21px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
}

.page-sub {
  font-size: 12.5px;
  color: var(--text-3);
  margin-top: 2px;
  padding-bottom: 14px;
}

/* Content area */
.g-content {
  padding: 24px 32px;
  flex: 1;
  max-width: 1200px;
  width: 100%;
}

/* ================================================================
   MOBILE HEADER
================================================================ */
.m-header {
  display: none;
  position: sticky;
  top: 0;
  z-index: 90;
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--border);
  padding: 11px 16px;
  align-items: center;
  justify-content: space-between;
}

.m-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
}

.m-brand-mark {
  width: 28px;
  height: 28px;
  background: var(--accent);
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.m-user-area { display: flex; align-items: center; gap: 8px; }
.m-user-tag {
  font-size: 11px;
  color: var(--text-2);
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  padding: 3px 9px;
  border-radius: var(--r-xs);
}

/* ================================================================
   MOBILE BOTTOM NAV
================================================================ */
.m-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg-sidebar);
  border-top: 1px solid var(--border);
  z-index: 90;
  padding: 4px 0 calc(4px + env(safe-area-inset-bottom));
}

.m-nav-row { display: flex; }

.m-nb {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 4px;
  background: none;
  border: none;
  color: var(--text-3);
  font-size: 9.5px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  transition: color 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.m-nb .mn-i { font-size: 18px; line-height: 1; }
.m-nb.a { color: var(--accent); }

/* ================================================================
   SECTION HEADERS
================================================================ */
.sec-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 0 10px;
}

.sec-hd:first-child { margin-top: 0; }

.sec-label {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.09em;
}

/* ================================================================
   CARDS
================================================================ */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 18px;
  overflow: hidden;
}

.card-body { padding: 18px 20px; }

/* ================================================================
   STAT BOXES
================================================================ */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}

.stat-box {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px;
}

.stat-lbl {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

.stat-val {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 600;
  color: var(--text-1);
  margin-top: 5px;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.stat-val.c-accent { color: var(--accent); }
.stat-val.c-gold   { color: var(--gold); }
.stat-val.c-green  { color: var(--green); }
.stat-val.c-red    { color: var(--red); }

/* ================================================================
   DATA TABLES
================================================================ */
.dt { width: 100%; border-collapse: collapse; }

.dt thead { background: var(--bg-surface-2); }

.dt th {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 9px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.dt th.r { text-align: right; }
.dt th.c { text-align: center; }

.dt td {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
  color: var(--text-1);
  vertical-align: middle;
}

.dt td.r { text-align: right; }
.dt td.c { text-align: center; }
.dt td.muted { color: var(--text-2); }
.dt tr:last-child td { border-bottom: none; }
.dt tbody tr:hover td { background: var(--bg-surface-2); }

.dt-num {
  font-family: var(--font-mono);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--text-1);
}

/* ================================================================
   PROGRESS BAR
================================================================ */
.prog {
  height: 5px;
  background: var(--bg-surface-3);
  border-radius: 99px;
  overflow: hidden;
}
.prog-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s;
  min-width: 2px;
}
.prog-bar.g { background: var(--green); }
.prog-bar.gold { background: var(--gold); }

/* ================================================================
   PRODUCT TRACKING ROWS
================================================================ */
.prod-row {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}
.prod-row:last-child { border-bottom: none; }

.prod-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-1);
}
.prod-meta {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 2px;
}
.prod-prog-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.prod-nums {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-2);
  white-space: nowrap;
  min-width: 72px;
  font-weight: 500;
}
.prod-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}
.qbtn {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border-2);
  background: var(--bg-surface-2);
  color: var(--text-1);
  border-radius: var(--r-xs);
  font-size: 18px;
  font-weight: 400;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  transition: background 0.12s, border-color 0.12s;
  flex-shrink: 0;
}
.qbtn:hover:not(:disabled) { background: var(--bg-surface-3); border-color: var(--accent); }
.qbtn:active:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }
.qbtn:disabled { opacity: 0.35; cursor: not-allowed; }
[data-inc] { background: var(--accent-dim); border-color: rgba(47,107,79,0.35); color: var(--accent); }
[data-admininc] { background: var(--accent-dim); border-color: rgba(47,107,79,0.35); color: var(--accent); }
.qty-disp {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 15px;
  min-width: 30px;
  text-align: center;
  color: var(--text-1);
}

/* ================================================================
   BUTTONS
================================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: var(--r-sm);
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
  white-space: nowrap;
  text-decoration: none;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: scale(0.98); }

.btn.pri  { background: var(--accent); color: #fff; }
.btn.pri:hover:not(:disabled) { background: var(--accent-h); }

.btn.gho  { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
.btn.gho:hover:not(:disabled) { background: var(--bg-surface-2); color: var(--text-1); border-color: var(--border-2); }

.btn.dan  { background: var(--red-dim); color: #B84A4A; border: 1px solid rgba(184,74,74,0.30); }
.btn.dan:hover:not(:disabled) { background: var(--red); color: #fff; }

.btn.full { width: 100%; }

.btn.sm   { padding: 5px 10px; font-size: 12px; }

/* ================================================================
   BADGES
================================================================ */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--r-xs);
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border: 1px solid;
}
.badge.def  { background: var(--bg-surface-2); color: var(--text-2); border-color: var(--border); }
.badge.acc  { background: var(--accent-dim);   color: var(--accent); border-color: rgba(47,107,79,0.35); }
.badge.grn  { background: var(--green-dim);    color: var(--green);  border-color: rgba(63,128,92,0.35); }
.badge.red  { background: var(--red-dim);      color: #B84A4A;       border-color: rgba(184,74,74,0.30); }
.badge.gld  { background: var(--gold-dim);     color: var(--gold);   border-color: rgba(184,138,43,0.35); }

/* ================================================================
   WORKER ACCORDION
================================================================ */
.worker-hd {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: background 0.12s;
}
.worker-hd:hover { background: var(--bg-surface-2); }
.worker-hd:last-child { border-bottom: none; }

.w-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-surface-3);
  border: 1px solid var(--border-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
  text-transform: uppercase;
  flex-shrink: 0;
}
.w-info { flex: 1; min-width: 0; }
.w-name { font-weight: 600; font-size: 13.5px; color: var(--text-1); }
.w-meta { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.w-chevron { color: var(--text-3); font-size: 11px; flex-shrink: 0; }

.worker-body {
  background: var(--bg-base);
  border-bottom: 1px solid var(--border);
}

/* ================================================================
   TASK ITEMS
================================================================ */
.task-item {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.task-item:last-child { border-bottom: none; }

.task-chk {
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--border-2);
  border-radius: var(--r-xs);
  background: var(--bg-surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: transparent;
  flex-shrink: 0;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 1px;
}
.task-chk.done {
  background: var(--green-dim);
  border-color: var(--green);
  color: var(--green);
}

.task-body { flex: 1; min-width: 0; }
.task-name { font-weight: 600; font-size: 14px; color: var(--text-1); }
.task-name.done-text { text-decoration: line-through; color: var(--text-3); }
.task-foot {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.task-actions { flex-shrink: 0; display: flex; gap: 6px; }

/* ================================================================
   EVENT ITEMS
================================================================ */
.event-item {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 16px;
}
.event-item:last-child { border-bottom: none; }

.event-date {
  text-align: center;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  min-width: 52px;
  flex-shrink: 0;
}
.event-day {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 600;
  color: var(--text-1);
  line-height: 1;
}
.event-mon {
  font-size: 9.5px;
  text-transform: uppercase;
  color: var(--text-3);
  letter-spacing: 0.06em;
  margin-top: 3px;
}

.event-body { flex: 1; min-width: 0; }
.event-title { font-weight: 600; font-size: 14px; color: var(--text-1); }
.event-desc { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
.event-time { font-size: 12px; color: var(--text-2); margin-top: 5px; display: flex; align-items: center; gap: 5px; }
.event-actions { flex-shrink: 0; }

/* ================================================================
   CONFIG ROWS
================================================================ */
.cfg-row {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.cfg-row:last-child { border-bottom: none; }
.cfg-row-info { flex: 1; min-width: 0; }
.cfg-row-name { font-weight: 600; font-size: 13.5px; color: var(--text-1); }
.cfg-row-meta { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.cfg-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ================================================================
   PROJECTION METRICS
================================================================ */
.proj-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 20px;
  border-bottom: 1px solid var(--border);
}
.proj-row:last-child { border-bottom: none; }
.proj-lbl { font-size: 13px; color: var(--text-2); }
.proj-val {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 14px;
  color: var(--text-1);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.proj-val.pos { color: var(--green); }
.proj-val.neg { color: var(--red); }
.proj-val.gold { color: var(--gold); }

/* ================================================================
   SUBTABS (Mozos / Anfitrionas)
================================================================ */
.subtab-row {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
  overflow-x: auto;
}
.st {
  padding: 9px 20px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-3);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s;
}
.st:hover { color: var(--text-2); }
.st.a { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* ================================================================
   EMPTY STATES
================================================================ */
.empty-box {
  padding: 36px 20px;
  text-align: center;
}
.empty-icon { font-size: 28px; opacity: 0.5; margin-bottom: 10px; }
.empty-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 4px;
}
.empty-hint { font-size: 12.5px; color: var(--text-3); }

/* ================================================================
   MODALS
================================================================ */
.mbd {
  position: fixed;
  inset: 0;
  background: rgba(31, 41, 35, 0.50);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 0;
}

.mbox {
  background: var(--bg-surface);
  border: 1px solid var(--border-2);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 24px 22px calc(28px + env(safe-area-inset-bottom));
  width: 100%;
  max-width: 540px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.12);
  animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}

.mbox h3 {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-1);
  margin: 0 0 20px;
  letter-spacing: -0.01em;
}

/* ================================================================
   FORM FIELDS
================================================================ */
.field { margin-bottom: 14px; }

.field label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 6px;
}

input[type=text], input[type=number], input[type=password],
input[type=date], input[type=time], select {
  width: 100%;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  color: var(--text-1);
  padding: 10px 12px;
  border-radius: var(--r-sm);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.15s;
}
input:focus, select:focus { border-color: var(--accent); background: var(--bg-surface-3); }
select option { background: var(--bg-surface-2); }

/* ================================================================
   TOAST
================================================================ */
.sazon-toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-surface-3);
  border: 1px solid var(--border-2);
  color: var(--text-1);
  padding: 9px 18px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 500;
  z-index: 300;
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.10);
}
.sazon-toast.err {
  background: var(--red-dim);
  border-color: rgba(184,74,74,0.40);
  color: #B84A4A;
}

/* ================================================================
   SPINNER
================================================================ */
.spinner {
  display: inline-block;
  width: 13px; height: 13px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.65s linear infinite;
  vertical-align: middle;
  margin-right: 5px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ================================================================
   LOGIN
================================================================ */
.login-shell {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-base);
  padding: 24px 16px;
}

.login-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 32px 28px;
  width: 100%;
  max-width: 380px;
}

.login-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}

.login-mark {
  width: 42px; height: 42px;
  background: var(--accent);
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.login-brand-name { font-size: 20px; font-weight: 700; color: var(--text-1); letter-spacing: -0.02em; }
.login-brand-sub  { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 2px; }

.login-err { color: #B84A4A; font-size: 12.5px; font-weight: 500; min-height: 18px; margin-bottom: 10px; }

/* ================================================================
   UTILITY
================================================================ */
.text-muted  { color: var(--text-3); }
.text-accent { color: var(--accent); }
.text-gold   { color: var(--gold); }
.text-green  { color: var(--green); }
.text-red    { color: var(--red); }
.fw600       { font-weight: 600; }
.mono        { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.mt12 { margin-top: 12px; }
.mt16 { margin-top: 16px; }
.flex-end { display: flex; justify-content: flex-end; gap: 8px; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.flex-gap { display: flex; align-items: center; gap: 8px; }

/* ================================================================
   SIDEBAR — GREEN IDENTITY
================================================================ */

/* Sidebar base: green gradient */
.g-sidebar {
  background: linear-gradient(180deg, #1D4030 0%, #214936 60%, #2A5C43 100%);
  border-right: 1px solid rgba(0,0,0,0.14);
}

/* Brand area */
.sb-brand { border-bottom-color: rgba(255,255,255,0.10); }
.sb-logo-mark {
  background: rgba(255,255,255,0.15);
  color: #FFFFFF;
  border: 1px solid rgba(255,255,255,0.20);
}
.sb-logo-name { color: #FFFFFF; }
.sb-logo-sub   { color: rgba(255,255,255,0.48); }

/* Group labels */
.sb-group-label { color: rgba(255,255,255,0.40); }

/* Nav buttons */
.g-sidebar .nb {
  color: rgba(255,255,255,0.68);
  border-left-color: transparent;
}
.g-sidebar .nb:hover {
  color: #FFFFFF;
  background: rgba(255,255,255,0.09);
}
.g-sidebar .nb.a {
  color: #FFFFFF;
  background: rgba(255,255,255,0.14);
  border-left-color: #FFFFFF;
  font-weight: 600;
}
.g-sidebar .nb.a .nb-icon { opacity: 1; }

/* User footer */
.sb-user { border-top-color: rgba(255,255,255,0.10); }
.sb-avatar {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.80);
}
.sb-user-name { color: #FFFFFF; }
.sb-user-role  { color: rgba(255,255,255,0.46); }
.logout-btn    { color: rgba(255,255,255,0.46); }
.logout-btn:hover { color: #FFFFFF; }

/* ================================================================
   PAGE HEADER — GREEN TOP BAR
================================================================ */
.g-page-hd {
  background: #2F6B4F;
  border-bottom: 1px solid rgba(0,0,0,0.12);
}
.page-title { color: #FFFFFF; }
.page-sub   { color: rgba(255,255,255,0.60); }

/* Subtab row inside green header */
.g-page-hd .subtab-row { border-bottom-color: rgba(255,255,255,0.15); }
.g-page-hd .st {
  color: rgba(255,255,255,0.60);
  border-bottom-color: transparent;
}
.g-page-hd .st:hover { color: rgba(255,255,255,0.85); }
.g-page-hd .st.a {
  color: #FFFFFF;
  border-bottom-color: #FFFFFF;
}

/* ================================================================
   MOBILE HEADER & BOTTOM NAV — GREEN
================================================================ */
.m-header {
  background: #214936;
  border-bottom-color: rgba(0,0,0,0.12);
}
.m-brand       { color: #FFFFFF; }
.m-brand-mark  { background: rgba(255,255,255,0.14); color: #FFFFFF; }
.m-user-tag {
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.78);
}
.m-nav {
  background: #214936;
  border-top-color: rgba(0,0,0,0.12);
}
.m-nb   { color: rgba(255,255,255,0.52); }
.m-nb.a { color: #FFFFFF; }


/* ================================================================
   DASHBOARD DE METAS
================================================================ */

/* Filter bar */
.db-filter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  align-items: end;
}
.db-fg { display: flex; flex-direction: column; gap: 4px; }
.db-fg-btns { display: flex; gap: 6px; align-items: flex-end; }
.db-fl {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}
.db-fsel {
  width: 100%;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  color: var(--text-1);
  padding: 7px 10px;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.15s;
}
.db-fsel:focus { border-color: var(--accent); }

/* KPI row */
.db-kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.db-kpi {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 16px 16px 14px;
  position: relative;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.db-kpi-icon { font-size: 20px; margin-bottom: 8px; }
.db-kpi-val {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.db-kpi-lbl {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 4px;
  font-weight: 500;
}
.db-kpi-prog {
  height: 3px;
  background: var(--bg-surface-2);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 10px;
}
.db-kpi-prog > div { height: 100%; border-radius: 99px; transition: width 0.4s; }

/* Main progress */
.db-main-prog-row {
  display: flex;
  align-items: flex-start;
  gap: 24px;
  margin-bottom: 16px;
}
.db-main-prog-info { flex-shrink: 0; }
.db-main-prog-pct {
  font-family: var(--font-mono);
  font-size: 40px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.03em;
}
.db-main-prog-details { flex: 1; }
.db-detail-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.db-detail-row:last-child { border-bottom: none; }
.db-detail-lbl { color: var(--text-2); }
.db-detail-val { font-family: var(--font-mono); font-weight: 600; color: var(--text-1); }

.db-big-prog {
  height: 28px;
  background: var(--bg-surface-2);
  border-radius: var(--r-sm);
  overflow: hidden;
}
.db-big-prog-bar {
  height: 100%;
  border-radius: var(--r-sm);
  transition: width 0.5s cubic-bezier(0.16,1,0.3,1);
  display: flex;
  align-items: center;
}

/* Worker table */
.db-wk-table { width: 100%; }
.db-wk-hd {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1.8fr 1fr 1fr;
  padding: 9px 16px;
  background: var(--bg-surface-2);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  border-bottom: 1px solid var(--border);
  gap: 8px;
}
.db-wk-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1.8fr 1fr 1fr;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  gap: 8px;
  transition: background 0.1s;
  font-size: 13px;
}
.db-wk-row:last-child { border-bottom: none; }
.db-wk-row:hover { background: var(--bg-surface-2); }
.db-wk-name { display: flex; align-items: center; gap: 10px; }
.db-wk-av {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent-dim);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(47,107,79,0.2);
}
.db-wk-cell { font-family: var(--font-mono); font-size: 13px; color: var(--text-1); font-variant-numeric: tabular-nums; }
.db-mini-prog {
  flex: 1;
  height: 6px;
  background: var(--bg-surface-2);
  border-radius: 99px;
  overflow: hidden;
  min-width: 50px;
}
.db-mini-prog > div { height: 100%; border-radius: 99px; transition: width 0.4s; }

/* Horizontal bar chart */
.db-barchart { display: flex; flex-direction: column; gap: 12px; }
.db-bar-row { display: flex; align-items: center; gap: 12px; }
.db-bar-label { width: 70px; font-size: 13px; font-weight: 600; color: var(--text-1); text-align: right; flex-shrink: 0; }
.db-bar-track {
  flex: 1;
  height: 10px;
  background: var(--bg-surface-2);
  border-radius: 99px;
  overflow: hidden;
}
.db-bar-fill { height: 100%; border-radius: 99px; transition: width 0.5s cubic-bezier(0.16,1,0.3,1); }
.db-bar-pct { width: 40px; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); font-weight: 600; text-align: right; flex-shrink: 0; }

/* Two-column layout */
.db-two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 20px;
}

/* Line/bar chart (evolution) */
.db-linechart { width: 100%; }
.db-line-bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 100px;
}
.db-line-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  height: 100%;
}
.db-line-bar-wrap {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: flex-end;
}
.db-line-bar {
  width: 100%;
  background: var(--accent);
  border-radius: 3px 3px 0 0;
  min-height: 4px;
  opacity: 0.8;
  transition: opacity 0.15s;
}
.db-line-bar:hover { opacity: 1; }
.db-line-lbl { font-size: 10px; color: var(--text-3); font-weight: 500; }

/* Distribution */
.db-distrib { display: flex; gap: 12px; margin-bottom: 4px; }
.db-distrib-item {
  flex: 1;
  padding: 12px 14px;
  background: var(--bg-surface-2);
  border-radius: var(--r-sm);
}
.db-distrib-n { font-family: var(--font-mono); font-size: 28px; font-weight: 700; line-height: 1; }
.db-distrib-lbl { font-size: 11px; color: var(--text-3); margin-top: 4px; }

/* Indicator row */
.db-ind-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.db-ind {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.db-ind-lbl { font-size: 11px; color: var(--text-3); margin-bottom: 6px; font-weight: 500; }
.db-ind-val { font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--text-1); letter-spacing: -0.02em; }

/* Alerts */
.db-alerts { display: flex; flex-direction: column; gap: 8px; }
.db-alert-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  color: var(--text-2);
  padding: 10px 12px;
  background: var(--bg-surface-2);
  border-radius: var(--r-sm);
  border-left: 3px solid var(--gold);
  line-height: 1.5;
}

/* Dashboard responsive */
@media (max-width: 900px) {
  .db-two-col { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .db-kpi-row { grid-template-columns: 1fr 1fr; }
  .db-wk-hd { display: none; }
  .db-wk-row {
    grid-template-columns: 1fr;
    gap: 6px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    margin: 6px;
    padding: 12px;
  }
  .db-wk-row:hover { background: var(--bg-surface); }
  .db-filter-grid { grid-template-columns: 1fr 1fr; }
  .db-distrib { flex-direction: column; }
  .db-main-prog-row { flex-direction: column; }
  .db-main-prog-pct { font-size: 32px; }
}

@media (max-width: 768px) {
  /* Layout Shell */
  #root {
    display: block !important;
    width: 100% !important;
    min-height: 100vh !important;
    overflow-x: hidden !important;
  }

  .g-shell {
    display: flex !important;
    flex-direction: column !important;
    width: 100% !important;
    min-width: 0 !important;
    min-height: 100vh !important;
    overflow-x: hidden !important;
  }

  .g-sidebar {
    display: none !important;
  }

  .m-header {
    display: flex !important;
    width: 100% !important;
    box-sizing: border-box !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 100 !important;
    flex-shrink: 0 !important;
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
  }

  .g-main {
    margin-left: 0 !important;
    width: 100% !important;
    min-width: 0 !important;
    box-sizing: border-box !important;
    flex: 1 1 auto !important;
    display: flex !important;
    flex-direction: column !important;
  }

  .g-page-hd {
    display: none !important;
  }

  .g-content {
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    padding: 14px 12px calc(76px + env(safe-area-inset-bottom, 14px)) !important;
    overflow-x: hidden !important;
  }

  /* Bottom Navigation */
  .m-nav {
    display: block !important;
    position: fixed !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
    background: var(--bg-sidebar) !important;
    border-top: 1px solid var(--border) !important;
    z-index: 1000 !important;
    padding: 4px 0 calc(4px + env(safe-area-inset-bottom, 0px)) !important;
  }

  .m-nav-row {
    display: flex;
    width: 100%;
    justify-content: space-around;
  }

  .m-nb {
    flex: 1 1 0;
    min-width: 0;
    padding: 5px 1px;
    font-size: 8.5px;
    letter-spacing: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
  }

  .m-nb .mn-i {
    font-size: 18px;
    line-height: 1;
    margin-bottom: 2px;
  }

  .m-nb .mn-t {
    display: block;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.1;
  }

  /* Stats grid */
  .stats-row {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }

  .stat-box {
    padding: 11px 12px;
    border-radius: var(--r-sm);
  }

  .stat-lbl {
    font-size: 10px;
    letter-spacing: 0.05em;
  }

  .stat-val {
    font-size: 18px;
    margin-top: 3px;
  }

  /* Cards & Containers */
  .card {
    border-radius: var(--r-sm);
    margin-bottom: 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .card-body {
    padding: 14px 14px;
  }

  /* Section headers */
  .sec-hd {
    margin: 16px 0 8px;
  }

  /* Tables: smooth horizontal scroll without screen distortion */
  .dt {
    min-width: 100%;
    font-size: 12.5px;
  }

  .dt th {
    padding: 8px 10px;
    font-size: 10px;
  }

  .dt td {
    padding: 10px 10px;
    font-size: 12.5px;
  }

  .dt-num {
    font-size: 12.5px;
  }

  /* Product rows in mobile: keep compact 1fr auto grid with aligned controls */
  .prod-row {
    padding: 11px 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
  }

  .prod-name {
    font-size: 13.5px;
    line-height: 1.25;
  }

  .prod-meta {
    font-size: 11px;
    margin-top: 2px;
  }

  .prod-prog-row {
    margin-top: 6px;
    gap: 6px;
  }

  .prod-nums {
    font-size: 11px;
    min-width: 52px;
  }

  .prod-controls {
    gap: 4px;
    flex-shrink: 0;
  }

  .qbtn {
    width: 34px;
    height: 34px;
    font-size: 18px;
    border-radius: var(--r-xs);
  }

  .qty-disp {
    font-size: 15px;
    min-width: 26px;
  }

  /* Worker accordion */
  .worker-hd {
    padding: 11px 12px;
  }

  .w-avatar {
    width: 30px;
    height: 30px;
    font-size: 12px;
  }

  .w-name {

<script>
(function(){
// ================================================================
// API ENDPOINT CONFIG
// ================================================================
const CONFIG_KEY = 'sazon_api_url';
if (localStorage.getItem(CONFIG_KEY) && localStorage.getItem(CONFIG_KEY).includes('christian-97.workers.dev')) {
  localStorage.removeItem(CONFIG_KEY);
}
const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
const DEFAULT_REMOTE_API = 'https://sazon-api.christhiangutierrezrosas.workers.dev';
const API_URL = localStorage.getItem(CONFIG_KEY) || (isLocalhost ? window.location.origin : DEFAULT_REMOTE_API);

// ================================================================
// API CLIENT
// ================================================================
const api = {
  token: localStorage.getItem('sazon_auth_token') || null,
  setToken(t) {
    this.token = t;
    if (t) localStorage.setItem('sazon_auth_token', t);
    else localStorage.removeItem('sazon_auth_token');
  },
  async request(path, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    if (this.token) headers['Authorization'] = `Bearer ${this.token}`;
    const res = await fetch(`${API_URL}${path}`, { ...options, headers });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error en la solicitud a la API');
    return data;
  },
  async health() { return this.request('/api/health'); },
  async login(code) {
    const data = await this.request('/api/auth/login', { method: 'POST', body: JSON.stringify({ code }) });
    if (data.token) this.setToken(data.token);
    return data;
  },
  async getUsers() { return this.request('/api/users'); },
  async createUser(u) { return this.request('/api/users', { method: 'POST', body: JSON.stringify(u) }); },
  async updateUser(id, u) { return this.request(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify(u) }); },
  async getProducts(all = false) { return this.request(`/api/products${all ? '?all=true' : ''}`); },
  async createProduct(p) { return this.request('/api/products', { method: 'POST', body: JSON.stringify(p) }); },
  async updateProduct(id, p) { return this.request(`/api/products/${id}`, { method: 'PUT', body: JSON.stringify(p) }); },
  async deleteProduct(id) { return this.request(`/api/products/${id}`, { method: 'DELETE' }); },
  async getSales(params = {}) {
    const qs = new URLSearchParams(params).toString();
    return this.request(`/api/sales${qs ? '?' + qs : ''}`);
  },
  async recordSale(s) { return this.request('/api/sales', { method: 'POST', body: JSON.stringify(s) }); },
  async updateSale(id, s) { return this.request(`/api/sales/${id}`, { method: 'PUT', body: JSON.stringify(s) }); },
  async getGoals(params = {}) {
    const qs = new URLSearchParams(params).toString();
    return this.request(`/api/goals${qs ? '?' + qs : ''}`);
  },
  async saveGoal(g) { return this.request('/api/goals', { method: 'POST', body: JSON.stringify(g) }); },
  async getPromotions() { return this.request('/api/promotions'); },
  async createPromotion(p) { return this.request('/api/promotions', { method: 'POST', body: JSON.stringify(p) }); },
  async getTasks() { return this.request('/api/tasks'); },
  async createTask(t) { return this.request('/api/tasks', { method: 'POST', body: JSON.stringify(t) }); },
  async updateTask(id, t) { return this.request(`/api/tasks/${id}`, { method: 'PUT', body: JSON.stringify(t) }); },
  async deleteTask(id) { return this.request(`/api/tasks/${id}`, { method: 'DELETE' }); },
  async toggleTask(id, completed, observations) {
    return this.request(`/api/tasks/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ action: 'toggle_complete', completed, observations })
    });
  },
  async getEvents() { return this.request('/api/events'); },
  async createEvent(e) { return this.request('/api/events', { method: 'POST', body: JSON.stringify(e) }); },
  async deleteEvent(id) { return this.request(`/api/events/${id}`, { method: 'DELETE' }); },
  async getKpi(params = {}) {
    const qs = new URLSearchParams(params).toString();
    return this.request(`/api/kpi${qs ? '?' + qs : ''}`);
  }
};

// ================================================================
// GLOBAL STATE
// ================================================================
function today() { return new Date(); }
function dim() { const d = today(); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
function localDateStr(d = today()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

const S = {
  session: JSON.parse(localStorage.getItem('sazon_session') || 'null'),
  tab: 'ventas',
  sub: 'mozo',
  toast: null,
  modal: null,
  expandedWaiter: null,
  loading: false,
  users: [],
  products: [],
  sales: [],
  goals: { storeTargets: [], productGoals: [] },
  promotions: [],
  tasks: [],
  events: [],
  kpi: null,
  monthDays: dim(),
  currentDay: today().getDate()
};

function saveSession(sess) {
  S.session = sess;
  if (sess) localStorage.setItem('sazon_session', JSON.stringify(sess));
  else localStorage.removeItem('sazon_session');
}

function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function money(n) { return 'S/ ' + (Math.round(n || 0)).toLocaleString('es-PE'); }
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }
function toast(m) { S.toast = m; render(); setTimeout(() => { S.toast = null; render(); }, 2200); }
function openM(type, data) { S.modal = { type, data: data || {} }; render(); }
function closeM() { S.modal = null; render(); }

// ================================================================
// DATA SYNC
// ================================================================
async function syncFromD1() {
  if (!S.session) return;
  S.loading = true;
  try {
    const now = today();
    const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const utcMonth = now.toISOString().substring(0, 7);

    // Queries sales for current month; if near UTC boundary (e.g. evening in UTC-5), merge both
    const salesPromise = (utcMonth !== currentMonth)
      ? Promise.all([
          api.getSales({ month: currentMonth }),
          api.getSales({ month: utcMonth })
        ]).then(([r1, r2]) => {
          const map = new Map();
          [...(r1.sales || []), ...(r2.sales || [])].forEach(s => map.set(s.id, s));
          return { sales: Array.from(map.values()) };
        }).catch(() => api.getSales({ month: currentMonth }))
      : api.getSales({ month: currentMonth });

    const [uRes, pRes, sRes, gRes, tRes, eRes, kRes, proRes] = await Promise.all([
      api.getUsers(),
      api.getProducts(true),
      salesPromise,
      api.getGoals({ month: currentMonth }),
      api.getTasks(),
      api.getEvents(),
      api.getKpi({ month: currentMonth }),
      api.getPromotions().catch(() => ({ promotions: [] }))
    ]);
    S.users      = uRes.users      || [];
    S.products   = pRes.products   || [];
    S.sales      = sRes.sales      || [];
    S.goals      = gRes;
    S.tasks      = tRes.tasks      || [];
    S.events     = eRes.events     || [];
    S.kpi        = kRes;
    S.promotions = proRes.promotions || [];
  } catch (e) {
    console.error('Error sincronizando con D1:', e);
    toast('Aviso: ' + e.message);
  } finally {
    S.loading = false;
    render();
  }
}

// ================================================================
// DATA HELPERS
// ================================================================
function catalog(role) {
  return S.products.filter(p => p.active && (p.target_role === 'ALL' || p.target_role === (role || 'MOZO').toUpperCase()));
}

function goalForProduct(productId, workerId) {
  const pid = String(productId);
  const wid = workerId != null ? String(workerId) : null;
  let found;
  if (wid) {
    found = (S.goals.productGoals || []).find(g => String(g.product_id) === pid && String(g.worker_id) === wid);
    if (!found) found = (S.goals.productGoals || []).find(g => String(g.product_id) === pid && (g.worker_id === null || g.worker_id === undefined || g.worker_id === ''));
  } else {
    found = (S.goals.productGoals || []).find(g => String(g.product_id) === pid && (g.worker_id === null || g.worker_id === undefined || g.worker_id === ''));
  }
  if (found) return found.target_quantity;
  const p = S.products.find(x => String(x.id) === pid);
  return (p && p.name === '1/4 Pollo') ? 200 : 40;
}

function qtyForWorkerProduct(workerId, productId) {
  const wid = String(workerId);
  const pid = String(productId);
  return S.sales
    .filter(s => String(s.worker_id) === wid && String(s.product_id) === pid)
    .reduce((acc, s) => acc + (s.quantity || 0), 0);
}

function totalPollosForWorker(workerId) {
  const pCuarto = S.products.find(p => p.name === '1/4 Pollo');
  if (!pCuarto) return 0;
  return qtyForWorkerProduct(workerId, pCuarto.id) / 4;
}

function goalPace(goal) {
  return Math.round(goal * (S.currentDay / S.monthDays));
}

function wLogin(r) {
  const ic = r.querySelector('#lc'), b = r.querySelector('#lb'), e = r.querySelector('#le');
  async function go() {
    const c = ic.value.trim();
    if (!c) { e.textContent = 'Ingresa tu código de empleado.'; return; }
    b.disabled = true;
    b.innerHTML = '<span class="spinner"></span> Verificando...';
    try {
      const data = await api.login(c);
      saveSession(data.user);
      S.tab = 'ventas';
      await syncFromD1();
    } catch (err) {
      e.textContent = err.message || 'Código no reconocido.';
      b.disabled = false;
      b.textContent = 'Ingresar al sistema';
    }
  }
  b.addEventListener('click', go);
  ic.addEventListener('keydown', ev => { if (ev.key === 'Enter') go(); });
}

// VIEW: VENTAS (USUARIO)
// ================================================================
function vVentasUser() {
  const w = S.session;
  const prods = catalog(w.role);
  const done = prods.filter(p => qtyForWorkerProduct(w.id, p.id) >= goalForProduct(p.id, w.id)).length;
  const pollos = totalPollosForWorker(w.id);

  let html = `
  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-lbl">Metas logradas</div>
      <div class="stat-val c-accent">${done} / ${prods.length}</div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">Pollos (apoyo)</div>
      <div class="stat-val">${pollos.toFixed(1)}</div>
    </div>
  </div>`;

  html += `<div class="sec-hd"><div class="sec-label">Seguimiento de productos</div></div>`;
  html += `<div class="card" style="padding:0">`;

  if (prods.length === 0) {
    html += `<div class="empty-box"><div class="empty-icon">📋</div><div class="empty-title">Sin productos asignados</div><div class="empty-hint">No hay productos activos para tu rol en este momento.</div></div>`;
  } else {
    prods.forEach(prod => {
      const g    = goalForProduct(prod.id, w.id);
      const q    = qtyForWorkerProduct(w.id, prod.id);
      const pace = goalPace(g);
      const p    = pct(q, g);
      const ahead = q >= pace;
      const pBar = Math.min(100, p);
      html += `
      <div class="prod-row">
        <div>
          <div class="prod-name">${esc(prod.name)}</div>
          <div class="prod-meta">S/ ${prod.price.toFixed(2)} · Ritmo esperado: <span style="color:${ahead ? 'var(--green)' : 'var(--red)'};font-weight:600">${pace}</span></div>
          <div class="prod-prog-row">
            <div class="prod-nums">${q} / ${g} u.</div>
            <div class="prog" style="flex:1"><div class="prog-bar ${ahead ? 'g' : ''}" style="width:${pBar}%"></div></div>
            <div class="prod-nums" style="text-align:right;min-width:36px">${p}%</div>
          </div>
        </div>
        <div class="prod-controls">
          <button class="qbtn" data-dec="${prod.id}" title="Restar 1">−</button>
          <span class="qty-disp">${q}</span>
          <button class="qbtn" data-inc="${prod.id}" title="Sumar 1">+</button>
        </div>
      </div>`;
    });
  }
  html += `</div>`;

  html += `<div class="sec-hd" style="margin-top:20px"><div class="sec-label">Equipo — ${w.role === 'MOZO' ? 'Mozos' : 'Anfitrionas'}</div></div>`;
  html += `<div class="card" style="padding:0">`;
  const team = S.users.filter(x => x.role === w.role && x.active);
  if (team.length === 0) {
    html += `<div class="empty-box"><div class="empty-icon">👥</div><div class="empty-title">Sin colaboradores</div><div class="empty-hint">No hay colaboradores activos en tu rol.</div></div>`;
  } else {
    html += `<table class="dt"><thead><tr>
      <th>Colaborador</th><th class="r">Metas</th>
    </tr></thead><tbody>`;
    team.forEach(x => {
      const d2 = prods.filter(p => qtyForWorkerProduct(x.id, p.id) >= goalForProduct(p.id, x.id)).length;
      const isMe = x.id === w.id;
      html += `<tr>
        <td><span class="fw600">${esc(x.name)}</span>${isMe ? ' <span class="badge acc" style="margin-left:6px">tú</span>' : ''}</td>
        <td class="r dt-num">${d2} / ${prods.length}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;

}

    <div class="prog" style="height:8px">
      <div class="prog-bar ${comp >= 80 ? 'g' : comp >= 50 ? 'gold' : ''}" style="width:${Math.min(100, comp)}%"></div>
    </div>
    ${isAdmin ? `<div class="flex-end" style="margin-top:14px">
      <button class="btn gho sm" id="edit-store-target">Modificar meta mensual</button>
    </div>` : ''}
  </div>`;

  /* Product goals table */
  html += `<div class="sec-hd"><div class="sec-label">Seguimiento por producto</div></div>`;
  html += `<div class="card" style="padding:0">`;
  if (prods.length === 0) {
    html += `<div class="empty-box"><div class="empty-icon">📋</div><div class="empty-title">Sin productos</div></div>`;
  } else {
    html += `<table class="dt"><thead><tr>
      <th>Producto</th>
      <th class="r">Vendido</th>
      <th class="r">Meta</th>
      <th class="r">Avance</th>
      ${isAdmin ? '<th class="r">Acción</th>' : ''}
    </tr></thead><tbody>`;
    prods.forEach(p => {
      const goal = goalForProduct(p.id, null);
      const sold = S.sales.filter(s => String(s.product_id) === String(p.id)).reduce((acc, s) => acc + (s.quantity || 0), 0);
      const pp   = pct(sold, goal);
      html += `<tr>
        <td class="fw600">${esc(p.name)}</td>
        <td class="r dt-num">${sold}</td>
        <td class="r dt-num">${goal}</td>
        <td class="r">
          <span class="dt-num ${pp >= 80 ? 'text-green' : pp >= 50 ? 'text-gold' : 'text-muted'}">${pp}%</span>
        </td>
        ${isAdmin ? `<td class="r"><button class="btn gho sm" data-editgoal="${p.id}" data-role="GENERAL">Editar meta</button></td>` : ''}
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;
  return html;
}

function vTareas() {
  const isAdmin = S.session.role === 'ADMIN';
  let html = '';

  if (isAdmin) {
    html += `<div class="flex-end" style="margin-bottom:16px;justify-content:flex-start">
      <button class="btn pri" id="add-task">+ Nueva tarea</button>
    </div>`;
  }

  html += `<div class="card" style="padding:0">`;

  if (S.tasks.length === 0) {
    html += `<div class="empty-box">
      <div class="empty-icon">✅</div>
      <div class="empty-title">Sin tareas pendientes</div>
      <div class="empty-hint">${isAdmin ? 'Crea una tarea para asignarla al equipo.' : 'No tienes tareas asignadas en este momento.'}</div>
    </div>`;
  } else {
    const now = today();
    S.tasks.forEach(t => {
      const dl       = new Date(t.deadline + 'T23:59:59');
      const diffD    = Math.ceil((dl - now) / 86400000);
      const late     = diffD < 0;
      const myAssign = (t.assignees || []).find(a => a.user_id === S.session.id);
      const done     = myAssign && myAssign.completed;

      html += `<div class="task-item">`;

      if (!isAdmin) {
        html += `<div class="task-chk ${done ? 'done' : ''}" data-donetask="${t.id}" title="Marcar tarea">${done ? '✓' : ''}</div>`;
      }

      html += `<div class="task-body">
        <div class="task-name${done ? ' done-text' : ''}">${esc(t.name)}</div>
        <div class="task-foot">
          <span class="badge ${late ? 'red' : 'def'}">${late ? 'Vencida hace ' + Math.abs(diffD) + ' d' : 'Plazo: ' + diffD + ' d'}</span>
          <span class="text-muted">${t.deadline}</span>
        </div>`;

      if (myAssign && myAssign.observations) {
        html += `<div style="margin-top:6px;font-size:12px;color:var(--text-3);font-style:italic">"${esc(myAssign.observations)}"</div>`;
      }

      if (isAdmin) {
        const completedList = (t.assignees || []).filter(a => a.completed);
        if (completedList.length === 0) {
          html += `<div style="margin-top:6px;font-size:12px;color:var(--text-3)">Pendiente — ningún colaborador la ha completado aún.</div>`;
        } else {
          completedList.forEach(c => {
            html += `<div style="margin-top:4px;font-size:12px;color:var(--green)">✓ ${esc(c.worker_name || '')}${c.observations ? ' — "' + esc(c.observations) + '"' : ''}</div>`;

        }
      }

      html += `</div>`;

      if (isAdmin) {
        html += `<div class="task-actions">
          <button class="btn dan sm" data-deltask="${t.id}" title="Eliminar tarea">✕</button>
        </div>`;
      }

      html += `</div>`;
    });
  }

  html += `</div>`;
  return html;
}

function vDashboard() {
  // ── State for filters (stored on S.dash) ──
  if (!S.dash) S.dash = { period: 'mes', from: '', to: '', worker: 'all', shift: 'all', status: 'all' };
  const df = S.dash;

  // ── Real data from S ──
  const kpis      = (S.kpi && S.kpi.kpis) || {};
  const totalMeta = parseFloat(kpis.totalTarget)   || 350000;
  const totalVta  = parseFloat(kpis.monthlySales)  || 0;
  const comp      = parseFloat(kpis.targetCompliance) || 0;
  const falta     = Math.max(0, totalMeta - totalVta);
  const proj      = parseFloat(kpis.projectedClosing) || 0;
  const projAbove = proj >= totalMeta;

  // ── Workers with their sales ──
  const mozos = S.users.filter(u => u.role === 'MOZO' && u.active);
  const anfs  = S.users.filter(u => u.role === 'ANFITRIONA' && u.active);
  const allWk = [...mozos, ...anfs];

  // Compute per-worker sales total (monetary)
  function workerSales(wId) {
    const widStr = String(wId);
    return S.sales
      .filter(s => String(s.worker_id) === widStr)
      .reduce((acc, s) => {
        const prod = S.products.find(p => String(p.id) === String(s.product_id));
        return acc + (s.quantity || 0) * (prod ? prod.price : 0);
      }, 0);
  }

  // Per-worker goal (share of store target equally, or 0 if no workers)
  const workerMeta = allWk.length > 0 ? Math.round(totalMeta / allWk.length) : 0;

  const wkData = allWk.map(w => {
    const vta = workerSales(w.id);
    const c   = workerMeta > 0 ? Math.round(vta / workerMeta * 100) : 0;
    return { ...w, vta, cumpl: c, falta: Math.max(0, workerMeta - vta) };
  });

  // Sort by cumplimiento desc
  wkData.sort((a,b) => b.cumpl - a.cumpl);

  // Filter by selected worker & status
  let filtered = [...wkData];
  if (df.worker !== 'all') filtered = filtered.filter(w => String(w.id) === String(df.worker));
  if (df.status === 'cumplida')  filtered = filtered.filter(w => w.cumpl >= 100);
  else if (df.status === 'camino') filtered = filtered.filter(w => w.cumpl >= 60 && w.cumpl < 100);
  else if (df.status === 'bajo')   filtered = filtered.filter(w => w.cumpl < 60);

  const topWorker  = wkData[0];
  const avgPerWk   = allWk.length > 0 ? Math.round(totalVta / allWk.length) : 0;
  const avgPerDay  = S.currentDay > 0 ? Math.round(totalVta / S.currentDay) : 0;
  const wkCumplida = wkData.filter(w => w.cumpl >= 100).length;
  const wkCamino   = wkData.filter(w => w.cumpl >= 60 && w.cumpl < 100).length;
  const wkBajo     = wkData.filter(w => w.cumpl < 60).length;

  // Alerts
  const alerts = [];
  wkData.filter(w => w.cumpl < 60).forEach(w => alerts.push(`<b>${esc(w.name)}</b> está al <b>${w.cumpl}%</b> de su meta.`));
  if (falta > 0) alerts.push(`Faltan <b>${money(falta)}</b> para alcanzar la meta del equipo.`);
  if (!projAbove) alerts.push(`La proyección de cierre <b>${money(proj)}</b> está por debajo de la meta <b>${money(totalMeta)}</b>.`);

  // Mock evolution data (last 7 days pattern based on real total)
  const days = ['Lu','Ma','Mi','Ju','Vi','Sa','Do'];
  const mockEvo = [0.11,0.13,0.12,0.14,0.18,0.17,0.15];
  const evoMax  = totalVta * 0.18 || 50000;

  // ── Status color helper ──
  function statusBadge(c) {
    if (c >= 100) return '<span class="badge grn">Cumplida</span>';
    if (c >= 60)  return '<span class="badge acc">En camino</span>';
    return '<span class="badge red">Por debajo</span>';
  }
  function barColor(c) {
    if (c >= 100) return '#3F805C';
    if (c >= 60)  return '#2F6B4F';
    return '#B84A4A';
  }

  let html = '';

  // ── FILTER BAR ──
  html += `
  <div class="db-filters card card-body" style="margin-bottom:18px">
    <div class="db-filter-grid">
      <div class="db-fg">
        <label class="db-fl">Periodo</label>
        <select id="dbf-period" class="db-fsel">
          <option value="hoy"  ${df.period==='hoy'  ?'selected':''}>Hoy</option>
          <option value="sem"  ${df.period==='sem'  ?'selected':''}>Esta semana</option>
          <option value="mes"  ${df.period==='mes'  ?'selected':''}>Este mes</option>
          <option value="custom" ${df.period==='custom'?'selected':''}>Personalizado</option>
        </select>
      </div>
      <div class="db-fg">
        <label class="db-fl">Desde</label>
        <input id="dbf-from" type="date" class="db-fsel" value="${df.from}">
      </div>
      <div class="db-fg">
        <label class="db-fl">Hasta</label>
        <input id="dbf-to" type="date" class="db-fsel" value="${df.to}">
      </div>
      <div class="db-fg">
        <label class="db-fl">Mozo</label>
        <select id="dbf-worker" class="db-fsel">
          <option value="all" ${df.worker==='all'?'selected':''}>Todos</option>
          ${allWk.map(w => `<option value="${w.id}" ${df.worker===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}
        </select>
      </div>
      <div class="db-fg">
        <label class="db-fl">Turno</label>
        <select id="dbf-shift" class="db-fsel">

function wireDashboard(root) {
  const ap = root.querySelector('#dbf-apply');
  const cl = root.querySelector('#dbf-clear');
  if (ap) ap.addEventListener('click', () => {
    if (!S.dash) S.dash = {};
    S.dash.period = root.querySelector('#dbf-period').value;
    S.dash.from   = root.querySelector('#dbf-from').value;
    S.dash.to     = root.querySelector('#dbf-to').value;
    S.dash.worker = root.querySelector('#dbf-worker').value;
    S.dash.shift  = root.querySelector('#dbf-shift').value;
    S.dash.status = root.querySelector('#dbf-status').value;
    render();
  });
  if (cl) cl.addEventListener('click', () => {
    S.dash = { period: 'mes', from: '', to: '', worker: 'all', shift: 'all', status: 'all' };
    render();
  });
}

  const isAdmin = S.session.role === 'ADMIN';

  const ptitle = pi.t(isAdmin);

  const uInit  = (S.session.name || '?').charAt(0).toUpperCase();

  let html = `<div class="g-shell">`;

// ================================================================

function wire(root) {
  /* Logout */
  const lo  = root.querySelector('#lo');
  const loM = root.querySelector('#lo-m');
  const doLogout = () => { api.setToken(null); saveSession(null); render(); };
  if (lo)  lo.addEventListener('click', doLogout);
  if (loM) loM.addEventListener('click', doLogout);

  /* Dashboard filters */
  if (S.tab === 'dashboard') wireDashboard(root);

  /* Navigation (sidebar + mobile) */
  root.querySelectorAll('.nb').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.tab) { S.tab = b.dataset.tab; render(); }
  }));

  /* Subtabs (Mozos / Anfitrionas) */
  root.querySelectorAll('.st').forEach(b => b.addEventListener('click', () => { S.sub = b.dataset.sub; render(); }));

  const isAdmin = S.session && S.session.role === 'ADMIN';

  /* ── REGISTRO DE VENTAS (USUARIO) ── */
  if (!isAdmin && S.tab === 'ventas') {
    root.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', async () => {
      const pid = b.dataset.inc;
      const wid = S.session ? S.session.id : null;
      const sDate = localDateStr();
      b.disabled = true;

      // Actualización optimista inmediata
      const tempId = 'temp_' + Date.now();
      S.sales.push({
        id: tempId,
        worker_id: wid,
        product_id: pid,
        quantity: 1,
        sale_date: sDate
      });
      render();

      try {
        await api.recordSale({
          worker_id: wid,
          product_id: pid,
          quantity: 1,
          sale_date: sDate
        });
        toast('+1 unidad registrada');
        await syncFromD1();
      } catch (e) {
        S.sales = S.sales.filter(s => s.id !== tempId);
        render();
        toast('Error: ' + e.message);
      } finally {
        b.disabled = false;
      }
    }));

    root.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', async () => {
      const pid = b.dataset.dec;
      const wid = S.session ? S.session.id : null;
      const sDate = localDateStr();
      b.disabled = true;

      // Actualización optimista inmediata
      const tempId = 'temp_' + Date.now();
      S.sales.push({
        id: tempId,
        worker_id: wid,
        product_id: pid,
        quantity: -1,
        sale_date: sDate
      });
      render();

      try {
        await api.recordSale({
          worker_id: wid,
          product_id: pid,
          quantity: -1,
          sale_date: sDate
        });
        toast('Ajuste −1 registrado');
        await syncFromD1();
      } catch (e) {
        S.sales = S.sales.filter(s => s.id !== tempId);
        render();
        toast('Error: ' + e.message);
      } finally {
        b.disabled = false;
      }
    }));
  }

  /* ── VENTAS ADMIN ── */
  if (isAdmin && S.tab === 'ventas') {
    root.querySelectorAll('[data-toggleuser]').forEach(b => b.addEventListener('click', () => {
      S.expandedWaiter = S.expandedWaiter === b.dataset.toggleuser ? null : b.dataset.toggleuser;
      render();
    }));

    root.querySelectorAll('[data-admininc]').forEach(b => b.addEventListener('click', async () => {
      const [wid, pid] = b.dataset.admininc.split(':');
      const sDate = localDateStr();
      b.disabled = true;

      const tempId = 'temp_' + Date.now();
      S.sales.push({
        id: tempId,
        worker_id: wid,
        product_id: pid,
        quantity: 1,
        sale_date: sDate
      });
      render();

      try {
        await api.recordSale({ worker_id: wid, product_id: pid, quantity: 1, sale_date: sDate });
        toast('Venta registrada');
        await syncFromD1();
      } catch (e) {
        S.sales = S.sales.filter(s => s.id !== tempId);
        render();
        toast('Error: ' + e.message);
      } finally {
        b.disabled = false;
      }
    }));

    root.querySelectorAll('[data-admindec]').forEach(b => b.addEventListener('click', async () => {
      const [wid, pid] = b.dataset.admindec.split(':');
      const sDate = localDateStr();
      b.disabled = true;

      const tempId = 'temp_' + Date.now();
      S.sales.push({
        id: tempId,
        worker_id: wid,
        product_id: pid,
        quantity: -1,
        sale_date: sDate
      });
      render();

      try {
        await api.recordSale({ worker_id: wid, product_id: pid, quantity: -1, sale_date: sDate });
        toast('Ajuste registrado');
        await syncFromD1();
      } catch (e) {
        S.sales = S.sales.filter(s => s.id !== tempId);
        render();
        toast('Error: ' + e.message);
      } finally {
        b.disabled = false;
      }
    }));

    const apb = root.querySelector('#add-prod-btn');
    if (apb) apb.addEventListener('click', () => openM('add-prod', { role: apb.dataset.role }));
  }

  /* ── ACCIONES GENERALES ── */
  root.querySelectorAll('[data-editgoal]').forEach(b => b.addEventListener('click', () => openM('edit-goal', { id: b.dataset.editgoal, role: b.dataset.role || 'GENERAL' })));
  root.querySelectorAll('[data-editprofile]').forEach(b => b.addEventListener('click', () => openM('edit-profile', { id: b.dataset.editprofile })));
  root.querySelectorAll('[data-editadmin]').forEach(b => b.addEventListener('click', () => openM('edit-profile', { id: b.dataset.editadmin })));

  const emp = root.querySelector('#edit-my-profile');
  if (emp) emp.addEventListener('click', () => openM('edit-profile', { id: S.session.id }));

  const au  = root.querySelector('#add-user');
  if (au) au.addEventListener('click', () => openM('add-user'));

  const aab = root.querySelector('#add-admin-btn');
  if (aab) aab.addEventListener('click', () => openM('add-admin'));

  const at = root.querySelector('#add-task');
  if (at) at.addEventListener('click', () => openM('add-task'));

  const ae = root.querySelector('#add-event');
  if (ae) ae.addEventListener('click', () => openM('add-event'));

  const est = root.querySelector('#edit-store-target');
  if (est) est.addEventListener('click', () => openM('edit-store-target'));

  const ce = root.querySelector('#cfg-endpoint');
  if (ce) ce.addEventListener('click', () => openM('config-api'));

  /* ── PRODUCTOS: DESACTIVAR ── */
  root.querySelectorAll('[data-delprod]').forEach(b => b.addEventListener('click', async () => {
    const prodId = b.dataset.delprod;
    const prod   = S.products.find(p => p.id === prodId);
    if (!prod) return;
    if (!confirm(`¿Desactivar el producto "${prod.name}"? Quedará oculto del catálogo.`)) return;
    b.disabled = true;
    try {
      await api.deleteProduct(prodId);
      toast('Producto desactivado');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); b.disabled = false; }
  }));

  /* ── TAREAS: ELIMINAR (admin) ── */
  root.querySelectorAll('[data-deltask]').forEach(b => b.addEventListener('click', async () => {
    const taskId = b.dataset.deltask;
    const task   = S.tasks.find(t => t.id === taskId);
    if (!task) return;
    if (!confirm(`¿Eliminar la tarea "${task.name}"?`)) return;
    b.disabled = true;
    try {
      await api.deleteTask(taskId);
      toast('Tarea eliminada');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); b.disabled = false; }
  }));

  /* ── TAREAS: MARCAR / DESMARCAR ── */
  root.querySelectorAll('[data-donetask]').forEach(b => b.addEventListener('click', () => {
    const tid    = b.dataset.donetask;
    const task   = S.tasks.find(t => t.id === tid);
    const assign = (task.assignees || []).find(a => a.user_id === S.session.id);
    if (assign && assign.completed) {
      api.toggleTask(tid, 0, '').then(() => { toast('Tarea desmarcada'); syncFromD1(); });
    } else {
      openM('task-note', { taskId: tid });
    }
  }));

  /* ── EVENTOS: ELIMINAR ── */
  root.querySelectorAll('[data-delevent]').forEach(b => b.addEventListener('click', async () => {
    try {
      await api.deleteEvent(b.dataset.delevent);
      toast('Evento eliminado');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); }
  }));

  /* ── MODAL: GUARDAR / CANCELAR ── */
  const mc  = root.querySelector('#m-cancel');
  if (mc) mc.addEventListener('click', closeM);

  const mbd = root.querySelector('#mbd');
  if (mbd) mbd.addEventListener('click', e => { if (e.target === mbd) closeM(); });

  const ms = root.querySelector('#m-save');
  if (ms) ms.addEventListener('click', async () => {
    const m = S.modal;
    if (!m) return;
    const v = id => { const el = root.querySelector('#' + id); return el ? el.value.trim() : ''; };
    ms.disabled = true;
    try {
      if (m.type === 'config-api') {
        const url = v('mf-api');
        if (url) { localStorage.setItem(CONFIG_KEY, url); location.reload(); }

      } else if (m.type === 'add-prod') {
        const name     = v('mf-name');
        const category = v('mf-cat') || 'GENERAL';
        const price    = parseFloat(v('mf-price')) || 0;
        await api.createProduct({ name, category, price, target_role: m.data.role });
        toast('Producto agregado'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-goal') {
        const g = parseFloat(v('mf-goal')) || 0;
        await api.saveGoal({ type: 'PRODUCT_GOAL', product_id: m.data.id, target_quantity: g });
        toast('Meta actualizada'); closeM(); await syncFromD1();

      } else if (m.type === 'add-user') {
        const name = v('mf-name'), code = v('mf-code'), role = v('mf-role');
        await api.createUser({ name, code, role });
        toast('Colaborador creado'); closeM(); await syncFromD1();

      } else if (m.type === 'add-admin') {
        const name = v('mf-name'), code = v('mf-code');
        await api.createUser({ name, code, role: 'ADMIN' });
        toast('Administrador creado'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-profile') {
        const name = v('mf-name'), code = v('mf-code');
        await api.updateUser(m.data.id, { name, code });
        toast('Perfil actualizado'); closeM(); await syncFromD1();

      } else if (m.type === 'add-task') {
        const name = v('mf-name'), deadline = v('mf-date');
        await api.createTask({ name, deadline });
        toast('Tarea creada'); closeM(); await syncFromD1();

      } else if (m.type === 'add-event') {
        const title       = v('mf-name');
        const event_date  = v('mf-date');
        const event_time  = v('mf-time');
        const description = v('mf-desc');
        await api.createEvent({ title, event_date, event_time, description });
        toast('Evento programado'); closeM(); await syncFromD1();

      } else if (m.type === 'task-note') {
        const note = v('mf-note');
        await api.toggleTask(m.data.taskId, 1, note);
        toast('Tarea completada'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-store-target') {
        const target = parseFloat(v('mf-target')) || 350000;
        await api.saveGoal({ type: 'STORE_TARGET', target_amount: target });
        toast('Meta de tienda actualizada'); closeM(); await syncFromD1();
      }
    } catch (err) {
      toast('Error: ' + err.message);
    } finally {
      ms.disabled = false;
    }
  });
}

// ================================================================
// INIT
// ================================================================
render();
if (S.session) syncFromD1();

})();
</script>
</body>
</html>
