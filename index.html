<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AdminRest — Gestión Operativa</title>
<link rel="icon" type="image/svg+xml" href="src/images/icon.svg">
<meta name="description" content="Sistema interno de gestión operativa · AdminRest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ================================================================
   DESIGN TOKENS
================================================================ */
:root {
  /* Backgrounds */
  --bg-base:      #F7F9F7;
  --bg-sidebar:   #214936;
  --bg-surface:   #FFFFFF;
  --bg-surface-2: #F1F5F2;
  --bg-surface-3: #E5F0E9;

  /* Borders */
  --border:       #DCE5DF;
  --border-2:     #C5D4CA;

  /* Text */
  --text-1:       #1F2923;
  --text-2:       #66736B;
  --text-3:       #8A958E;

  /* Brand / Actions */
  --accent:       #2F6B4F;   /* verde principal */
  --accent-h:     #3D7F60;
  --accent-dim:   #E5F0E9;

  /* Semantic */
  --gold:         #B88A2B;
  --gold-dim:     #FBF3DC;
  --green:        #3F805C;
  --green-dim:    #E8F5EE;
  --red:          #B84A4A;
  --red-dim:      #FDEAEA;

  /* Typography */
  --font:         'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:    'IBM Plex Mono', 'Courier New', monospace;

  /* Geometry */
  --r-xs:  3px;
  --r-sm:  6px;
  --r-md:  10px;
  --r-lg:  14px;

  --sidebar-w: 226px;
}

/* ================================================================
   RESET & BASE
================================================================ */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg-base);
  color: var(--text-1);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }
button { font-family: var(--font); cursor: pointer; }
::selection { background: var(--accent); color: #fff; }

/* ================================================================
   LAYOUT SHELL
================================================================ */
#root { display: flex; min-height: 100vh; }

/* App layout: sidebar + main */
.g-shell {
  display: flex;
  width: 100%;
  min-height: 100vh;
  opacity: 0;
  animation: gShellFadeIn 0.3s ease forwards;
}

@keyframes gShellFadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ================================================================
   SIDEBAR
================================================================ */
.g-sidebar {
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
  overflow-x: hidden;
}

/* Brand / Logo area */
.sb-brand {
  padding: 18px 16px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.10);
  flex-shrink: 0;
}

.sb-brand-logo-card {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  background: transparent;
  padding: 0;
  border-radius: 0;
  box-shadow: none;
  width: 100%;
  box-sizing: border-box;
}

.sb-brand-logo {
  height: 46px;
  width: auto;
  max-width: 100%;
  display: block;
}

.m-brand-logo-card {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  background: transparent;
  padding: 0;
  border-radius: 0;
  box-shadow: none;
}

.m-brand-logo {
  height: 32px;
  width: auto;
  max-width: 170px;
  display: block;
}

.sb-logo-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}

/* Reserved logo slot — replace with <img> when logo is ready */
.sb-logo-mark {
  width: 34px;
  height: 34px;
  background: var(--accent);
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.04em;
  flex-shrink: 0;
  user-select: none;
}

.sb-logo-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
}

.sb-logo-sub {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* Navigation */
.sb-nav { flex: 1; padding: 10px 0; }

.sb-group-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 14px 18px 5px;
}

.nb {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 9px 18px;
  background: none;
  border: none;
  border-left: 2px solid transparent;
  color: var(--text-2);
  font-size: 13.5px;
  font-weight: 500;
  font-family: var(--font);
  text-align: left;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  line-height: 1.3;
}

.nb:hover { color: var(--text-1); background: rgba(0,0,0,0.04); }

.nb.a {
  color: var(--accent);
  background: var(--accent-dim);
  border-left-color: var(--accent);
  font-weight: 600;
}

.nb-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  opacity: 0.85;
}
.nb-icon svg {
  width: 19px;
  height: 19px;
  display: block;
}
.nb.a .nb-icon { opacity: 1; }

/* Sidebar user footer */
.sb-user {
  border-top: 1px solid var(--border);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.sb-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--bg-surface-3);
  border: 1px solid var(--border-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-2);
  flex-shrink: 0;
  text-transform: uppercase;
}

.sb-user-info { flex: 1; min-width: 0; }
.sb-user-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sb-user-role {
  font-size: 10.5px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.logout-btn {
  background: none;
  border: none;
  color: var(--text-3);
  cursor: pointer;
  padding: 4px;
  font-size: 15px;
  display: flex;
  align-items: center;
  transition: color 0.15s;
  flex-shrink: 0;
}
.logout-btn:hover { color: var(--red); }

/* ================================================================
   MAIN CONTENT AREA
================================================================ */
.g-main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg-base);
}

/* Sticky page header (desktop) */
.g-page-hd {
  padding: 16px 32px 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg-base);
  position: sticky;
  top: 0;
  z-index: 50;
}

.g-page-hd-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 12px;
}

.page-title {
  font-size: 21px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
}

.page-sub {
  font-size: 12.5px;
  color: var(--text-3);
  margin-top: 2px;
  padding-bottom: 14px;
}

/* Content area */
.g-content {
  padding: 24px 32px;
  flex: 1;
  max-width: 1200px;
  width: 100%;
}

/* ================================================================
   MOBILE HEADER
================================================================ */
.m-header {
  display: none;
  position: sticky;
  top: 0;
  z-index: 90;
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--border);
  padding: 11px 16px;
  align-items: center;
  justify-content: space-between;
}

.m-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
}

.m-brand-mark {
  width: 28px;
  height: 28px;
  background: var(--accent);
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.m-user-area { display: flex; align-items: center; gap: 8px; }
.m-user-tag {
  font-size: 11px;
  color: var(--text-2);
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  padding: 3px 9px;
  border-radius: var(--r-xs);
}

/* ================================================================
   MOBILE BOTTOM NAV
================================================================ */
.m-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg-sidebar);
  border-top: 1px solid var(--border);
  z-index: 90;
  padding: 4px 0 calc(4px + env(safe-area-inset-bottom));
}

.m-nav-row { display: flex; }

.m-nb {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 4px;
  background: none;
  border: none;
  color: var(--text-3);
  font-size: 9.5px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  transition: color 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.m-nb .mn-i {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  line-height: 1;
}
.m-nb .mn-i svg {
  width: 19px;
  height: 19px;
  display: block;
}
.m-nb.a { color: var(--accent); }

/* ================================================================
   SECTION HEADERS
================================================================ */
.sec-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 0 10px;
}

.sec-hd:first-child { margin-top: 0; }

.sec-label {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.09em;
}

/* ================================================================
   CARDS
================================================================ */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 18px;
  overflow: hidden;
}

.card-body { padding: 18px 20px; }

/* ================================================================
   STAT BOXES
================================================================ */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}

.stat-box {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px;
}

.stat-lbl {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

.stat-val {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 600;
  color: var(--text-1);
  margin-top: 5px;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.stat-val.c-accent { color: var(--accent); }
.stat-val.c-gold   { color: var(--gold); }
.stat-val.c-green  { color: var(--green); }
.stat-val.c-red    { color: var(--red); }

/* ================================================================
   DATA TABLES
================================================================ */
.dt { width: 100%; border-collapse: collapse; }

.dt thead { background: var(--bg-surface-2); }

.dt th {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 9px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.dt th.r { text-align: right; }
.dt th.c { text-align: center; }

.dt td {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
  color: var(--text-1);
  vertical-align: middle;
}

.dt td.r { text-align: right; }
.dt td.c { text-align: center; }
.dt td.muted { color: var(--text-2); }
.dt tr:last-child td { border-bottom: none; }
.dt tbody tr:hover td { background: var(--bg-surface-2); }

.dt-num {
  font-family: var(--font-mono);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--text-1);
}

/* ================================================================
   PROGRESS BAR
================================================================ */
.prog {
  height: 5px;
  background: var(--bg-surface-3);
  border-radius: 99px;
  overflow: hidden;
}
.prog-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s;
  min-width: 2px;
}
.prog-bar.g { background: var(--green); }
.prog-bar.gold { background: var(--gold); }

/* ================================================================
   PRODUCT TRACKING ROWS
================================================================ */
.prod-row {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}
.prod-row:last-child { border-bottom: none; }

.prod-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-1);
}
.prod-meta {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 2px;
}
.prod-prog-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.prod-nums {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-2);
  white-space: nowrap;
  min-width: 72px;
  font-weight: 500;
}
.prod-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}
.qbtn {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border-2);
  background: var(--bg-surface-2);
  color: var(--text-1);
  border-radius: var(--r-xs);
  font-size: 18px;
  font-weight: 400;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  transition: background 0.12s, border-color 0.12s;
  flex-shrink: 0;
}
.qbtn:hover:not(:disabled) { background: var(--bg-surface-3); border-color: var(--accent); }
.qbtn:active:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }
.qbtn:disabled { opacity: 0.35; cursor: not-allowed; }
/* Sales Row Controls & Numeric Inputs */
.sales-header-card {
  margin-bottom: 14px;
  padding: 12px 16px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.sale-row-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.sale-input-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.sale-qty-input {
  width: 58px;
  height: 32px;
  text-align: right;
  padding: 4px 8px;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  border: 1px solid var(--border-2);
  background: var(--bg-base);
  color: var(--text-1);
  border-radius: var(--r-xs);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.sale-qty-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-dim);
}
.sale-qty-input::-webkit-outer-spin-button,
.sale-qty-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.sale-qty-input[type=number] {
  -moz-appearance: textfield;
}
.btn-send-sale {
  height: 32px;
  padding: 0 11px;
  font-size: 12px;
  font-weight: 600;
  border-radius: var(--r-xs);
  min-width: 54px;
  transition: all 0.15s;
}
.btn-adjust {
  background: none;
  border: 1px dashed var(--border);
  color: var(--text-3);
  padding: 0 7px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 500;
  border-radius: var(--r-xs);
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: 32px;
  transition: all 0.15s;
  user-select: none;
}
.btn-adjust:hover {
  border-color: var(--red);
  color: var(--red);
  background: rgba(181, 87, 63, 0.08);
}
.bulk-save-bar {
  padding: 12px 16px;
  background: var(--bg-surface-2);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.bulk-save-hint {
  font-size: 12px;
  color: var(--text-2);
  display: flex;
  align-items: center;
  gap: 6px;
}
.bulk-save-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}
.btn-save-all {
  min-width: 155px;
  font-weight: 600;
  transition: all 0.15s;
}
.qty-disp {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 15px;
  min-width: 30px;
  text-align: center;
  color: var(--text-1);
}

/* ================================================================
   BUTTONS
================================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: var(--r-sm);
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
  white-space: nowrap;
  text-decoration: none;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: scale(0.98); }

.btn.pri  { background: var(--accent); color: #fff; }
.btn.pri:hover:not(:disabled) { background: var(--accent-h); }

.btn.gho  { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
.btn.gho:hover:not(:disabled) { background: var(--bg-surface-2); color: var(--text-1); border-color: var(--border-2); }

.btn.dan  { background: var(--red-dim); color: #B84A4A; border: 1px solid rgba(184,74,74,0.30); }
.btn.dan:hover:not(:disabled) { background: var(--red); color: #fff; }

.btn.full { width: 100%; }

.btn.sm   { padding: 5px 10px; font-size: 12px; }

/* ================================================================
   BADGES
================================================================ */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--r-xs);
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border: 1px solid;
}
.badge.def  { background: var(--bg-surface-2); color: var(--text-2); border-color: var(--border); }
.badge.acc  { background: var(--accent-dim);   color: var(--accent); border-color: rgba(47,107,79,0.35); }
.badge.grn  { background: var(--green-dim);    color: var(--green);  border-color: rgba(63,128,92,0.35); }
.badge.red  { background: var(--red-dim);      color: #B84A4A;       border-color: rgba(184,74,74,0.30); }
.badge.gld  { background: var(--gold-dim);     color: var(--gold);   border-color: rgba(184,138,43,0.35); }

/* ================================================================
   WORKER ACCORDION
================================================================ */
.worker-hd {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: background 0.12s;
}
.worker-hd:hover { background: var(--bg-surface-2); }
.worker-hd:last-child { border-bottom: none; }

.w-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-surface-3);
  border: 1px solid var(--border-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
  text-transform: uppercase;
  flex-shrink: 0;
}
.w-info { flex: 1; min-width: 0; }
.w-name { font-weight: 600; font-size: 13.5px; color: var(--text-1); }
.w-meta { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.w-chevron { color: var(--text-3); font-size: 11px; flex-shrink: 0; }

.worker-body {
  background: var(--bg-base);
  border-bottom: 1px solid var(--border);
}

/* ================================================================
   TASK ITEMS
================================================================ */
.task-item {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.task-item:last-child { border-bottom: none; }

.task-chk {
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--border-2);
  border-radius: var(--r-xs);
  background: var(--bg-surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: transparent;
  flex-shrink: 0;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 1px;
}
.task-chk.done {
  background: var(--green-dim);
  border-color: var(--green);
  color: var(--green);
}

.task-body { flex: 1; min-width: 0; }
.task-name { font-weight: 600; font-size: 14px; color: var(--text-1); }
.task-name.done-text { text-decoration: line-through; color: var(--text-3); }
.task-foot {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.task-actions { flex-shrink: 0; display: flex; gap: 6px; }

/* ================================================================
   EVENT ITEMS
================================================================ */
.event-item {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 16px;
}
.event-item:last-child { border-bottom: none; }

.event-date {
  text-align: center;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  min-width: 52px;
  flex-shrink: 0;
}
.event-day {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 600;
  color: var(--text-1);
  line-height: 1;
}
.event-mon {
  font-size: 9.5px;
  text-transform: uppercase;
  color: var(--text-3);
  letter-spacing: 0.06em;
  margin-top: 3px;
}

.event-body { flex: 1; min-width: 0; }
.event-title { font-weight: 600; font-size: 14px; color: var(--text-1); }
.event-desc { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
.event-time { font-size: 12px; color: var(--text-2); margin-top: 5px; display: flex; align-items: center; gap: 5px; }
.event-actions { flex-shrink: 0; }

/* ================================================================
   CONFIG ROWS
================================================================ */
.cfg-row {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.cfg-row:last-child { border-bottom: none; }
.cfg-row-info { flex: 1; min-width: 0; }
.cfg-row-name { font-weight: 600; font-size: 13.5px; color: var(--text-1); }
.cfg-row-meta { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.cfg-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ================================================================
   PROJECTION METRICS
================================================================ */
.proj-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 20px;
  border-bottom: 1px solid var(--border);
}
.proj-row:last-child { border-bottom: none; }
.proj-lbl { font-size: 13px; color: var(--text-2); }
.proj-val {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 14px;
  color: var(--text-1);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.proj-val.pos { color: var(--green); }
.proj-val.neg { color: var(--red); }
.proj-val.gold { color: var(--gold); }

/* ================================================================
   SUBTABS (Mozos / Anfitrionas)
================================================================ */
.subtab-row {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
  overflow-x: auto;
}
.st {
  padding: 9px 20px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-3);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s;
}
.st:hover { color: var(--text-2); }
.st.a { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* ================================================================
   EMPTY STATES
================================================================ */
.empty-box {
  padding: 36px 20px;
  text-align: center;
}
.empty-icon { font-size: 28px; opacity: 0.5; margin-bottom: 10px; }
.empty-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 4px;
}
.empty-hint { font-size: 12.5px; color: var(--text-3); }

/* ================================================================
   MODALS
================================================================ */
.mbd {
  position: fixed;
  inset: 0;
  background: rgba(31, 41, 35, 0.50);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 0;
}

.mbox {
  background: var(--bg-surface);
  border: 1px solid var(--border-2);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 24px 22px calc(28px + env(safe-area-inset-bottom));
  width: 100%;
  max-width: 540px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.12);
  animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}

.mbox h3 {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-1);
  margin: 0 0 20px;
  letter-spacing: -0.01em;
}

/* ================================================================
   FORM FIELDS
================================================================ */
.field { margin-bottom: 14px; }

.field label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 6px;
}

input[type=text], input[type=number], input[type=password],
input[type=date], input[type=time], select {
  width: 100%;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  color: var(--text-1);
  padding: 10px 12px;
  border-radius: var(--r-sm);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.15s;
}
input:focus, select:focus { border-color: var(--accent); background: var(--bg-surface-3); }
select option { background: var(--bg-surface-2); }

/* ================================================================
   TOAST
================================================================ */
.sazon-toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-surface-3);
  border: 1px solid var(--border-2);
  color: var(--text-1);
  padding: 9px 18px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 500;
  z-index: 300;
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.10);
}
.sazon-toast.err {
  background: var(--red-dim);
  border-color: rgba(184,74,74,0.40);
  color: #B84A4A;
}

/* ================================================================
   SPINNER
================================================================ */
.spinner {
  display: inline-block;
  width: 13px; height: 13px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.65s linear infinite;
  vertical-align: middle;
  margin-right: 5px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ================================================================
   LOGIN PROFESIONAL Y ANIMACIONES
================================================================ */
.login-shell {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-base);
  padding: 24px 16px;
  transition: opacity 0.45s ease, transform 0.45s ease;
  will-change: opacity, transform;
}

.login-shell.fade-out {
  opacity: 0;
  transform: scale(0.98);
  pointer-events: none;
}

/* ================================================================
   LOGIN OVERLAY / MODAL FLOTANTE CENTRADO
================================================================ */
.login-overlay {
  position: fixed;
  inset: 0;
  background: rgba(18, 32, 24, 0.35);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s ease;
}

.login-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.login-modal-box {
  background: var(--bg-surface);
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 14px;
  padding: 16px 26px;
  box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.16), 0 6px 16px -4px rgba(0, 0, 0, 0.08);
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-width: 210px;
  justify-content: center;
  transform: scale(0.92) translateY(6px);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
  user-select: none;
}

.login-overlay.active .login-modal-box {
  transform: scale(1) translateY(0);
}

.modal-spinner {
  width: 17px;
  height: 17px;
  border: 2.2px solid rgba(47, 107, 79, 0.25);
  border-top-color: #2F6B4F;
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  display: inline-block;
  flex-shrink: 0;
}

.login-modal-text {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text-1);
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.login-modal-check {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #E8F5E9;
  color: #2E7D32;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13.5px;
  font-weight: 700;
  flex-shrink: 0;
  animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modalPop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* ================================================================
   MODAL FLOTANTE DE CONFIRMACIÓN (CERRAR SESIÓN)
================================================================ */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(18, 32, 24, 0.35);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.confirm-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.confirm-modal-box {
  background: var(--bg-surface);
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 14px;
  padding: 24px 26px;
  box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.16), 0 6px 16px -4px rgba(0, 0, 0, 0.08);
  width: 90%;
  max-width: 340px;
  text-align: center;
  transform: scale(0.92) translateY(6px);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
  user-select: none;
}

.confirm-overlay.active .confirm-modal-box {
  transform: scale(1) translateY(0);
}

.confirm-modal-title {
  font-size: 15.5px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}

.confirm-modal-sub {
  font-size: 12.5px;
  color: var(--text-3);
  margin-bottom: 18px;
  line-height: 1.4;
}

.confirm-modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.confirm-btn-cancel {
  flex: 1;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-surface-2);
  color: var(--text-2);
  transition: all 0.2s ease;
}
.confirm-btn-cancel:hover {
  background: var(--bg-surface-3);
  color: var(--text-1);
}

.confirm-btn-danger {
  flex: 1;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid rgba(184, 74, 74, 0.25);
  background: #B84A4A;
  color: #FFFFFF;
  transition: all 0.2s ease;
}
.confirm-btn-danger:hover {
  background: #9E3838;
}

.confirm-modal-loading {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 10px 8px;
}

.login-spinner {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-top-color: #FFFFFF;
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  display: inline-block;
  margin-right: 8px;
  flex-shrink: 0;
}

.login-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 36px 32px;
  width: 100%;
  max-width: 410px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.login-card.shake {
  animation: loginShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

.login-card.success {
  border-color: #3F805C;
  box-shadow: 0 0 0 3px rgba(63, 128, 92, 0.22), 0 12px 28px rgba(47, 107, 79, 0.15);
}

@keyframes loginShake {
  10%, 90% { transform: translate3d(-2px, 0, 0); }
  20%, 80% { transform: translate3d(3px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}

.login-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 28px;
}

.login-logo {
  width: 100%;
  max-width: 320px;
  height: auto;
  display: block;
  user-select: none;
}

.login-mark {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, #1D4030, #2F6B4F);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(47, 107, 79, 0.25);
}

.login-brand-name { font-size: 22px; font-weight: 700; color: var(--text-1); letter-spacing: -0.02em; line-height: 1.1; }
.login-brand-sub  { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 3px; font-weight: 600; }

.login-feedback {
  min-height: 22px;
  margin: 10px 0 14px;
  font-size: 12.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}
.login-feedback.err { color: #C62828; }
.login-feedback.suc { color: #2E7D32; font-weight: 600; }

.login-input {
  font-size: 22px;
  letter-spacing: 6px;
  text-align: center;
  padding: 13px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--bg-base);
  color: var(--text-1);
  width: 100%;
  box-sizing: border-box;
  transition: all 0.25s ease;
}
.login-input:focus {
  border-color: var(--accent);
  outline: none;
  box-shadow: 0 0 0 3px rgba(47, 107, 79, 0.18);
  background: #fff;
}
.login-input.err {
  border-color: #E53935 !important;
  box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.15) !important;
}
.login-input.suc {
  border-color: #388E3C !important;
  box-shadow: 0 0 0 3px rgba(56, 142, 60, 0.2) !important;
  background: #F1F8F4 !important;
}

/* ================================================================
   TOP NAVBAR USER — MINIMALISTA Y ELEGANTE (SIN FONDOS NI CAJAS)
================================================================ */
.top-nav-user {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 0;
  margin: 0;
}

.top-nav-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #4ADE80;
  box-shadow: 0 0 6px rgba(74, 222, 128, 0.55);
  flex-shrink: 0;
  display: inline-block;
}

.top-nav-name {
  font-size: 13.5px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.94);
  letter-spacing: -0.01em;
  white-space: nowrap;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  user-select: none;
}

.top-nav-logout {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  color: rgba(255, 255, 255, 0.65);
  font-size: 15px;
  line-height: 1;
  padding: 4px;
  margin-left: 2px;
  cursor: pointer;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s ease, transform 0.2s ease;
}

.top-nav-logout:hover {
  color: #FFFFFF;
  transform: scale(1.1);
}

.top-nav-logout:active {
  transform: scale(0.95);
}

@media (max-width: 768px) {
  .top-nav-user {
    gap: 8px;
  }
  .top-nav-name {
    font-size: 12.5px;
    max-width: 140px;
  }
  .top-nav-logout {
    font-size: 14px;
    padding: 2px;
  }
}

/* ================================================================
   UTILITY
================================================================ */
.text-muted  { color: var(--text-3); }
.text-accent { color: var(--accent); }
.text-gold   { color: var(--gold); }
.text-green  { color: var(--green); }
.text-red    { color: var(--red); }
.fw600       { font-weight: 600; }
.mono        { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.mt12 { margin-top: 12px; }
.mt16 { margin-top: 16px; }
.flex-end { display: flex; justify-content: flex-end; gap: 8px; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.flex-gap { display: flex; align-items: center; gap: 8px; }

/* ================================================================
   SIDEBAR — GREEN IDENTITY
================================================================ */

/* Sidebar base: green gradient */
.g-sidebar {
  background: linear-gradient(180deg, #1D4030 0%, #214936 60%, #2A5C43 100%);
  border-right: 1px solid rgba(0,0,0,0.14);
}

/* Brand area */
.sb-brand { border-bottom-color: rgba(255,255,255,0.10); }
.sb-logo-mark {
  background: rgba(255,255,255,0.15);
  color: #FFFFFF;
  border: 1px solid rgba(255,255,255,0.20);
}
.sb-logo-name { color: #FFFFFF; }
.sb-logo-sub   { color: rgba(255,255,255,0.48); }

/* Group labels */
.sb-group-label { color: rgba(255,255,255,0.40); }

/* Nav buttons */
.g-sidebar .nb {
  color: rgba(255,255,255,0.68);
  border-left-color: transparent;
}
.g-sidebar .nb:hover {
  color: #FFFFFF;
  background: rgba(255,255,255,0.09);
}
.g-sidebar .nb.a {
  color: #FFFFFF;
  background: rgba(255,255,255,0.14);
  border-left-color: #FFFFFF;
  font-weight: 600;
}
.g-sidebar .nb.a .nb-icon { opacity: 1; }

/* User footer */
.sb-user { border-top-color: rgba(255,255,255,0.10); }
.sb-avatar {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.80);
}
.sb-user-name { color: #FFFFFF; }
.sb-user-role  { color: rgba(255,255,255,0.46); }
.logout-btn    { color: rgba(255,255,255,0.46); }
.logout-btn:hover { color: #FFFFFF; }

/* ================================================================
   PAGE HEADER — GREEN TOP BAR
================================================================ */
.g-page-hd {
  background: #2F6B4F;
  border-bottom: 1px solid rgba(0,0,0,0.12);
}
.page-title { color: #FFFFFF; }
.page-sub   { color: rgba(255,255,255,0.60); }

/* Subtab row inside green header */
.g-page-hd .subtab-row { border-bottom-color: rgba(255,255,255,0.15); }
.g-page-hd .st {
  color: rgba(255,255,255,0.60);
  border-bottom-color: transparent;
}
.g-page-hd .st:hover { color: rgba(255,255,255,0.85); }
.g-page-hd .st.a {
  color: #FFFFFF;
  border-bottom-color: #FFFFFF;
}

/* ================================================================
   MOBILE HEADER & BOTTOM NAV — GREEN
================================================================ */
.m-header {
  background: #214936;
  border-bottom-color: rgba(0,0,0,0.12);
}
.m-brand       { color: #FFFFFF; }
.m-brand-mark  { background: rgba(255,255,255,0.14); color: #FFFFFF; }
.m-user-tag {
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.78);
}
.m-nav {
  background: #214936;
  border-top-color: rgba(0,0,0,0.12);
}
.m-nb   { color: rgba(255,255,255,0.52); }
.m-nb.a { color: #FFFFFF; }


/* ================================================================
   DASHBOARD DE METAS
================================================================ */

/* Filter bar */
.db-filter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  align-items: end;
}
.db-fg { display: flex; flex-direction: column; gap: 4px; }
.db-fg-btns { display: flex; gap: 6px; align-items: flex-end; }
.db-fl {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}
.db-fsel {
  width: 100%;
  background: var(--bg-surface-2);
  border: 1px solid var(--border);
  color: var(--text-1);
  padding: 7px 10px;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.15s;
}
.db-fsel:focus { border-color: var(--accent); }

/* KPI row */
.db-kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.db-kpi {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 16px 16px 14px;
  position: relative;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.db-kpi-icon { font-size: 20px; margin-bottom: 8px; }
.db-kpi-val {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.db-kpi-lbl {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 4px;
  font-weight: 500;
}
.db-kpi-prog {
  height: 3px;
  background: var(--bg-surface-2);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 10px;
}
.db-kpi-prog > div { height: 100%; border-radius: 99px; transition: width 0.4s; }

/* Main progress */
.db-main-prog-row {
  display: flex;
  align-items: flex-start;
  gap: 24px;
  margin-bottom: 16px;
}
.db-main-prog-info { flex-shrink: 0; }
.db-main-prog-pct {
  font-family: var(--font-mono);
  font-size: 40px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.03em;
}
.db-main-prog-details { flex: 1; }
.db-detail-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.db-detail-row:last-child { border-bottom: none; }
.db-detail-lbl { color: var(--text-2); }
.db-detail-val { font-family: var(--font-mono); font-weight: 600; color: var(--text-1); }

.db-big-prog {
  height: 28px;
  background: var(--bg-surface-2);
  border-radius: var(--r-sm);
  overflow: hidden;
}
.db-big-prog-bar {
  height: 100%;
  border-radius: var(--r-sm);
  transition: width 0.5s cubic-bezier(0.16,1,0.3,1);

  align-items: center;
}

/* Worker table */
.db-wk-table { width: 100%; }
.db-wk-hd {
  display: grid;
  grid-template-columns: 2fr 1.3fr 1fr 1.6fr 1.1fr 1fr 1.3fr;

  font-weight: 700;
  color: var(--text-3);

  border-bottom: 1px solid var(--border);
  gap: 8px;
}
.db-wk-row {
  display: grid;
  grid-template-columns: 2fr 1.3fr 1fr 1.6fr 1.1fr 1fr 1.3fr;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  gap: 8px;

  font-size: 13px;
}
.db-wk-row:last-child { border-bottom: none; }

  color: var(--accent);

.db-mini-prog {

/* Horizontal bar chart */
.db-barchart { display: flex; flex-direction: column; gap: 12px; }
.db-bar-row { display: flex; align-items: center; gap: 12px; }
.db-bar-label { width: 70px; font-size: 13px; font-weight: 600; color: var(--text-1); text-align: right; flex-shrink: 0; }

/* Two-column layout */
.db-two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 20px;
}

/* Line/bar chart (evolution) */
.db-linechart { width: 100%; }
.db-line-bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 100px;
}
.db-line-col {

  flex-direction: column;
  align-items: center;
  gap: 4px;

.db-distrib-lbl { font-size: 11px; color: var(--text-3); margin-top: 4px; }

/* Indicator row */
.db-ind-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 18px;

.db-ind {

.db-alerts { display: flex; flex-direction: column; gap: 8px; }

  display: flex;
  align-items: flex-start;
  gap: 8px;

  background: var(--bg-surface-2);
  border-radius: var(--r-sm);
  border-left: 3px solid var(--gold);

/* Dashboard responsive */
@media (max-width: 900px) {
  .db-two-col { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .db-kpi-row { grid-template-columns: 1fr 1fr; }

    grid-template-columns: 1fr;

    border: 1px solid var(--border);
    border-radius: var(--r-md);

  }

  .db-distrib { flex-direction: column; }

<script>
(function(){
// ================================================================
// API ENDPOINT CONFIG
// ================================================================
const CONFIG_KEY = 'sazon_api_url';
if (localStorage.getItem(CONFIG_KEY) && localStorage.getItem(CONFIG_KEY).includes('christian-97.workers.dev')) {
  localStorage.removeItem(CONFIG_KEY);
}
const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
const DEFAULT_REMOTE_API = 'https://sazon-api.christhiangutierrezrosas.workers.dev';
const API_URL = localStorage.getItem(CONFIG_KEY) || (isLocalhost ? window.location.origin : DEFAULT_REMOTE_API);

// ================================================================
// API CLIENT
// ================================================================
const api = {
  token: localStorage.getItem('sazon_auth_token') || null,
  setToken(t) {
    this.token = t;
    if (t) localStorage.setItem('sazon_auth_token', t);
    else localStorage.removeItem('sazon_auth_token');
  },
  async request(path, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    if (this.token) headers['Authorization'] = `Bearer ${this.token}`;
    const res = await fetch(`${API_URL}${path}`, { ...options, headers });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error en la solicitud a la API');
    return data;
  },
  async health() { return this.request('/api/health'); },
  async login(code) {
    const data = await this.request('/api/auth/login', { method: 'POST', body: JSON.stringify({ code }) });
    if (data.token) this.setToken(data.token);
    return data;
  },
  async getUsers() { return this.request('/api/users'); },
  async createUser(u) { return this.request('/api/users', { method: 'POST', body: JSON.stringify(u) }); },
  async updateUser(id, u) { return this.request(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify(u) }); },
  async getProducts(all = false) { return this.request(`/api/products${all ? '?all=true' : ''}`); },
  async createProduct(p) { return this.request('/api/products', { method: 'POST', body: JSON.stringify(p) }); },
  async updateProduct(id, p) { return this.request(`/api/products/${id}`, { method: 'PUT', body: JSON.stringify(p) }); },
  async deleteProduct(id) { return this.request(`/api/products/${id}`, { method: 'DELETE' }); },
  async getSales(params = {}) {
    const qs = new URLSearchParams(params).toString();
    return this.request(`/api/sales${qs ? '?' + qs : ''}`);
  },
  async recordSale(s) { return this.request('/api/sales', { method: 'POST', body: JSON.stringify(s) }); },
  async recordSalesBulk(payload) { return this.request('/api/sales/bulk', { method: 'POST', body: JSON.stringify(payload) }); },
  async updateSale(id, s) { return this.request(`/api/sales/${id}`, { method: 'PUT', body: JSON.stringify(s) }); },
  async getGoals(params = {}) {
    const qs = new URLSearchParams(params).toString();
    return this.request(`/api/goals${qs ? '?' + qs : ''}`);
  },
  async saveGoal(g) { return this.request('/api/goals', { method: 'POST', body: JSON.stringify(g) }); },
  async deleteGoal(id) { return this.request(`/api/goals/${id}`, { method: 'DELETE' }); },
  async getPromotions() { return this.request('/api/promotions'); },
  async createPromotion(p) { return this.request('/api/promotions', { method: 'POST', body: JSON.stringify(p) }); },
  async getTasks() { return this.request('/api/tasks'); },
  async createTask(t) { return this.request('/api/tasks', { method: 'POST', body: JSON.stringify(t) }); },
  async updateTask(id, t) { return this.request(`/api/tasks/${id}`, { method: 'PUT', body: JSON.stringify(t) }); },
  async deleteTask(id) { return this.request(`/api/tasks/${id}`, { method: 'DELETE' }); },
  async toggleTask(id, completed, observations) {
    return this.request(`/api/tasks/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ action: 'toggle_complete', completed, observations })
    });
  },
  async getEvents() { return this.request('/api/events'); },
  async createEvent(e) { return this.request('/api/events', { method: 'POST', body: JSON.stringify(e) }); },
  async deleteEvent(id) { return this.request(`/api/events/${id}`, { method: 'DELETE' }); },
  async getKpi(params = {}) {
    const qs = new URLSearchParams(params).toString();
    return this.request(`/api/kpi${qs ? '?' + qs : ''}`);
  }
};

// ================================================================
// GLOBAL STATE
// ================================================================
function today() { return new Date(); }
function dim() { const d = today(); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
function localDateStr(d = today()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function localMonthStr(d = today()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  return `${y}-${m}`;
}

const S = {
  session: JSON.parse(localStorage.getItem('sazon_session') || 'null'),
  tab: 'ventas',
  sub: 'mozo',
  toast: null,
  modal: null,
  expandedWaiter: null,
  loading: false,
  selectedSaleDate: localDateStr(),
  selectedPaymentMethod: 'EFECTIVO',
  users: [],
  products: [],
  sales: [],
  goals: { storeTargets: [], productGoals: [], workerTargets: [] },
  promotions: [],
  tasks: [],
  events: [],
  kpi: null,
  monthDays: dim(),
  currentDay: today().getDate()
};

function saveSession(sess) {
  S.session = sess;
  if (sess) localStorage.setItem('sazon_session', JSON.stringify(sess));
  else localStorage.removeItem('sazon_session');
}

function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function money(n) { return 'S/ ' + (Math.round(n || 0)).toLocaleString('es-PE'); }
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }
function toast(m) { S.toast = m; render(); setTimeout(() => { S.toast = null; render(); }, 2200); }
function openM(type, data) { S.modal = { type, data: data || {} }; render(); }
function closeM() { S.modal = null; render(); }

// ================================================================
// DATA SYNC
// ================================================================
async function syncFromD1(renderAfter = true) {
  if (!S.session) return;
  S.loading = true;
  try {
    const now = today();
    const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const utcMonth = now.toISOString().substring(0, 7);

    // Queries sales for current month; if near UTC boundary (e.g. evening in UTC-5), merge both
    const salesPromise = (utcMonth !== currentMonth)
      ? Promise.all([
          api.getSales({ month: currentMonth }),
          api.getSales({ month: utcMonth })
        ]).then(([r1, r2]) => {
          const map = new Map();
          [...(r1.sales || []), ...(r2.sales || [])].forEach(s => map.set(s.id, s));
          return { sales: Array.from(map.values()) };
        }).catch(() => api.getSales({ month: currentMonth }))
      : api.getSales({ month: currentMonth });

    const [uRes, pRes, sRes, gRes, kRes, proRes] = await Promise.all([
      api.getUsers(),
      api.getProducts(true),
      salesPromise,
      api.getGoals({ month: currentMonth }),
      api.getKpi({ month: currentMonth }),
      api.getPromotions().catch(() => ({ promotions: [] }))
    ]);
    S.users      = uRes.users      || [];
    S.products   = pRes.products   || [];
    S.sales      = sRes.sales      || [];
    S.goals      = {
      storeTargets: (gRes && gRes.storeTargets) || [],
      productGoals: (gRes && gRes.productGoals) || [],
      workerTargets: (gRes && gRes.workerTargets) || []
    };
    S.tasks      = [];
    S.events     = [];
    S.kpi        = kRes;
    S.promotions = proRes.promotions || [];
  } catch (e) {
    console.error('Error sincronizando con D1:', e);
    toast('Aviso: ' + e.message);
  } finally {
    S.loading = false;
    if (renderAfter) render();
  }
}

function catalog(role) {
  return S.products.filter(p => p.active && (p.target_role === 'ALL' || p.target_role === (role || 'MOZO').toUpperCase()));
}

function getStoreTarget(periodMonth) {
  const m = periodMonth || localMonthStr();
  const st = (S.goals.storeTargets || []).find(t => t.period_month === m && (t.day === null || t.day === undefined));
  if (st) return parseFloat(st.target_amount) || 350000;
  return (S.kpi && S.kpi.kpis && parseFloat(S.kpi.kpis.totalTarget)) || 350000;
}

function goalForWorker(workerId, periodMonth) {
  const wid = String(workerId);
  const m = periodMonth || localMonthStr();
  const found = (S.goals.workerTargets || []).find(g => String(g.worker_id) === wid && (g.period_month === m || !g.period_month));
  if (found) {
    return {
      amount: parseFloat(found.target_amount) || 0,
      cashAmount: parseFloat(found.cash_target_amount) || 0,
      id: found.id,
      custom: true,
      period: found.period_month
    };
  }

  // Meta independiente: Si no tiene meta asignada, devuelve 0 sin forzar división de la meta de tienda
  return { amount: 0, cashAmount: 0, id: null, custom: false, period: m };
}

function goalForProduct(productId, workerId) {
  const pid = String(productId);
  const wid = workerId != null ? String(workerId) : null;
  let found;
  if (wid) {
    found = (S.goals.productGoals || []).find(g => String(g.product_id) === pid && String(g.worker_id) === wid);
    if (!found) found = (S.goals.productGoals || []).find(g => String(g.product_id) === pid && (g.worker_id === null || g.worker_id === undefined || g.worker_id === ''));
  } else {
    found = (S.goals.productGoals || []).find(g => String(g.product_id) === pid && (g.worker_id === null || g.worker_id === undefined || g.worker_id === ''));
  }
  if (found) return found.target_quantity;
  const p = S.products.find(x => String(x.id) === pid);
  return (p && p.name === '1/4 Pollo') ? 200 : 40;
}

function qtyForWorkerProduct(workerId, productId) {
  const wid = String(workerId);
  const pid = String(productId);
  return S.sales
    .filter(s => String(s.worker_id) === wid && String(s.product_id) === pid)
    .reduce((acc, s) => acc + (s.quantity || 0), 0);
}

function totalPollosForWorker(workerId) {
  const pCuarto = S.products.find(p => p.name === '1/4 Pollo');
  if (!pCuarto) return 0;
  return qtyForWorkerProduct(workerId, pCuarto.id) / 4;
}

function goalPace(goal) {
  return Math.round(goal * (S.currentDay / S.monthDays));
}

function wLogin(r) {
  const card = r.querySelector('#login-card');
  const ic = r.querySelector('#lc');
  const b = r.querySelector('#lb');
  const e = r.querySelector('#le');
  const overlay = r.querySelector('#login-overlay');
  const modalBox = r.querySelector('#login-modal-box');
  let inProgress = false;

  async function go() {
    if (inProgress) return;
    const code = ic.value.trim();
    if (!code) {
      if (card) {
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }
      ic.classList.add('err');
      e.className = 'login-feedback err';
      e.innerHTML = '<span style="font-size:13px;margin-right:4px">⚠️</span><span>Ingresa tu código de empleado.</span>';
      ic.focus();
      return;
    }

    inProgress = true;

    // Bloquear controles sin alterar ni desarmar el formulario
    ic.disabled = true;
    b.disabled = true;
    ic.classList.remove('err', 'suc');
    e.className = 'login-feedback';
    e.innerHTML = '';

    // 1. Mostrar tarjeta flotante centrada con spinner fino + "Autenticando..."
    modalBox.innerHTML = `
      <span class="modal-spinner"></span>
      <span class="login-modal-text">Autenticando...</span>
    `;
    overlay.classList.add('active');

    const startTime = Date.now();

    try {
      const data = await api.login(code);

      // Iniciar la precarga de datos inmediatamente en paralelo mientras se muestra el flotante
      saveSession(data.user);
      S.tab = 'ventas';
      const syncPromise = syncFromD1(false);

      // Mantener visible al menos ~700 ms sin parpadeos
      const elapsed = Date.now() - startTime;
      if (elapsed < 700) {
        await new Promise(res => setTimeout(res, 700 - elapsed));
      }

      // 2. Cambiar suavemente dentro del mismo flotante al check verde con "Autenticación correcta" (~800 ms)
      modalBox.innerHTML = `
        <span class="login-modal-check">✓</span>
        <span class="login-modal-text" style="color:#2E7D32">Autenticación correcta</span>
      `;

      await new Promise(res => setTimeout(res, 800));

      // Esperar a que la promesa de datos termine antes de desvanecer y mostrar la pantalla principal
      try {
        await syncPromise;
      } catch (errSync) {
        console.error('Error precargando datos:', errSync);
      }

      // 3. Desvanecer suavemente tanto el flotante como la vista de login para entrar al sistema
      const shell = card.closest('.login-shell') || card;
      shell.classList.add('fade-out');

      await new Promise(res => setTimeout(res, 450));

      // Render limpio y único con los datos reales ya cargados
      render();

    } catch (err) {
      // Garantizar que no haya corte abrupto antes de volver
      const elapsed = Date.now() - startTime;
      if (elapsed < 700) {
        await new Promise(res => setTimeout(res, 700 - elapsed));
      }

      // Ocultar el flotante suavemente
      overlay.classList.remove('active');
      await new Promise(res => setTimeout(res, 200));

      // Mostrar error de código inválido sin desarmar el formulario
      if (card) {
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }
      ic.classList.add('err');
      e.className = 'login-feedback err';
      const msg = err.message || 'Código incorrecto.';
      e.innerHTML = '<span style="font-size:13px;margin-right:4px">✕</span><span>' + esc(msg) + '</span>';

      // Restaurar controles
      ic.disabled = false;
      b.disabled = false;
      inProgress = false;
      ic.focus();
      ic.select();
    }
  }

  b.addEventListener('click', go);
  ic.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      go();
    }
  });
}

// ================================================================
// PARSER Y COMPONENTE DE INGRESO RÁPIDO POR CUADRO DE TEXTO
// ================================================================
function normalizeProdStr(str) {
  return (str || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim();
}

function parseBulkSalesText(rawText) {
  if (!rawText || !rawText.trim()) return { items: [], errors: [], totalAmount: 0, totalUnits: 0 };
  const products = (S.products || []).filter(p => p.active);
  const items = [];
  const errors = [];

  // Dividir por saltos de línea O por comas / punto y coma
  const rawSegments = rawText
    .split(/[\n;]|,\s*(?=[a-zA-Z0-9áéíóúñ])/i)
    .map(s => s.trim())
    .filter(Boolean);

  for (const seg of rawSegments) {
    if (!seg) continue;

    // Detectar patrones:
    // A: "Lomo: 3" o "Lomo = 3" o "Lomo 3"
    // B: "3 Lomo" o "3x Lomo" o "3 x Lomo"
    let qty = 1;
    let prodNamePart = seg;

    const prefixMatch = seg.match(/^(\d+[\.,]?\d*)\s*[xX:]?\s+(.*)$/);
    const suffixMatch = seg.match(/^(.*?)\s*[:=-]?\s*(\d+[\.,]?\d*)$/);

    if (prefixMatch) {
      qty = parseFloat(prefixMatch[1].replace(',', '.')) || 1;
      prodNamePart = prefixMatch[2].trim();
    } else if (suffixMatch && suffixMatch[2]) {
      qty = parseFloat(suffixMatch[2].replace(',', '.')) || 1;
      prodNamePart = suffixMatch[1].trim();
    }

    const normSeg = normalizeProdStr(prodNamePart);
    if (!normSeg) continue;

    // Buscar coincidencia en el catálogo
    let matched = products.find(p => normalizeProdStr(p.name) === normSeg);

    // Si no coincide exacto, buscar por inclusión
    if (!matched) {
      matched = products.find(p => {
        const normP = normalizeProdStr(p.name);
        return normP.includes(normSeg) || normSeg.includes(normP);
      });
    }

    // Reglas de alias frecuentes en salón
    if (!matched) {
      if (normSeg.includes('pollo') || normSeg.includes('cuarto')) matched = products.find(p => normalizeProdStr(p.name).includes('pollo'));
      else if (normSeg.includes('picana') || normSeg.includes('picanha')) matched = products.find(p => normalizeProdStr(p.name).includes('pican'));
      else if (normSeg.includes('champinon')) matched = products.find(p => normalizeProdStr(p.name).includes('champ'));
      else if (normSeg.includes('tequeno')) matched = products.find(p => normalizeProdStr(p.name).includes('tequ'));
      else if (normSeg.includes('trago')) matched = products.find(p => normalizeProdStr(p.name).includes('trago'));
      else if (normSeg.includes('bebida') || normSeg.includes('gaseosa')) matched = products.find(p => normalizeProdStr(p.name).includes('bebida'));
      else if (normSeg.includes('happy')) matched = products.find(p => normalizeProdStr(p.name).includes('happy'));
      else if (normSeg.includes('postre')) matched = products.find(p => normalizeProdStr(p.name).includes('postre'));
    }

    if (matched) {
      const price = matched.price || 0;
      const subtotal = qty * price;
      // Si el producto ya estaba en la lista, sumar cantidad
      const existing = items.find(it => it.product.id === matched.id);
      if (existing) {
        existing.quantity += qty;
        existing.subtotal = existing.quantity * existing.product.price;
      } else {
        items.push({
          product: matched,
          quantity: qty,
          unitPrice: price,
          subtotal
        });
      }
    } else {
      errors.push(`No se reconoció el producto: "${prodNamePart}"`);
    }
  }

  const totalAmount = items.reduce((acc, it) => acc + it.subtotal, 0);
  const totalUnits = items.reduce((acc, it) => acc + it.quantity, 0);

  return { items, errors, totalAmount, totalUnits };
}

// ================================================================
// VIEW: PROYECTADO
// ================================================================
function vProyectado() {
  const isAdmin = S.session.role === 'ADMIN';
  const totalTarget = getStoreTarget();
  const monthlySales = S.sales.reduce((acc, s) => acc + (s.total != null ? s.total : (s.quantity || 0) * (s.unit_price || 0)), 0);
  const expectedPace = Math.round((totalTarget / S.monthDays) * S.currentDay);
  const diffAgainstExpected = monthlySales - expectedPace;
  const isPos = diffAgainstExpected >= 0;
  const projectedClosing = S.currentDay > 0 ? Math.round((monthlySales / S.currentDay) * S.monthDays) : 0;
  const comp = totalTarget > 0 ? Math.round((monthlySales / totalTarget) * 100) : 0;

  // Datos diarios
  const dailyMetrics = (S.kpi && S.kpi.dailyList) || [];
  const currentMonth = (S.kpi && S.kpi.month) || localMonthStr();

  let html = `
  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-lbl">Día actual</div>
      <div class="stat-val">${S.currentDay} / ${S.monthDays}</div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">Meta mensual tienda</div>
      <div class="stat-val" style="color:var(--gold)">${money(totalTarget)}</div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">Venta acumulada</div>
      <div class="stat-val" style="color:var(--accent)">${money(monthlySales)}</div>
    </div>
    <div class="stat-box">
      <div class="stat-lbl">Cumplimiento</div>
      <div class="stat-val ${comp >= 80 ? 'c-green' : comp >= 50 ? 'c-gold' : 'c-accent'}">${comp}%</div>
    </div>
  </div>`;

  html += `<div class="sec-hd"><div class="sec-label">Resumen de proyección financiera</div></div>`;
  html += `<div class="card" style="padding:0;margin-bottom:20px">`;
  html += `
    <div class="proj-row">
      <span class="proj-lbl">Meta mensual (Tienda independiente)</span>
      <span class="proj-val gold">${money(totalTarget)}</span>
    </div>
    <div class="proj-row">
      <span class="proj-lbl">Venta real acumulada</span>
      <span class="proj-val">${money(monthlySales)}</span>
    </div>
    <div class="proj-row">
      <span class="proj-lbl">Esperado a la fecha (ritmo ${S.currentDay}d)</span>
      <span class="proj-val">${money(expectedPace)}</span>
    </div>
    <div class="proj-row">
      <span class="proj-lbl">Diferencia vs. ritmo esperado</span>
      <span class="proj-val ${isPos ? 'pos' : 'neg'}">${isPos ? '+' : ''}${money(diffAgainstExpected)}</span>
    </div>
    <div class="proj-row" style="background:var(--bg-surface-2)">
      <span class="proj-lbl fw600" style="color:var(--text-1)">Cierre proyectado al fin de mes</span>
      <span class="proj-val gold" style="font-size:17px">${money(projectedClosing)}</span>
    </div>`;
  html += `</div>`;

  if (isAdmin) {
    html += `<div class="flex-end" style="margin-top:-10px;margin-bottom:20px">
      <button class="btn gho sm" id="edit-store-target">Modificar meta mensual de tienda</button>
    </div>`;
  }

  // ── TABLA DE PROYECTADOS POR DÍA (3 MÉTRICAS: PROYECTADO, REAL, DIFERENCIA) ──
  html += `<div class="sec-hd"><div class="sec-label">Seguimiento Diario: Proyectado vs. Venta Real vs. Diferencia</div></div>`;
  html += `<div class="card" style="padding:0;margin-bottom:20px">`;
  if (dailyMetrics.length === 0) {
    html += `<div class="empty-box"><div class="empty-icon">📈</div><div class="empty-title">Cargando proyecciones diarias...</div></div>`;
  } else {
    html += `<table class="dt"><thead><tr>
      <th style="width:70px">Día</th>
      <th>Fecha</th>
      <th class="r">Proyectado (Meta)</th>
      <th class="r">Venta Real</th>
      <th class="r">Diferencia</th>
      <th class="r">Estado</th>
      ${isAdmin ? '<th class="r">Editar</th>' : ''}
    </tr></thead><tbody>`;

    dailyMetrics.forEach(d => {
      const isToday = d.day === S.currentDay;
      const isPast = d.day < S.currentDay;
      const isFuture = d.day > S.currentDay;
      const diffPos = d.diff >= 0;
      const diffStr = (diffPos ? '+' : '') + money(d.diff);
      const diffColor = diffPos ? 'var(--green)' : 'var(--red)';

      let estadoBadge = '<span class="badge" style="opacity:0.6">Pendiente</span>';
      if (isToday) {
        estadoBadge = '<span class="badge acc">Hoy</span>';
      } else if (isPast) {
        estadoBadge = diffPos ? '<span class="badge" style="background:#E6F4EA;color:#137333">✓ Cumplido</span>' : '<span class="badge red">▼ Bajo meta</span>';
      }

      html += `<tr style="${isToday ? 'background:rgba(47,107,79,0.08);font-weight:600' : ''}">
        <td><span class="fw600">Día ${d.day}</span></td>
        <td style="font-size:12px;color:var(--text-2)">${d.date}</td>
        <td class="r dt-num" style="color:var(--gold);font-weight:600">${money(d.target)}</td>
        <td class="r dt-num" style="font-weight:600">${d.actual > 0 ? money(d.actual) : (isFuture ? '—' : 'S/ 0')}</td>
        <td class="r dt-num" style="color:${isFuture && d.actual === 0 ? 'var(--text-3)' : diffColor};font-weight:700">
          ${isFuture && d.actual === 0 ? '—' : diffStr}
        </td>
        <td class="r">${estadoBadge}</td>
        ${isAdmin ? `<td class="r">
          <button class="btn gho sm" data-editdaytarget="${d.day}" data-target="${d.target}" title="Ajustar meta del día ${d.day}">✏️</button>
        </td>` : ''}
      </tr>`;
    });

    // Fila de totales acumulados
    const totalDailyTarget = dailyMetrics.reduce((a, c) => a + c.target, 0);
    const totalDailyActual = dailyMetrics.reduce((a, c) => a + c.actual, 0);
    const totalDailyDiff = totalDailyActual - totalDailyTarget;
    html += `<tr style="background:var(--bg-surface-2);font-weight:700">
      <td colspan="2">TOTAL ACUMULADO</td>
      <td class="r dt-num" style="color:var(--gold)">${money(totalDailyTarget)}</td>
      <td class="r dt-num" style="color:var(--accent)">${money(totalDailyActual)}</td>
      <td class="r dt-num" style="color:${totalDailyDiff >= 0 ? 'var(--green)' : 'var(--red)'}">${(totalDailyDiff >= 0 ? '+' : '') + money(totalDailyDiff)}</td>
      <td colspan="${isAdmin ? 2 : 1}"></td>
    </tr>`;
    html += `</tbody></table>`;
  }
  html += `</div>`;

  return html;
}

function vTareas() {
  const isAdmin = S.session.role === 'ADMIN';
  let html = '';

  if (isAdmin) {
    html += `<div class="flex-end" style="margin-bottom:16px;justify-content:flex-start">
      <button class="btn pri" id="add-task">+ Nueva tarea</button>
    </div>`;
  }

  html += `<div class="card" style="padding:0">`;

  if (S.tasks.length === 0) {
    html += `<div class="empty-box">
      <div class="empty-icon">✅</div>
      <div class="empty-title">Sin tareas pendientes</div>
      <div class="empty-hint">${isAdmin ? 'Crea una tarea para asignarla al equipo.' : 'No tienes tareas asignadas en este momento.'}</div>
    </div>`;
  } else {
    const now = today();
    S.tasks.forEach(t => {
      const dl       = new Date(t.deadline + 'T23:59:59');
      const diffD    = Math.ceil((dl - now) / 86400000);
      const late     = diffD < 0;
      const myAssign = (t.assignees || []).find(a => a.user_id === S.session.id);
      const done     = myAssign && myAssign.completed;

      html += `<div class="task-item">`;

      if (!isAdmin) {
        html += `<div class="task-chk ${done ? 'done' : ''}" data-donetask="${t.id}" title="Marcar tarea">${done ? '✓' : ''}</div>`;
      }

      html += `<div class="task-body">
        <div class="task-name${done ? ' done-text' : ''}">${esc(t.name)}</div>
        <div class="task-foot">
          <span class="badge ${late ? 'red' : 'def'}">${late ? 'Vencida hace ' + Math.abs(diffD) + ' d' : 'Plazo: ' + diffD + ' d'}</span>
          <span class="text-muted">${t.deadline}</span>
        </div>`;

      if (myAssign && myAssign.observations) {
        html += `<div style="margin-top:6px;font-size:12px;color:var(--text-3);font-style:italic">"${esc(myAssign.observations)}"</div>`;
      }

      if (isAdmin) {
        const completedList = (t.assignees || []).filter(a => a.completed);
        if (completedList.length === 0) {
          html += `<div style="margin-top:6px;font-size:12px;color:var(--text-3)">Pendiente — ningún colaborador la ha completado aún.</div>`;
        } else {
          completedList.forEach(c => {
            html += `<div style="margin-top:4px;font-size:12px;color:var(--green)">✓ ${esc(c.worker_name || '')}${c.observations ? ' — "' + esc(c.observations) + '"' : ''}</div>`;
          });
        }
      }

      html += `</div>`;

      if (isAdmin) {
        html += `<div class="task-actions">
          <button class="btn dan sm" data-deltask="${t.id}" title="Eliminar tarea">✕</button>
        </div>`;
      }

      html += `</div>`;
    });
  }

  html += `</div>`;
  return html;
}

function vCronogramas() {
  const isAdmin = S.session.role === 'ADMIN';
  const months  = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  let html = '';

  if (isAdmin) {
    html += `<div class="flex-end" style="margin-bottom:16px;justify-content:flex-start">
      <button class="btn pri" id="add-event">+ Programar evento</button>
    </div>`;
  }

  html += `<div class="card" style="padding:0">`;

  if (S.events.length === 0) {
    html += `<div class="empty-box">
      <div class="empty-icon">📅</div>
      <div class="empty-title">Sin eventos programados</div>
      <div class="empty-hint">${isAdmin ? 'Programa un evento o reunión para el equipo.' : 'No hay eventos próximos en este momento.'}</div>
    </div>`;
  } else {
    S.events.forEach(ev => {
      const d   = new Date(ev.event_date + 'T12:00:00');
      const day = d.getDate();
      const mon = months[d.getMonth()] || '';
      html += `
      <div class="event-item">
        <div class="event-date">
          <div class="event-day">${day}</div>
          <div class="event-mon">${mon}</div>
        </div>
        <div class="event-body">
          <div class="event-title">${esc(ev.title)}</div>
          ${ev.description ? `<div class="event-desc">${esc(ev.description)}</div>` : ''}
          <div class="event-time">⏰ ${ev.event_time}${ev.event_type ? ' · ' + esc(ev.event_type) : ''}</div>
        </div>
        ${isAdmin ? `<div class="event-actions">
          <button class="btn dan sm" data-delevent="${ev.id}" title="Eliminar evento">✕</button>
        </div>` : ''}
      </div>`;
    });
  }

  html += `</div>`;
  return html;
}
