function vDashboard() {
  if (!S.dash) S.dash = { period: 'mes', month: localMonthStr(), from: '', to: '', worker: 'all', product: 'all', shift: 'all', status: 'all' };
  const df = S.dash;
  const activeMonth = df.month || localMonthStr();

  // Workers
  const mozos = S.users.filter(u => u.role === 'MOZO' && u.active);
  const anfs  = S.users.filter(u => u.role === 'ANFITRIONA' && u.active);
  const allWk = [...mozos, ...anfs];
  const prods = (S.products || []).filter(p => p.active);
  const selectedProd = df.product && df.product !== 'all' ? prods.find(p => String(p.id) === String(df.product)) : null;

  // Helper para computar ventas respetando filtros, producto y medio de pago
  function workerSalesFiltered(wId) {
    const widStr = String(wId);
    let total = 0;
    let cash = 0;
    let units = 0;

    S.sales.forEach(s => {
      if (String(s.worker_id) !== widStr) return;
      if (df.month && !s.sale_date.startsWith(df.month)) return;
      if (df.from && s.sale_date < df.from) return;
      if (df.to && s.sale_date > df.to) return;
      if (df.period === 'hoy' && s.sale_date !== localDateStr()) return;

      // Filtro por producto seleccionado
      if (selectedProd && String(s.product_id) !== String(selectedProd.id)) return;

      const prod = S.products.find(p => String(p.id) === String(s.product_id));
      const price = s.unit_price != null ? s.unit_price : (prod ? prod.price : 0);
      const q = s.quantity || 0;
      const sub = s.total != null ? s.total : q * price;

      total += sub;
      units += q;
      if (!s.payment_method || s.payment_method.toUpperCase() === 'EFECTIVO') {
        cash += sub;
      }
    });

    return { total, cash, units };
  }

  // Datos consolidados por trabajador
  const wkData = allWk.map(w => {
    const gInfo = goalForWorker(w.id, activeMonth);
    const metaGeneral = gInfo.amount;
    const metaCash = gInfo.cashAmount;
    const { total: vta, cash: cashVta, units } = workerSalesFiltered(w.id);

    let meta = metaGeneral;
    let cumpl = 0;
    if (selectedProd) {
      meta = goalForProduct(selectedProd.id, w.id);
      cumpl = meta > 0 ? Math.round((units / meta) * 100) : 0;
    } else {
      cumpl = metaGeneral > 0 ? Math.round((vta / metaGeneral) * 100) : 0;
    }

    const falta = Math.max(0, meta - (selectedProd ? units : vta));
    const cashCumpl = metaCash > 0 ? Math.round((cashVta / metaCash) * 100) : null;

    return {
      ...w,
      meta,
      metaGeneral,
      metaCash,
      goalId: gInfo.id,
      isCustom: gInfo.custom,
      vta,
      cashVta,
      units,
      cumpl,
      cashCumpl,
      falta
    };
  });

  // Ordenar según contexto: si hay producto por unidades, sino por cumplimiento general
  if (selectedProd) {
    wkData.sort((a,b) => b.units - a.units || b.vta - a.vta);
  } else {
    wkData.sort((a,b) => b.cumpl - a.cumpl || b.vta - a.vta);
  }

  // Filtros de colaborador y estado
  let filtered = [...wkData];
  if (df.worker !== 'all') filtered = filtered.filter(w => String(w.id) === String(df.worker));
  if (df.status === 'cumplida')  filtered = filtered.filter(w => w.cumpl >= 100);
  else if (df.status === 'camino') filtered = filtered.filter(w => w.cumpl >= 60 && w.cumpl < 100);
  else if (df.status === 'bajo')   filtered = filtered.filter(w => w.cumpl < 60);

  // Totales
  const totalStoreMeta = getStoreTarget(activeMonth);
  const totalWorkerMetas = wkData.reduce((sum, w) => sum + w.metaGeneral, 0);
  const totalVta = wkData.reduce((sum, w) => sum + w.vta, 0);
  const totalCashVta = wkData.reduce((sum, w) => sum + w.cashVta, 0);
  const totalUnits = wkData.reduce((sum, w) => sum + w.units, 0);

  const totalMeta = selectedProd ? wkData.reduce((sum, w) => sum + w.meta, 0) : totalStoreMeta;
  const comp = totalMeta > 0 ? Math.round(((selectedProd ? totalUnits : totalVta) / totalMeta) * 100) : 0;
  const falta = Math.max(0, totalMeta - (selectedProd ? totalUnits : totalVta));

  const topWorker = wkData[0];
  const avgPerWk  = allWk.length > 0 ? Math.round(totalVta / allWk.length) : 0;
  const avgPerDay = S.currentDay > 0 ? Math.round(totalVta / S.currentDay) : 0;
  const wkCumplida = wkData.filter(w => w.cumpl >= 100).length;
  const wkCamino   = wkData.filter(w => w.cumpl >= 60 && w.cumpl < 100).length;
  const wkBajo     = wkData.filter(w => w.cumpl < 60).length;

  const proj      = S.currentDay > 0 ? Math.round((totalVta / S.currentDay) * S.monthDays) : 0;
  const projAbove = proj >= totalMeta;

  // Alertas
  const alerts = [];
  wkData.filter(w => w.cumpl < 60).forEach(w => alerts.push(`<b>${esc(w.name)}</b> está al <b>${w.cumpl}%</b> de su meta asignada (${money(w.meta)}).`));
  if (falta > 0) alerts.push(`Faltan <b>${money(falta)}</b> para alcanzar la meta total.`);
  if (!projAbove) alerts.push(`La proyección de cierre <b>${money(proj)}</b> está por debajo de la meta <b>${money(totalMeta)}</b>.`);

  // Datos para gráfico de evolución (7 días)
  const days = ['Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sa', 'Do'];
  const mockEvo = [0.11, 0.13, 0.12, 0.14, 0.18, 0.17, 0.15];

  function statusBadge(c) {
    if (c >= 100) return '<span class="badge grn">Cumplida</span>';
    if (c >= 60)  return '<span class="badge acc">En camino</span>';
    return '<span class="badge red">Por debajo</span>';
  }
  function barColor(c) {
    if (c >= 100) return '#3F805C';
    if (c >= 60)  return '#2F6B4F';
    return '#B84A4A';
  }

  let html = '';

  // ── FILTER BAR ENRIQUECIDA CON HISTÓRICO Y PRODUCTO ──
  html += `
  <div class="db-filters card card-body" style="margin-bottom:18px">
    <div class="db-filter-grid">
      <div class="db-fg">
        <label class="db-fl">Mes (Histórico)</label>
        <input id="dbf-month" type="month" class="db-fsel" value="${activeMonth}">
      </div>
      <div class="db-fg">
        <label class="db-fl">Filtro por Producto</label>
        <select id="dbf-product" class="db-fsel">
          <option value="all" ${(!df.product || df.product === 'all') ? 'selected' : ''}>Todos los productos (General S/)</option>
          ${prods.map(p => `<option value="${p.id}" ${df.product === String(p.id) ? 'selected' : ''}>${esc(p.name)} (S/ ${p.price.toFixed(2)})</option>`).join('')}
        </select>
      </div>
      <div class="db-fg">
        <label class="db-fl">Periodo</label>
        <select id="dbf-period" class="db-fsel">
          <option value="mes"  ${df.period==='mes'  ?'selected':''}>Mes completo</option>
          <option value="hoy"  ${df.period==='hoy'  ?'selected':''}>Solo hoy</option>
          <option value="custom" ${df.period==='custom'?'selected':''}>Rango de fechas</option>
        </select>
      </div>
      <div class="db-fg">
        <label class="db-fl">Desde</label>
        <input id="dbf-from" type="date" class="db-fsel" value="${df.from || ''}">
      </div>
      <div class="db-fg">
        <label class="db-fl">Hasta</label>
        <input id="dbf-to" type="date" class="db-fsel" value="${df.to || ''}">
      </div>
      <div class="db-fg">
        <label class="db-fl">Mozo</label>
        <select id="dbf-worker" class="db-fsel">
          <option value="all" ${df.worker==='all'?'selected':''}>Todos los colaboradores</option>
          ${allWk.map(w => `<option value="${w.id}" ${df.worker===String(w.id)?'selected':''}>${esc(w.name)}</option>`).join('')}
        </select>
      </div>
      <div class="db-fg">
        <label class="db-fl">Estado de meta</label>
        <select id="dbf-status" class="db-fsel">

function wireDashboard(root) {
  const ap = root.querySelector('#dbf-apply');
  const cl = root.querySelector('#dbf-clear');
  if (ap) ap.addEventListener('click', async () => {
    if (!S.dash) S.dash = {};
    const oldMonth = S.dash.month;
    S.dash.month   = root.querySelector('#dbf-month') ? root.querySelector('#dbf-month').value : localMonthStr();
    S.dash.product = root.querySelector('#dbf-product') ? root.querySelector('#dbf-product').value : 'all';
    S.dash.period  = root.querySelector('#dbf-period') ? root.querySelector('#dbf-period').value : 'mes';
    S.dash.from    = root.querySelector('#dbf-from') ? root.querySelector('#dbf-from').value : '';
    S.dash.to      = root.querySelector('#dbf-to') ? root.querySelector('#dbf-to').value : '';
    S.dash.worker  = root.querySelector('#dbf-worker') ? root.querySelector('#dbf-worker').value : 'all';
    S.dash.status  = root.querySelector('#dbf-status') ? root.querySelector('#dbf-status').value : 'all';

    // Si cambió el mes histórico, recargar datos del mes seleccionado
    if (S.dash.month && S.dash.month !== oldMonth) {
      try {
        const [salesRes, goalsRes, kpiRes] = await Promise.all([
          api.getSales({ month: S.dash.month }),
          api.getGoals({ month: S.dash.month }),
          api.getKpi({ month: S.dash.month })
        ]);
        S.sales = salesRes.sales || [];
        S.goals = {
          storeTargets: (goalsRes && goalsRes.storeTargets) || [],
          productGoals: (goalsRes && goalsRes.productGoals) || [],
          workerTargets: (goalsRes && goalsRes.workerTargets) || []
        };
        S.kpi = kpiRes;
      } catch (err) {
        toast('Aviso: ' + err.message);
      }
    }
    render();
  });

  if (cl) cl.addEventListener('click', () => {
    S.dash = { period: 'mes', month: localMonthStr(), from: '', to: '', worker: 'all', product: 'all', shift: 'all', status: 'all' };
    render();
  });

  const btnAdd = root.querySelector('#btn-add-worker-goal');
  if (btnAdd) btnAdd.addEventListener('click', () => {
    const curMonth = (S.dash && S.dash.month) || localMonthStr();
    openM('edit-worker-goal', { period: curMonth });
  });

  root.querySelectorAll('[data-editworkergoal]').forEach(b => b.addEventListener('click', () => {
    const wid = b.dataset.editworkergoal;
    const meta = parseFloat(b.dataset.meta) || 0;
    const cashMeta = parseFloat(b.dataset.cashmeta) || 0;
    const curMonth = (S.dash && S.dash.month) || localMonthStr();
    openM('edit-worker-goal', { workerId: wid, targetAmount: meta, cashTargetAmount: cashMeta, period: curMonth });
  }));

  root.querySelectorAll('[data-delworkergoal]').forEach(b => b.addEventListener('click', async () => {
    const gid = b.dataset.delworkergoal;
    const wname = b.dataset.workername || 'el colaborador';
    if (!confirm(`¿Eliminar la meta asignada para ${wname}?`)) return;
    b.disabled = true;
    try {
      await api.deleteGoal(gid);
      toast(`Meta eliminada para ${wname}`);
      await syncFromD1();
    } catch (e) {
      toast('Error: ' + e.message);
      b.disabled = false;
    }
  }));
}

    root.innerHTML = vLogin();

    return;

  const isAdmin = S.session.role === 'ADMIN';
  const pi = PAGE_INFO[S.tab] || PAGE_INFO.ventas;
  const ptitle = pi.t(isAdmin);
  const psub   = pi.s(isAdmin);
  const uInit  = (S.session.name || '?').charAt(0).toUpperCase();

  if (S.tab === 'tareas' || S.tab === 'cronos') S.tab = 'ventas';

  let contentHtml = '';
  if      (S.tab === 'ventas')      contentHtml = isAdmin ? vVentasAdmin() : vVentasUser();
  else if (S.tab === 'general')     contentHtml = vGeneral();
  else if (S.tab === 'proyectado')  contentHtml = vProyectado();
  else if (S.tab === 'dashboard')   contentHtml = vDashboard();
  else if (S.tab === 'config')      contentHtml = vConfig();

  let toastHtml = '';
  if (S.toast) {
    const isErr = S.toast.toLowerCase().startsWith('error') || S.toast.toLowerCase().startsWith('aviso');
    toastHtml = `<div class="sazon-toast ${isErr ? 'err' : ''}">${esc(S.toast)}</div>`;
  }
  const modalHtml = renderM();

  const existingShell = root.querySelector('.g-shell');

  if (existingShell) {
    // ── Actualización de contenido dinámico sin desmontar layout (sidebar, header, nav) ──
    const titleEl = existingShell.querySelector('.page-title');
    const subEl   = existingShell.querySelector('.page-sub');
    if (titleEl && titleEl.textContent !== ptitle) titleEl.textContent = ptitle;
    if (subEl && subEl.textContent !== psub) subEl.textContent = psub;

    // Actualizar usuario en top navbar y sidebar si aplica
    existingShell.querySelectorAll('.top-nav-name').forEach(el => {
      if (el.textContent !== S.session.name) el.textContent = S.session.name;
    });
    const sbName = existingShell.querySelector('.sb-user-name');
    if (sbName && sbName.textContent !== S.session.name) sbName.textContent = S.session.name;
    const sbRole = existingShell.querySelector('.sb-user-role');
    if (sbRole && sbRole.textContent !== S.session.role) sbRole.textContent = S.session.role;
    const sbAvatar = existingShell.querySelector('.sb-avatar');
    if (sbAvatar && sbAvatar.textContent !== uInit) sbAvatar.textContent = uInit;

    // Actualizar botones de navegación activos
    existingShell.querySelectorAll('.nb').forEach(b => {
      b.classList.toggle('a', b.dataset.tab === S.tab);
    });

    // Actualizar contenedor de contenido principal
    const contentEl = existingShell.querySelector('.g-content');
    if (contentEl) contentEl.innerHTML = contentHtml;

    // Actualizar contenedores auxiliares (Toast y Modal)
    let toastCont = root.querySelector('#app-toast-container');
    if (!toastCont) {
      toastCont = document.createElement('div');
      toastCont.id = 'app-toast-container';
      toastCont.style.display = 'contents';
      root.appendChild(toastCont);
    }
    toastCont.innerHTML = toastHtml;

    let modalCont = root.querySelector('#app-modal-container');
    if (!modalCont) {
      modalCont = document.createElement('div');
      modalCont.id = 'app-modal-container';
      modalCont.style.display = 'contents';
      root.appendChild(modalCont);
    }
    modalCont.innerHTML = modalHtml;

    wireContent(root);
    return;
  }

  // ── Montaje inicial del layout completo ──
  let html = `<div class="g-shell">`;

  /* ── SIDEBAR ── */
  html += `<aside class="g-sidebar">
    <div class="sb-brand">
      <div class="sb-brand-logo-card">
        <img src="src/images/NAV_LOGO.svg" alt="AdminRest — Sistema de gestión Operativa" class="sb-brand-logo" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 560 150\\'><rect x=\\'16\\' y=\\'78\\' width=\\'18\\' height=\\'40\\' rx=\\'5\\' fill=\\'%23FFFFFF\\'/><rect x=\\'44\\' y=\\'52\\' width=\\'18\\' height=\\'66\\' rx=\\'5\\' fill=\\'%23FFFFFF\\'/><rect x=\\'72\\' y=\\'24\\' width=\\'18\\' height=\\'94\\' rx=\\'5\\' fill=\\'%23D5A678\\'/><text x=\\'110\\' y=\\'94\\' font-family=\\'system-ui, sans-serif\\' font-size=\\'78\\' font-weight=\\'700\\'><tspan fill=\\'%23FFFFFF\\'>Admin</tspan><tspan fill=\\'%23D5A678\\'>Rest</tspan></text><text x=\\'112\\' y=\\'128\\' font-family=\\'system-ui, sans-serif\\' font-size=\\'19\\' fill=\\'rgba(255,255,255,0.72)\\'>Sistema de gestión Operativa</text></svg>';">
      </div>
    </div>
    <nav class="sb-nav">
      <div class="sb-group-label">Operaciones</div>`;

  NAV_ITEMS.forEach(n => {
    if (n.adminOnly && !isAdmin) return;
    html += `<button class="nb ${S.tab === n.id ? 'a' : ''}" data-tab="${n.id}">
      <span class="nb-icon">${n.icon}</span>${n.label}
    </button>`;
  });

  html += `</nav>
    <div class="sb-user">
      <div class="sb-avatar">${uInit}</div>
      <div class="sb-user-info">
        <div class="sb-user-name">${esc(S.session.name)}</div>
        <div class="sb-user-role">${S.session.role}</div>
      </div>
      <button class="logout-btn" id="lo" title="Cerrar sesión">⏻</button>
    </div>
  </aside>`;

  /* ── MOBILE HEADER CON PERFIL LIMPIO Y MINIMALISTA ── */
  html += `<div class="m-header">
    <div class="m-brand">
      <div class="m-brand-logo-card">
        <img src="src/images/NAV_LOGO.svg" alt="AdminRest — Sistema de gestión Operativa" class="m-brand-logo" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 560 150\\'><rect x=\\'16\\' y=\\'78\\' width=\\'18\\' height=\\'40\\' rx=\\'5\\' fill=\\'%23FFFFFF\\'/><rect x=\\'44\\' y=\\'52\\' width=\\'18\\' height=\\'66\\' rx=\\'5\\' fill=\\'%23FFFFFF\\'/><rect x=\\'72\\' y=\\'24\\' width=\\'18\\' height=\\'94\\' rx=\\'5\\' fill=\\'%23D5A678\\'/><text x=\\'110\\' y=\\'94\\' font-family=\\'system-ui, sans-serif\\' font-size=\\'78\\' font-weight=\\'700\\'><tspan fill=\\'%23FFFFFF\\'>Admin</tspan><tspan fill=\\'%23D5A678\\'>Rest</tspan></text><text x=\\'112\\' y=\\'128\\' font-family=\\'system-ui, sans-serif\\' font-size=\\'19\\' fill=\\'rgba(255,255,255,0.72)\\'>Sistema de gestión Operativa</text></svg>';">
      </div>
    </div>
    <div class="m-user-area">
      <div class="top-nav-user" title="Usuario: ${esc(S.session.name)} (${S.session.role})">
        <span class="top-nav-dot"></span>
        <span class="top-nav-name">${esc(S.session.name)}</span>
        <button class="top-nav-logout" id="lo-m" title="Cerrar sesión" aria-label="Cerrar sesión">⏻</button>
      </div>
    </div>
  </div>`;

  /* ── MAIN CON NAVBAR SUPERIOR Y PERFIL A LA DERECHA ── */
  html += `<main class="g-main">
    <div class="g-page-hd">
      <div class="g-page-hd-row">
        <div>
          <div class="page-title">${ptitle}</div>
          <div class="page-sub" style="padding-bottom:0">${psub}</div>
        </div>
        <div class="top-nav-user" title="Usuario: ${esc(S.session.name)} (${S.session.role})">
          <span class="top-nav-dot"></span>
          <span class="top-nav-name">${esc(S.session.name)}</span>
          <button class="top-nav-logout" id="lo-top" title="Cerrar sesión" aria-label="Cerrar sesión">⏻</button>
        </div>
      </div>
    </div>
    <div class="g-content">${contentHtml}</div>
  </main>`;

  /* ── MOBILE NAV ── */
  html += `<nav class="m-nav"><div class="m-nav-row">`;
  NAV_ITEMS.forEach(n => {
    html += `<button class="m-nb nb ${S.tab === n.id ? 'a' : ''}" data-tab="${n.id}">
      <span class="mn-i">${n.icon}</span>
      <span class="mn-t">${n.label}</span>
    </button>`;
  });
  html += `</div></nav>`;

  html += `</div>`; /* g-shell */

  html += `<div id="app-toast-container" style="display:contents">${toastHtml}</div>`;
  html += `<div id="app-modal-container" style="display:contents">${modalHtml}</div>`;

  root.innerHTML = html;
  wireLayout(root);
  wireContent(root);
}

// WIRE — EVENT HANDLERS
// ================================================================
function confirmLogout() {
  let overlay = document.getElementById('logout-confirm-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'logout-confirm-overlay';
    overlay.className = 'confirm-overlay';
    overlay.setAttribute('aria-live', 'polite');
    document.body.appendChild(overlay);
  }

  overlay.innerHTML = `
    <div class="confirm-modal-box" id="logout-confirm-box">
      <div id="logout-confirm-content">
        <div class="confirm-modal-title">¿Estás seguro de cerrar sesión?</div>
        <div class="confirm-modal-sub">Tendrás que volver a ingresar tu código para acceder.</div>
        <div class="confirm-modal-actions">
          <button class="confirm-btn-cancel" id="btn-cancel-logout">Cancelar</button>
          <button class="confirm-btn-danger" id="btn-confirm-logout">Cerrar sesión</button>
        </div>
      </div>
    </div>
  `;

  requestAnimationFrame(() => {
    overlay.classList.add('active');
  });

  const cancelBtn  = overlay.querySelector('#btn-cancel-logout');
  const confirmBtn = overlay.querySelector('#btn-confirm-logout');
  const content    = overlay.querySelector('#logout-confirm-content');

  let inAction = false;

  function closeModal() {
    if (inAction) return;
    inAction = true;
    overlay.classList.remove('active');
    setTimeout(() => {
      overlay.remove();
    }, 260);
  }

  cancelBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });

  const onKey = (e) => {
    if (e.key === 'Escape') {
      document.removeEventListener('keydown', onKey);
      closeModal();
    }
  };
  document.addEventListener('keydown', onKey);

  confirmBtn.addEventListener('click', async () => {
    if (inAction) return;
    inAction = true;
    document.removeEventListener('keydown', onKey);

    confirmBtn.disabled = true;
    cancelBtn.disabled = true;

    // Cambiar al spinner con "Cerrando sesión..."
    content.innerHTML = `
      <div class="confirm-modal-loading">
        <span class="modal-spinner"></span>
        <span class="login-modal-text">Cerrando sesión...</span>
      </div>
    `;

    // Mantener durante ~700 ms
    await new Promise(res => setTimeout(res, 700));

    // Transición suave de salida hacia el login
    const shell = document.querySelector('.g-shell');
    if (shell) {
      shell.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
      shell.style.opacity = '0';
      shell.style.transform = 'scale(0.99)';
    }
    overlay.style.transition = 'opacity 0.35s ease';
    overlay.style.opacity = '0';

    await new Promise(res => setTimeout(res, 350));

    overlay.remove();
    api.setToken(null);
    saveSession(null);
    render();
  });
}

function wireLayout(root) {
  /* Logout (Sidebar, Mobile Header y Top Navbar) */
  const lo    = root.querySelector('#lo');
  const loM   = root.querySelector('#lo-m');
  const loTop = root.querySelector('#lo-top');
  if (lo)    lo.addEventListener('click', confirmLogout);
  if (loM)   loM.addEventListener('click', confirmLogout);
  if (loTop) loTop.addEventListener('click', confirmLogout);

  /* Navigation (sidebar + mobile) */
  root.querySelectorAll('.nb').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.tab) { S.tab = b.dataset.tab; render(); }
  }));
}

function wireContent(root) {
  /* Dashboard filters */
  if (S.tab === 'dashboard') wireDashboard(root);

  /* Subtabs (Mozos / Anfitrionas) */
  root.querySelectorAll('.st').forEach(b => b.addEventListener('click', () => { S.sub = b.dataset.sub; render(); }));

  /* ── MANEJADOR DE INGRESO RÁPIDO POR CUADRO DE TEXTO (BULK) ── */
  root.querySelectorAll('[id^="bulk-btn-preview-"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const wid = btn.dataset.wid;
      const ta = root.querySelector(`#bulk-text-${wid}`);
      const prevBox = root.querySelector(`#bulk-preview-${wid}`);
      const saveBtn = root.querySelector(`#bulk-btn-save-${wid}`);
      if (!ta || !prevBox) return;

      const raw = ta.value;
      const { items, errors, totalAmount, totalUnits } = parseBulkSalesText(raw);

      if (items.length === 0 && errors.length === 0) {
        prevBox.style.display = 'block';
        prevBox.innerHTML = '<span style="color:var(--text-3);font-size:12px">Escribe algún producto y cantidad para ver la previsualización.</span>';
        if (saveBtn) { saveBtn.disabled = true; saveBtn.style.opacity = '0.6'; }
        return;
      }

      let h = '';
      if (items.length > 0) {
        h += `<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:var(--green)">✓ ${items.length} producto(s) detectado(s) (${totalUnits} unidades — ${money(totalAmount)}):</div>`;
        h += `<table class="dt" style="font-size:12px;margin-bottom:8px"><thead><tr>
          <th>Producto</th><th class="r">Cant.</th><th class="r">P. Unit</th><th class="r">Total</th>
        </tr></thead><tbody>`;
        items.forEach(it => {
          h += `<tr>
            <td class="fw600">${esc(it.product.name)}</td>
            <td class="r dt-num">${it.quantity}</td>
            <td class="r">S/ ${it.unitPrice.toFixed(2)}</td>
            <td class="r dt-num" style="color:var(--accent);font-weight:600">${money(it.subtotal)}</td>
          </tr>`;
        });
        h += `</tbody></table>`;
        if (saveBtn) { saveBtn.disabled = false; saveBtn.style.opacity = '1'; }
      } else {
        if (saveBtn) { saveBtn.disabled = true; saveBtn.style.opacity = '0.6'; }
      }

      if (errors.length > 0) {
        h += `<div style="color:var(--red);font-size:11.5px;margin-top:6px">⚠️ Advertencias:</div><ul style="margin:4px 0 0 16px;padding:0;font-size:11px;color:var(--red)">`;
        errors.forEach(err => { h += `<li>${esc(err)}</li>`; });
        h += `</ul>`;
      }

      prevBox.style.display = 'block';
      prevBox.innerHTML = h;
    });
  });

  root.querySelectorAll('[id^="bulk-btn-save-"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const wid = btn.dataset.wid;
      const ta = root.querySelector(`#bulk-text-${wid}`);
      const dateIn = root.querySelector(`#bulk-date-${wid}`);
      const payIn = root.querySelector(`#bulk-pay-${wid}`);
      if (!ta) return;

      const { items } = parseBulkSalesText(ta.value);
      if (items.length === 0) {
        toast('No hay productos válidos para guardar.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando...';

      const saleDate = dateIn ? dateIn.value : localDateStr();
      const paymentMethod = payIn ? payIn.value : 'EFECTIVO';

      const payload = {
        worker_id: wid,
        sale_date: saleDate,
        payment_method: paymentMethod,
        sales: items.map(it => ({
          product_id: it.product.id,
          worker_id: wid,
          quantity: it.quantity,
          unit_price: it.unitPrice,
          sale_date: saleDate,
          payment_method: paymentMethod
        }))
      };

      try {
        await api.recordSalesBulk(payload);
        toast(`✓ ${items.length} productos registrados exitosamente (${money(items.reduce((a,c)=>a+c.subtotal,0))})`);
        ta.value = '';
        const prevBox = root.querySelector(`#bulk-preview-${wid}`);
        if (prevBox) prevBox.style.display = 'none';
        await syncFromD1();
      } catch (err) {
        toast('Error guardando ventas: ' + err.message);
        btn.disabled = false;
        btn.textContent = '⚡ Confirmar y Guardar';
      }
    });
  });

  const isAdmin = S.session && S.session.role === 'ADMIN';

  /* ── FECHA Y MÉTODO DE PAGO EN CABECERA DE VENTAS ── */
  const sDateInp = root.querySelector('#sales-date');
  if (sDateInp) {
    sDateInp.addEventListener('change', () => {
      S.selectedSaleDate = sDateInp.value;
    });
  }
  const sPaySelect = root.querySelector('#sales-paymethod');
  if (sPaySelect) {
    sPaySelect.addEventListener('change', () => {
      S.selectedPaymentMethod = sPaySelect.value;
    });
  }

  /* ── BOTÓN AJUSTAR / DESCONTAR ── */
  root.querySelectorAll('[data-adjust-btn]').forEach(btn => {
    btn.addEventListener('click', () => {
      const pid = btn.dataset.adjustBtn;
      const wid = btn.dataset.wid || (S.session ? S.session.id : '');
      openM('adjust-sale', { productId: pid, workerId: wid });
    });
  });

  /* ── REGISTRO DE VENTAS (USUARIO) ── */
  if (!isAdmin && S.tab === 'ventas') {
    const wid = S.session ? S.session.id : null;
    const btnSaveAll = root.querySelector('#btn-save-all-sales');
    const rowInputs = Array.from(root.querySelectorAll('.sale-qty-input:not(.admin-sale-input)'));

    function updateSaveAllState() {
      if (!btnSaveAll) return;
      const valid = rowInputs.filter(inp => (parseInt(inp.value, 10) || 0) > 0);
      if (valid.length >= 2) {
        btnSaveAll.disabled = false;
        btnSaveAll.style.opacity = '1';
        btnSaveAll.style.cursor = 'pointer';
        btnSaveAll.innerHTML = `⚡ Guardar todos (${valid.length} productos)`;
      } else {
        btnSaveAll.disabled = true;
        btnSaveAll.style.opacity = '0.4';
        btnSaveAll.style.cursor = 'not-allowed';
        btnSaveAll.innerHTML = '⚡ Guardar todos';
      }
    }

    async function submitSingleRow(pid, input, btnSend) {
      const qty = parseInt(input.value, 10);
      if (isNaN(qty) || qty <= 0) return;

      const sDate = S.selectedSaleDate || (root.querySelector('#sales-date') ? root.querySelector('#sales-date').value : localDateStr());
      const pMethod = S.selectedPaymentMethod || (root.querySelector('#sales-paymethod') ? root.querySelector('#sales-paymethod').value : 'EFECTIVO');

      btnSend.disabled = true;
      btnSend.style.opacity = '0.6';
      btnSend.innerHTML = '<span class="modal-spinner" style="width:12px;height:12px;border-width:2px;display:inline-block"></span>';
      input.disabled = true;

      const tempId = 'temp_' + Date.now();
      S.sales.push({
        id: tempId,
        worker_id: wid,
        product_id: pid,
        quantity: qty,
        sale_date: sDate,
        payment_method: pMethod
      });

      try {
        await api.recordSale({
          worker_id: wid,
          product_id: pid,
          quantity: qty,
          sale_date: sDate,
          payment_method: pMethod
        });
        const prod = S.products.find(p => p.id === pid);
        toast(`✓ +${qty} ${prod ? prod.name : 'unidades'} registrado (${pMethod})`);
        input.value = '';
        input.disabled = false;
        await syncFromD1();
      } catch (e) {
        S.sales = S.sales.filter(s => s.id !== tempId);
        input.disabled = false;
        btnSend.disabled = false;
        btnSend.style.opacity = '1';
        btnSend.textContent = 'Enviar';
        render();
        toast('Error: ' + e.message);
      }
    }

    rowInputs.forEach(input => {
      const pid = input.dataset.pid;
      const btnSend = root.querySelector(`.btn-send-sale[data-send-pid="${pid}"]`);

      input.addEventListener('keydown', e => {
        if (['e', 'E', '+', '-', '.', ','].includes(e.key)) {
          e.preventDefault();
          return;
        }
        if (e.key === 'ArrowDown' && (parseInt(input.value, 10) || 0) <= 0) {
          e.preventDefault();
          input.value = '';
          if (btnSend) { btnSend.disabled = true; btnSend.style.opacity = '0.4'; btnSend.style.cursor = 'not-allowed'; }
          updateSaveAllState();
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          if (btnSend && !btnSend.disabled) {
            submitSingleRow(pid, input, btnSend);
          }
        }
      });

      input.addEventListener('input', () => {
        let clean = input.value.replace(/[^0-9]/g, '');
        if (clean.length > 1 && clean.startsWith('0')) {
          clean = clean.replace(/^0+/, '');
        }
        if (input.value !== clean) input.value = clean;

        const val = parseInt(input.value, 10) || 0;
        if (btnSend) {
          if (val > 0) {
            btnSend.disabled = false;
            btnSend.style.opacity = '1';
            btnSend.style.cursor = 'pointer';
          } else {
            btnSend.disabled = true;
            btnSend.style.opacity = '0.4';
            btnSend.style.cursor = 'not-allowed';
          }
        }
        updateSaveAllState();
      });

      if (btnSend) {
        btnSend.addEventListener('click', () => {
          submitSingleRow(pid, input, btnSend);
        });
      }
    });

    if (btnSaveAll) {
      btnSaveAll.addEventListener('click', async () => {
        const validInputs = rowInputs.filter(inp => (parseInt(inp.value, 10) || 0) > 0);
        if (validInputs.length === 0) return;

        const sDate = S.selectedSaleDate || (root.querySelector('#sales-date') ? root.querySelector('#sales-date').value : localDateStr());
        const pMethod = S.selectedPaymentMethod || (root.querySelector('#sales-paymethod') ? root.querySelector('#sales-paymethod').value : 'EFECTIVO');

        btnSaveAll.disabled = true;
        btnSaveAll.style.opacity = '0.7';
        btnSaveAll.innerHTML = '<span class="modal-spinner" style="width:13px;height:13px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px"></span> Guardando...';

        const salesItems = [];
        const tempIds = [];
        const now = Date.now();

        validInputs.forEach((inp, idx) => {
          const pid = inp.dataset.pid;
          const qty = parseInt(inp.value, 10);
          const prod = S.products.find(p => p.id === pid);
          if (prod && qty > 0) {
            const tId = `temp_bulk_${now}_${idx}`;
            tempIds.push(tId);
            S.sales.push({
              id: tId,
              worker_id: wid,
              product_id: pid,
              quantity: qty,
              sale_date: sDate,
              payment_method: pMethod
            });
            salesItems.push({
              product_id: pid,
              worker_id: wid,
              quantity: qty,
              unit_price: prod.price,
              sale_date: sDate,
              payment_method: pMethod
            });
          }
        });

        try {
          await api.recordSalesBulk({
            worker_id: wid,
            sale_date: sDate,
            payment_method: pMethod,
            sales: salesItems
          });
          const totalUnits = salesItems.reduce((acc, c) => acc + c.quantity, 0);
          toast(`✓ ${salesItems.length} productos registrados exitosamente (${totalUnits} u.)`);
          validInputs.forEach(inp => { inp.value = ''; });
          await syncFromD1();
        } catch (err) {
          S.sales = S.sales.filter(s => !tempIds.includes(s.id));
          render();
          toast('Error guardando ventas: ' + err.message);
        }
      });
    }
  }

  /* ── VENTAS ADMIN ── */
  if (isAdmin && S.tab === 'ventas') {
    root.querySelectorAll('[data-toggleuser]').forEach(b => b.addEventListener('click', () => {
      S.expandedWaiter = S.expandedWaiter === b.dataset.toggleuser ? null : b.dataset.toggleuser;
      render();
    }));

    if (S.expandedWaiter) {
      const wid = S.expandedWaiter;
      const workerInputs = Array.from(root.querySelectorAll(`.admin-sale-input[data-wid="${wid}"]`));
      const btnAdminSaveAll = root.querySelector(`.btn-admin-save-all[data-wid="${wid}"]`);

      function updateAdminSaveAll() {
        if (!btnAdminSaveAll) return;
        const valid = workerInputs.filter(inp => (parseInt(inp.value, 10) || 0) > 0);
        if (valid.length >= 2) {
          btnAdminSaveAll.disabled = false;
          btnAdminSaveAll.style.opacity = '1';
          btnAdminSaveAll.style.cursor = 'pointer';
        } else {
          btnAdminSaveAll.disabled = true;
          btnAdminSaveAll.style.opacity = '0.4';
          btnAdminSaveAll.style.cursor = 'not-allowed';
        }
      }

      async function submitAdminRow(pid, input, btnSend) {
        const qty = parseInt(input.value, 10);
        if (isNaN(qty) || qty <= 0) return;

        const sDate = S.selectedSaleDate || (root.querySelector('#sales-date') ? root.querySelector('#sales-date').value : localDateStr());
        const pMethod = S.selectedPaymentMethod || (root.querySelector('#sales-paymethod') ? root.querySelector('#sales-paymethod').value : 'EFECTIVO');

        btnSend.disabled = true;
        btnSend.style.opacity = '0.6';
        btnSend.innerHTML = '<span class="modal-spinner" style="width:12px;height:12px;border-width:2px;display:inline-block"></span>';
        input.disabled = true;

        const tempId = 'temp_' + Date.now();
        S.sales.push({
          id: tempId,
          worker_id: wid,
          product_id: pid,
          quantity: qty,
          sale_date: sDate,
          payment_method: pMethod
        });

        try {
          await api.recordSale({
            worker_id: wid,
            product_id: pid,
            quantity: qty,
            sale_date: sDate,
            payment_method: pMethod
          });
          const prod = S.products.find(p => p.id === pid);
          toast(`✓ Venta registrada: +${qty} ${prod ? prod.name : 'u.'}`);
          input.value = '';
          input.disabled = false;
          await syncFromD1();
        } catch (e) {
          S.sales = S.sales.filter(s => s.id !== tempId);
          input.disabled = false;
          btnSend.disabled = false;
          btnSend.style.opacity = '1';
          btnSend.textContent = 'Enviar';
          render();
          toast('Error: ' + e.message);
        }
      }

      workerInputs.forEach(input => {
        const pid = input.dataset.pid;
        const btnSend = root.querySelector(`.btn-admin-send[data-wid="${wid}"][data-pid="${pid}"]`);

        input.addEventListener('keydown', e => {
          if (['e', 'E', '+', '-', '.', ','].includes(e.key)) {
            e.preventDefault();
            return;
          }
          if (e.key === 'ArrowDown' && (parseInt(input.value, 10) || 0) <= 0) {
            e.preventDefault();
            input.value = '';
            if (btnSend) { btnSend.disabled = true; btnSend.style.opacity = '0.4'; btnSend.style.cursor = 'not-allowed'; }
            updateAdminSaveAll();
            return;
          }
          if (e.key === 'Enter') {
            e.preventDefault();
            if (btnSend && !btnSend.disabled) {
              submitAdminRow(pid, input, btnSend);
            }
          }
        });

        input.addEventListener('input', () => {
          let clean = input.value.replace(/[^0-9]/g, '');
          if (clean.length > 1 && clean.startsWith('0')) {
            clean = clean.replace(/^0+/, '');
          }
          if (input.value !== clean) input.value = clean;

          const val = parseInt(input.value, 10) || 0;
          if (btnSend) {
            if (val > 0) {
              btnSend.disabled = false;
              btnSend.style.opacity = '1';
              btnSend.style.cursor = 'pointer';
            } else {
              btnSend.disabled = true;
              btnSend.style.opacity = '0.4';
              btnSend.style.cursor = 'not-allowed';
            }
          }
          updateAdminSaveAll();
        });

        if (btnSend) {
          btnSend.addEventListener('click', () => {
            submitAdminRow(pid, input, btnSend);
          });
        }
      });

      if (btnAdminSaveAll) {
        btnAdminSaveAll.addEventListener('click', async () => {
          const validInputs = workerInputs.filter(inp => (parseInt(inp.value, 10) || 0) > 0);
          if (validInputs.length === 0) return;

          const sDate = S.selectedSaleDate || (root.querySelector('#sales-date') ? root.querySelector('#sales-date').value : localDateStr());
          const pMethod = S.selectedPaymentMethod || (root.querySelector('#sales-paymethod') ? root.querySelector('#sales-paymethod').value : 'EFECTIVO');

          btnAdminSaveAll.disabled = true;
          btnAdminSaveAll.style.opacity = '0.7';
          btnAdminSaveAll.innerHTML = '<span class="modal-spinner" style="width:13px;height:13px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px"></span> Guardando...';

          const salesItems = [];
          const tempIds = [];
          const now = Date.now();

          validInputs.forEach((inp, idx) => {
            const pid = inp.dataset.pid;
            const qty = parseInt(inp.value, 10);
            const prod = S.products.find(p => p.id === pid);
            if (prod && qty > 0) {
              const tId = `temp_adminbulk_${now}_${idx}`;
              tempIds.push(tId);
              S.sales.push({
                id: tId,
                worker_id: wid,
                product_id: pid,
                quantity: qty,
                sale_date: sDate,
                payment_method: pMethod
              });
              salesItems.push({
                product_id: pid,
                worker_id: wid,
                quantity: qty,
                unit_price: prod.price,
                sale_date: sDate,
                payment_method: pMethod
              });
            }
          });

          try {
            await api.recordSalesBulk({
              worker_id: wid,
              sale_date: sDate,
              payment_method: pMethod,
              sales: salesItems
            });
            const totalUnits = salesItems.reduce((acc, c) => acc + c.quantity, 0);
            toast(`✓ ${salesItems.length} ventas guardadas en lote (${totalUnits} u.)`);
            validInputs.forEach(inp => { inp.value = ''; });
            await syncFromD1();
          } catch (err) {
            S.sales = S.sales.filter(s => !tempIds.includes(s.id));
            render();
            toast('Error guardando ventas: ' + err.message);
          }
        });
      }
    }

    const apb = root.querySelector('#add-prod-btn');
    if (apb) apb.addEventListener('click', () => openM('add-prod', { role: apb.dataset.role }));
  }

  /* ── ACCIONES GENERALES ── */
  root.querySelectorAll('[data-editgoal]').forEach(b => b.addEventListener('click', () => openM('edit-goal', { id: b.dataset.editgoal, role: b.dataset.role || 'GENERAL' })));
  root.querySelectorAll('[data-editprofile]').forEach(b => b.addEventListener('click', () => openM('edit-profile', { id: b.dataset.editprofile })));
  root.querySelectorAll('[data-editadmin]').forEach(b => b.addEventListener('click', () => openM('edit-profile', { id: b.dataset.editadmin })));

  const emp = root.querySelector('#edit-my-profile');
  if (emp) emp.addEventListener('click', () => openM('edit-profile', { id: S.session.id }));

  const au  = root.querySelector('#add-user');
  if (au) au.addEventListener('click', () => openM('add-user'));

  const aab = root.querySelector('#add-admin-btn');
  if (aab) aab.addEventListener('click', () => openM('add-admin'));

  const at = root.querySelector('#add-task');
  if (at) at.addEventListener('click', () => openM('add-task'));

  const ae = root.querySelector('#add-event');
  if (ae) ae.addEventListener('click', () => openM('add-event'));

  const est = root.querySelector('#edit-store-target');
  if (est) est.addEventListener('click', () => openM('edit-store-target'));

  /* Editar meta diaria */
  root.querySelectorAll('[data-editdaytarget]').forEach(b => b.addEventListener('click', () => {
    const day = parseInt(b.dataset.editdaytarget);
    const target = parseFloat(b.dataset.target) || 0;
    openM('edit-day-target', { day, target });
  }));

  const ce = root.querySelector('#cfg-endpoint');
  if (ce) ce.addEventListener('click', () => openM('config-api'));

  /* ── PRODUCTOS: DESACTIVAR ── */
  root.querySelectorAll('[data-delprod]').forEach(b => b.addEventListener('click', async () => {
    const prodId = b.dataset.delprod;
    const prod   = S.products.find(p => p.id === prodId);
    if (!prod) return;
    if (!confirm(`¿Desactivar el producto "${prod.name}"? Quedará oculto del catálogo.`)) return;
    b.disabled = true;
    try {
      await api.deleteProduct(prodId);
      toast('Producto desactivado');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); b.disabled = false; }
  }));

  /* ── TAREAS: ELIMINAR (admin) ── */
  root.querySelectorAll('[data-deltask]').forEach(b => b.addEventListener('click', async () => {
    const taskId = b.dataset.deltask;
    const task   = S.tasks.find(t => t.id === taskId);
    if (!task) return;
    if (!confirm(`¿Eliminar la tarea "${task.name}"?`)) return;
    b.disabled = true;
    try {
      await api.deleteTask(taskId);
      toast('Tarea eliminada');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); b.disabled = false; }
  }));

  /* ── TAREAS: MARCAR / DESMARCAR ── */
  root.querySelectorAll('[data-donetask]').forEach(b => b.addEventListener('click', () => {
    const tid    = b.dataset.donetask;
    const task   = S.tasks.find(t => t.id === tid);
    const assign = (task.assignees || []).find(a => a.user_id === S.session.id);
    if (assign && assign.completed) {
      api.toggleTask(tid, 0, '').then(() => { toast('Tarea desmarcada'); syncFromD1(); });
    } else {
      openM('task-note', { taskId: tid });
    }
  }));

  /* ── EVENTOS: ELIMINAR ── */
  root.querySelectorAll('[data-delevent]').forEach(b => b.addEventListener('click', async () => {
    try {
      await api.deleteEvent(b.dataset.delevent);
      toast('Evento eliminado');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); }
  }));

  /* ── MODAL: GUARDAR / CANCELAR ── */
  const mc  = root.querySelector('#m-cancel');
  if (mc) mc.addEventListener('click', closeM);

  const mbd = root.querySelector('#mbd');
  if (mbd) mbd.addEventListener('click', e => { if (e.target === mbd) closeM(); });

  const ms = root.querySelector('#m-save');
  if (ms) ms.addEventListener('click', async () => {
    const m = S.modal;
    if (!m) return;
    const v = id => { const el = root.querySelector('#' + id); return el ? el.value.trim() : ''; };
    ms.disabled = true;
    try {
      if (m.type === 'config-api') {
        const url = v('mf-api');
        if (url) { localStorage.setItem(CONFIG_KEY, url); location.reload(); }

      } else if (m.type === 'add-prod') {
        const name     = v('mf-name');
        const category = v('mf-cat') || 'GENERAL';
        const price    = parseFloat(v('mf-price')) || 0;
        await api.createProduct({ name, category, price, target_role: m.data.role });
        toast('Producto agregado'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-goal') {
        const g = parseFloat(v('mf-goal')) || 0;
        await api.saveGoal({ type: 'PRODUCT_GOAL', product_id: m.data.id, target_quantity: g });
        toast('Meta actualizada'); closeM(); await syncFromD1();

      } else if (m.type === 'add-user') {
        const name = v('mf-name'), code = v('mf-code'), role = v('mf-role');
        await api.createUser({ name, code, role });
        toast('Colaborador creado'); closeM(); await syncFromD1();

      } else if (m.type === 'add-admin') {
        const name = v('mf-name'), code = v('mf-code');
        await api.createUser({ name, code, role: 'ADMIN' });
        toast('Administrador creado'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-profile') {
        const name = v('mf-name'), code = v('mf-code');
        await api.updateUser(m.data.id, { name, code });
        toast('Perfil actualizado'); closeM(); await syncFromD1();

      } else if (m.type === 'add-task') {
        const name = v('mf-name'), deadline = v('mf-date');
        await api.createTask({ name, deadline });
        toast('Tarea creada'); closeM(); await syncFromD1();

      } else if (m.type === 'add-event') {
        const title       = v('mf-name');
        const event_date  = v('mf-date');
        const event_time  = v('mf-time');
        const description = v('mf-desc');
        await api.createEvent({ title, event_date, event_time, description });
        toast('Evento programado'); closeM(); await syncFromD1();

      } else if (m.type === 'task-note') {
        const note = v('mf-note');
        await api.toggleTask(m.data.taskId, 1, note);
        toast('Tarea completada'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-store-target') {
        const target = parseFloat(v('mf-target')) || 350000;
        await api.saveGoal({ type: 'STORE_TARGET', target_amount: target });
        toast('Meta de tienda actualizada'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-day-target') {
        const target = parseFloat(v('mf-day-target')) || 0;
        const periodMonth = (S.kpi && S.kpi.month) || localMonthStr();
        await api.saveGoal({ type: 'STORE_TARGET', period_month: periodMonth, day: m.data.day, target_amount: target });
        toast(`Meta del día ${m.data.day} actualizada a ${money(target)}`); closeM(); await syncFromD1();

      } else if (m.type === 'edit-worker-goal') {
        const workerId = v('mf-worker');
        const periodMonth = v('mf-period') || localMonthStr();
        const targetAmount = parseFloat(v('mf-target')) || 0;
        const cashTargetAmount = parseFloat(v('mf-cash-target')) || 0;
        if (!workerId) throw new Error('Selecciona un colaborador.');
        if (targetAmount <= 0) throw new Error('Ingresa un monto objetivo mayor a 0.');

        await api.saveGoal({
          type: 'WORKER_TARGET',
          worker_id: workerId,
          period_month: periodMonth,
          target_amount: targetAmount,
          cash_target_amount: cashTargetAmount
        });

        const targetUser = S.users.find(u => String(u.id) === String(workerId));
        toast(`Meta de ${money(targetAmount)} (Efectivo: ${money(cashTargetAmount)}) guardada para ${targetUser ? targetUser.name : 'el colaborador'}`);
        closeM();
        await syncFromD1();

      } else if (m.type === 'adjust-sale') {
        const pid = v('mf-adjust-pid');
        const wid = v('mf-adjust-wid');
        const qtyToDeduct = parseInt(v('mf-adjust-qty'), 10) || 0;
        const sDate = v('mf-adjust-date') || localDateStr();
        const notes = v('mf-adjust-notes') || 'Ajuste de venta';

        if (qtyToDeduct <= 0) throw new Error('Ingresa una cantidad mayor a 0 para descontar.');

        await api.recordSale({
          worker_id: wid,
          product_id: pid,
          quantity: -qtyToDeduct,
          sale_date: sDate,
          notes: notes,
          payment_method: S.selectedPaymentMethod || 'EFECTIVO'
        });

        const prod = S.products.find(p => p.id === pid);
        toast(`✓ Descuento de −${qtyToDeduct} ${prod ? prod.name : 'unidades'} registrado.`);
        closeM();
        await syncFromD1();
      }
    } catch (err) {
      toast('Error: ' + err.message);
    } finally {
      ms.disabled = false;
    }
  });
}

function wire(root) {
  wireLayout(root);
  wireContent(root);
}

// ================================================================
// INIT
// ================================================================
render();
if (S.session) syncFromD1();

})();
</script>
</body>
</html>
