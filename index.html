function vTareas() {
  const isAdmin = S.session.role === 'ADMIN';
  let html = '';

  if (isAdmin) {
    html += `<div class="flex-end" style="margin-bottom:16px;justify-content:flex-start">
      <button class="btn pri" id="add-task">+ Nueva tarea</button>
    </div>`;
  }

  html += `<div class="card" style="padding:0">`;

  if (S.tasks.length === 0) {
    html += `<div class="empty-box">
      <div class="empty-icon">✅</div>
      <div class="empty-title">Sin tareas pendientes</div>
      <div class="empty-hint">${isAdmin ? 'Crea una tarea para asignarla al equipo.' : 'No tienes tareas asignadas en este momento.'}</div>
    </div>`;
  } else {
    const now = today();
    S.tasks.forEach(t => {
      const dl       = new Date(t.deadline + 'T23:59:59');
      const diffD    = Math.ceil((dl - now) / 86400000);
      const late     = diffD < 0;
      const myAssign = (t.assignees || []).find(a => a.user_id === S.session.id);
      const done     = myAssign && myAssign.completed;

      html += `<div class="task-item">`;

      if (!isAdmin) {
        html += `<div class="task-chk ${done ? 'done' : ''}" data-donetask="${t.id}" title="Marcar tarea">${done ? '✓' : ''}</div>`;
      }

      html += `<div class="task-body">
        <div class="task-name${done ? ' done-text' : ''}">${esc(t.name)}</div>
        <div class="task-foot">
          <span class="badge ${late ? 'red' : 'def'}">${late ? 'Vencida hace ' + Math.abs(diffD) + ' d' : 'Plazo: ' + diffD + ' d'}</span>
          <span class="text-muted">${t.deadline}</span>
        </div>`;

      if (myAssign && myAssign.observations) {
        html += `<div style="margin-top:6px;font-size:12px;color:var(--text-3);font-style:italic">"${esc(myAssign.observations)}"</div>`;
      }

      if (isAdmin) {
        const completedList = (t.assignees || []).filter(a => a.completed);
        if (completedList.length === 0) {
          html += `<div style="margin-top:6px;font-size:12px;color:var(--text-3)">Pendiente — ningún colaborador la ha completado aún.</div>`;
        } else {
          completedList.forEach(c => {
            html += `<div style="margin-top:4px;font-size:12px;color:var(--green)">✓ ${esc(c.worker_name || '')}${c.observations ? ' — "' + esc(c.observations) + '"' : ''}</div>`;
          });
        }
      }

      html += `</div>`;

      if (isAdmin) {
        html += `<div class="task-actions">
          <button class="btn dan sm" data-deltask="${t.id}" title="Eliminar tarea">✕</button>
        </div>`;
      }

      html += `</div>`;
    });
  }

  html += `</div>`;
  return html;
}

// ================================================================
// VIEW: DASHBOARD DE METAS (ADMIN Y PERSONAL)
// ================================================================
function vDashboard() {
  const isAdmin = S.session && S.session.role === 'ADMIN';
  if (!S.dash) S.dash = { period: 'mes', month: S.selectedMonth || localMonthStr(), from: '', to: '', worker: 'all', product: 'all', status: 'all', rankType: 'cumplimiento' };
  const df = S.dash;
  const activeMonth = df.month || S.selectedMonth || localMonthStr();
  const prevMonth = shiftMonth(activeMonth, -1);

  // Workers
  const mozos = S.users.filter(u => u.role === 'MOZO' && u.active);
  const anfs  = S.users.filter(u => u.role === 'ANFITRIONA' && u.active);
  const allWk = [...mozos, ...anfs];
  const prods = (S.products || []).filter(p => p.active);
  const selectedProd = df.product && df.product !== 'all' ? prods.find(p => String(p.id) === String(df.product)) : null;

  // Helper para computar unidades y efectivo respetando filtros (sin medios de pago)
  function workerSalesFiltered(wId, targetMonth) {
    const widStr = String(wId);
    let units = 0;

    S.sales.forEach(s => {
      if (String(s.worker_id) !== widStr) return;
      if (targetMonth && !s.sale_date.startsWith(targetMonth)) return;
      if (df.from && s.sale_date < df.from) return;
      if (df.to && s.sale_date > df.to) return;
      if (df.period === 'hoy' && s.sale_date !== localDateStr()) return;

      if (selectedProd && String(s.product_id) !== String(selectedProd.id)) return;
      units += (s.quantity || 0);
    });

    // Efectivo registrado en worker_monthly_records
    const rec = getWorkerRecord(wId, targetMonth);
    const cashAchieved = rec.cash_achieved || 0;
    const supportPollos = rec.support_pollos || 0;

    return { units, cashAchieved, supportPollos };
  }

  // Datos consolidados por trabajador para mes activo y mes anterior
  const wkData = allWk.map(w => {
    const gInfo = goalForWorker(w.id, activeMonth);
    const metaCash = gInfo.cashAmount || 0;
    const { units, cashAchieved, supportPollos } = workerSalesFiltered(w.id, activeMonth);
    const prevData = workerSalesFiltered(w.id, prevMonth);
    const prevGInfo = goalForWorker(w.id, prevMonth);

    // Cumplimiento general de catálogo
    const metrics = getWorkerMonthMetrics(w.id, w.role, activeMonth);
    const cumplPromedio = metrics.generalPct;

    // Cumplimiento en efectivo
    const cashCumpl = metaCash > 0 ? Math.round((cashAchieved / metaCash) * 100) : 0;

    // Cumplimiento producto específico
    let prodMeta = 0;
    let prodCumpl = 0;
    if (selectedProd) {
      prodMeta = goalForProduct(selectedProd.id, w.id);
      prodCumpl = prodMeta > 0 ? Math.round((units / prodMeta) * 100) : 0;
    }

    // Variación vs mes anterior
    let variation = 0;
    if (df.rankType === 'efectivo') {
      const prevCashCumpl = (prevGInfo.cashAmount || 0) > 0 ? Math.round((prevData.cashAchieved / prevGInfo.cashAmount) * 100) : 0;
      variation = cashCumpl - prevCashCumpl;
    } else if (df.rankType === 'producto' && selectedProd) {
      const prevProdMeta = goalForProduct(selectedProd.id, w.id);
      const prevProdCumpl = prevProdMeta > 0 ? Math.round((prevData.units / prevProdMeta) * 100) : 0;
      variation = prodCumpl - prevProdCumpl;
    } else {
      const prevMetrics = getWorkerMonthMetrics(w.id, w.role, prevMonth);
      variation = cumplPromedio - prevMetrics.generalPct;
    }

    return {
      ...w,
      metaCash,
      cashAchieved,
      supportPollos,
      units,
      cumplPromedio,
      cashCumpl,
      prodMeta,
      prodCumpl,
      variation,
      metrics
    };
  });

  // Ordenamiento según criterio de ranking
  if (df.rankType === 'efectivo') {
    wkData.sort((a,b) => b.cashCumpl - a.cashCumpl || b.cashAchieved - a.cashAchieved);
  } else if (df.rankType === 'producto' && selectedProd) {
    wkData.sort((a,b) => b.units - a.units || b.prodCumpl - a.prodCumpl);
  } else {
    wkData.sort((a,b) => b.cumplPromedio - a.cumplPromedio || b.metrics.totalSold - a.metrics.totalSold);
  }

  // Filtros de colaborador y estado
  let filtered = [...wkData];
  if (df.worker !== 'all') filtered = filtered.filter(w => String(w.id) === String(df.worker));
  if (df.status === 'cumplida')  filtered = filtered.filter(w => (df.rankType === 'efectivo' ? w.cashCumpl : w.cumplPromedio) >= 100);
  else if (df.status === 'camino') filtered = filtered.filter(w => (df.rankType === 'efectivo' ? w.cashCumpl : w.cumplPromedio) >= 60 && (df.rankType === 'efectivo' ? w.cashCumpl : w.cumplPromedio) < 100);
  else if (df.status === 'bajo')   filtered = filtered.filter(w => (df.rankType === 'efectivo' ? w.cashCumpl : w.cumplPromedio) < 60);

  // Totales de tienda
  const storeRec = getStoreRecord(activeMonth);
  const totalUnits = wkData.reduce((sum, w) => sum + w.units, 0);
  const totalCashAchieved = wkData.reduce((sum, w) => sum + w.cashAchieved, 0);
  const avgCumpl = wkData.length > 0 ? Math.round(wkData.reduce((s, w) => s + w.cumplPromedio, 0) / wkData.length) : 0;
  const topWorker = wkData[0];

  function statusBadge(c) {
    if (c >= 100) return '<span class="badge sem-green">Cumplida</span>';
    if (c >= 60)  return '<span class="badge sem-yellow">En camino</span>';
    return '<span class="badge sem-red">Por debajo</span>';
  }

  let html = '';

  // ── FILTER BAR LIMPIA (SIN MÉTODOS DE PAGO NI PRECIOS) ──
  html += `
  <div class="db-filters card card-body" style="margin-bottom:18px">
    <div class="db-filter-grid">
      <div class="db-fg">
        <label class="db-fl">Mes (Histórico)</label>
        <input id="dbf-month" type="month" class="db-fsel" value="${activeMonth}">
      </div>
      <div class="db-fg">
        <label class="db-fl">Filtro por Producto</label>
        <select id="dbf-product" class="db-fsel">
          <option value="all" ${(!df.product || df.product === 'all') ? 'selected' : ''}>Todos los productos (General)</option>
          ${prods.map(p => `<option value="${p.id}" ${df.product === String(p.id) ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>
      <div class="db-fg">
        <label class="db-fl">Periodo</label>
        <select id="dbf-period" class="db-fsel">
          <option value="mes"  ${df.period==='mes'  ?'selected':''}>Mes completo</option>
          <option value="hoy"  ${df.period==='hoy'  ?'selected':''}>Solo hoy</option>
          <option value="custom" ${df.period==='custom'?'selected':''}>Rango de fechas</option>
        </select>
      </div>
      <div class="db-fg">
        <label class="db-fl">Desde</label>
        <input id="dbf-from" type="date" class="db-fsel" value="${df.from || ''}">
      </div>
      <div class="db-fg">
        <label class="db-fl">Hasta</label>
        <input id="dbf-to" type="date" class="db-fsel" value="${df.to || ''}">
      </div>
      <div class="db-fg">
        <label class="db-fl">Colaborador</label>
        <select id="dbf-worker" class="db-fsel">
          <option value="all" ${df.worker==='all'?'selected':''}>Todos los colaboradores</option>
          ${allWk.map(w => `<option value="${w.id}" ${df.worker===String(w.id)?'selected':''}>${esc(w.name)}</option>`).join('')}
        </select>
      </div>
      <div class="db-fg">
        <label class="db-fl">Estado de meta</label>
        <select id="dbf-status" class="db-fsel">
          <option value="all"     ${df.status==='all'    ?'selected':''}>Todos</option>
          <option value="cumplida"${df.status==='cumplida'?'selected':''}>Cumplida</option>
          <option value="camino"  ${df.status==='camino' ?'selected':''}>En camino</option>
          <option value="bajo"    ${df.status==='bajo'   ?'selected':''}>Por debajo</option>
        </select>
      </div>
      <div class="db-fg db-fg-btns">
        <button class="btn pri" id="dbf-apply">Aplicar filtros</button>
        <button class="btn gho" id="dbf-clear">Limpiar</button>
      </div>
    </div>
  </div>`;

  // ── KPI CARDS ──
  html += `
  <div class="db-kpi-row">
    <div class="db-kpi">
      <div class="db-kpi-icon">🎯</div>
      <div class="db-kpi-val" style="color:var(--gold)">${money(storeRec.monthly_target)}</div>
      <div class="db-kpi-lbl">Meta Tienda (Independiente)</div>
    </div>
    <div class="db-kpi">
      <div class="db-kpi-icon">💰</div>
      <div class="db-kpi-val" style="color:var(--accent)">${money(storeRec.accumulated_sales)}</div>
      <div class="db-kpi-lbl">Venta Acumulada Tienda</div>
    </div>
    <div class="db-kpi">
      <div class="db-kpi-icon">💵</div>
      <div class="db-kpi-val" style="color:var(--gold)">${money(totalCashAchieved)}</div>
      <div class="db-kpi-lbl">Efectivo Logrado Equipo</div>
    </div>
    <div class="db-kpi">
      <div class="db-kpi-icon">${avgCumpl >= 80 ? '🟢' : avgCumpl >= 50 ? '🟡' : '🔴'}</div>
      <div class="db-kpi-val" style="color:${avgCumpl>=80?'var(--green)':avgCumpl>=50?'var(--gold)':'var(--red)'}">${avgCumpl}%</div>
      <div class="db-kpi-lbl">Cumplimiento Promedio</div>
      <div class="db-kpi-prog"><div style="width:${Math.min(100,avgCumpl)}%;background:${avgCumpl>=80?'var(--green)':avgCumpl>=50?'var(--gold)':'var(--red)'}"></div></div>
    </div>
    <div class="db-kpi">
      <div class="db-kpi-icon">⭐</div>
      <div class="db-kpi-val" style="font-size:16px;color:var(--accent)">${topWorker ? esc(topWorker.name) : '—'}</div>
      <div class="db-kpi-lbl">Líder: ${topWorker ? (df.rankType === 'efectivo' ? topWorker.cashCumpl + '%' : topWorker.cumplPromedio + '%') : ''}</div>

  // ── RANKING Y COMPARATIVAS CON VARIACIÓN ▲ / ▼ ──
  html += `

      } else if (df.rankType === 'producto' && selectedProd) {
        metricValStr = w.units + ' / ' + w.prodMeta + ' u.';
        metricPct = w.prodCumpl;
      } else {
        metricValStr = w.metrics.metasDone + ' / ' + w.metrics.totalProds + ' metas';
        metricPct = w.cumplPromedio;
      }

      html += `<tr style="${isTop ? 'background:rgba(201,138,59,0.06);font-weight:600' : ''}">
        <td><div class="w-avatar" style="width:26px;height:26px;font-size:11px;${isTop ? 'background:var(--gold);color:#fff' : ''}">${idx + 1}</div></td>
        <td>
          <span class="fw600">${esc(w.name)}</span>
          ${isTop ? ' <span style="font-size:12px">🏆</span>' : ''}
        </td>
        <td><span class="badge ${w.role === 'MOZO' ? 'acc' : 'def'}">${w.role}</span></td>
        <td class="r dt-num">${w.supportPollos} u.</td>
        <td class="r dt-num fw600">${metricValStr}</td>
        <td class="r">
          <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px">
            <div class="prog" style="width:60px;height:6px"><div class="prog-bar" style="width:${Math.min(100, metricPct)}%"></div></div>
            <span class="dt-num" style="min-width:34px;font-weight:700">${metricPct}%</span>
          </div>
        </td>
        <td class="r dt-num" style="color:${varColor};font-weight:700">
          ${varStr}
        </td>
        <td class="r">${statusBadge(metricPct)}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;

  // ── GRÁFICOS DE BARRAS HORIZONTALES DE PRODUCTOS GENERALES DE LA TIENDA ──
  html += `
  <div class="sec-hd"><div class="sec-label">Desempeño de Productos Generales de Tienda (Unidades)</div></div>
  <div class="card card-body" style="margin-bottom:20px">`;

  if (prods.length === 0) {
    html += `<div class="empty-box"><div class="empty-icon">📊</div><div class="empty-title">Sin productos registrados</div></div>`;
  } else {
    html += `<div class="db-barchart">`;
    prods.forEach(p => {
      const sp = getStoreProductRecord(p.id, activeMonth);
      const target = sp.target_units || 40;
      const actual = sp.actual_units || 0;
      const pPct = target > 0 ? Math.round((actual / target) * 100) : 0;
      const pColor = pPct >= 100 ? 'var(--green)' : pPct >= 60 ? 'var(--accent)' : 'var(--red)';
      html += `
      <div class="db-bar-row">
        <div class="db-bar-label" title="${esc(p.name)}">${esc(p.name)}</div>
        <div class="db-bar-track">
          <div class="db-bar-fill" style="width:${Math.min(100, pPct)}%;background:${pColor}"></div>
        </div>
        <div class="db-bar-pct" style="font-weight:600;min-width:90px;text-align:right">
          ${actual} / ${target} u. <span style="font-size:11px;color:${pColor}">(${pPct}%)</span>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  // ── SECCIÓN DE OBSERVACIONES Y COMENTARIOS DE EVALUACIÓN ──
  const comments = (S.workerComments || []).filter(c => {
    if (isAdmin) {
      if (df.worker !== 'all') return String(c.worker_id) === String(df.worker);
      return true;
    } else {
      // Personal solo ve comentarios dirigidos a él
      return String(c.worker_id) === String(S.session.id);
    }
  });

  html += `
  <div class="sec-hd"><div class="sec-label">Observaciones y Comentarios de Evaluación (${formatMonthName(activeMonth)})</div></div>
  <div class="card card-body" style="margin-bottom:24px">`;

  if (isAdmin) {
    html += `
    <div style="background:var(--bg-surface-2);padding:14px;border-radius:8px;border:1px solid var(--border);margin-bottom:16px">
      <div style="font-weight:700;font-size:13.5px;color:var(--text-1);margin-bottom:8px">Redactar Nueva Observación de Evaluación</div>
      <div style="display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:180px">
          <label style="font-size:11px;font-weight:600;color:var(--text-3);display:block;margin-bottom:3px">Colaborador Evaluado</label>
          <select id="cmt-worker" class="input sm" style="width:100%">
            ${allWk.map(w => `<option value="${w.id}">${esc(w.name)} (${w.role})</option>`).join('')}
          </select>
        </div>
      </div>
      <textarea id="cmt-text" rows="3" placeholder="Escribe el feedback, recomendaciones de servicio, reconocimientos o llamados de atención para este período..." style="width:100%;box-sizing:border-box;padding:8px 10px;border-radius:6px;border:1px solid var(--border);font-size:13px;resize:vertical;background:var(--bg-base);color:var(--text-1)"></textarea>
      <div class="flex-end" style="margin-top:8px">
        <button type="button" class="btn pri sm" id="btn-save-comment">💬 Publicar Observación</button>
      </div>
    </div>`;
  }

  // Historial de comentarios
  html += `<div style="font-weight:600;font-size:13px;color:var(--text-2);margin-bottom:10px">Historial de Evaluaciones:</div>`;
  if (comments.length === 0) {
    html += `<div style="font-size:12px;color:var(--text-3);font-style:italic">No hay observaciones registradas para este colaborador o período.</div>`;
  } else {
    comments.forEach(c => {
      const targetW = S.users.find(u => String(u.id) === String(c.worker_id));
      html += `
      <div class="comment-item">
        <div class="comment-hd">

            <span class="comment-author">Para: ${esc(targetW ? targetW.name : c.worker_name || 'Colaborador')}</span>

          ${isAdmin ? `<button class="btn dan sm" data-delcomment="${c.id}" title="Eliminar observación" style="padding:2px 6px;font-size:11px">✕</button>` : ''}
        </div>
        <div class="comment-text">${esc(c.comment)}</div>
      </div>`;
    });
  }

  html += `</div>`;

  return html;
}

function wireDashboard(root) {
  const ap = root.querySelector('#dbf-apply');
  const cl = root.querySelector('#dbf-clear');
  const rk = root.querySelector('#db-rank-type');

  if (rk) {
    rk.addEventListener('change', () => {
      if (!S.dash) S.dash = {};
      S.dash.rankType = rk.value;
      render();
    });
  }

  if (ap) ap.addEventListener('click', async () => {
    if (!S.dash) S.dash = {};
    const oldMonth = S.dash.month;
    S.dash.month   = root.querySelector('#dbf-month') ? root.querySelector('#dbf-month').value : localMonthStr();
    S.dash.product = root.querySelector('#dbf-product') ? root.querySelector('#dbf-product').value : 'all';
    S.dash.period  = root.querySelector('#dbf-period') ? root.querySelector('#dbf-period').value : 'mes';
    S.dash.from    = root.querySelector('#dbf-from') ? root.querySelector('#dbf-from').value : '';
    S.dash.to      = root.querySelector('#dbf-to') ? root.querySelector('#dbf-to').value : '';
    S.dash.worker  = root.querySelector('#dbf-worker') ? root.querySelector('#dbf-worker').value : 'all';
    S.dash.status  = root.querySelector('#dbf-status') ? root.querySelector('#dbf-status').value : 'all';

    // Si cambió el mes histórico, actualizar selectedMonth y recargar
    if (S.dash.month && S.dash.month !== oldMonth) {
      S.selectedMonth = S.dash.month;
      await syncFromD1();
    }
    render();
  });

  if (cl) cl.addEventListener('click', () => {
    S.dash = { period: 'mes', month: S.selectedMonth || localMonthStr(), from: '', to: '', worker: 'all', product: 'all', status: 'all', rankType: 'cumplimiento' };
    render();
  });

  // Publicar comentario de evaluación
  const btnSaveCmt = root.querySelector('#btn-save-comment');
  if (btnSaveCmt) {
    btnSaveCmt.addEventListener('click', async () => {
      const wSel = root.querySelector('#cmt-worker');
      const tInp = root.querySelector('#cmt-text');
      if (!wSel || !tInp) return;
      const workerId = wSel.value;
      const comment = tInp.value.trim();
      if (!comment) {
        toast('Ingresa una observación o comentario.');
        return;
      }
      btnSaveCmt.disabled = true;
      try {
        await api.addWorkerComment({
          period_month: (S.dash && S.dash.month) || S.selectedMonth || localMonthStr(),
          worker_id: workerId,
          comment: comment
        });
        toast('Observación publicada');
        tInp.value = '';
        await syncFromD1();
      } catch (err) {
        toast('Error: ' + err.message);
        btnSaveCmt.disabled = false;
      }
    });
  }

  // Eliminar comentario
  root.querySelectorAll('[data-delcomment]').forEach(b => {
    b.addEventListener('click', async () => {
      const cid = b.dataset.delcomment;
      if (!confirm('¿Eliminar esta observación?')) return;
      b.disabled = true;
      try {
        await api.deleteWorkerComment(cid);
        toast('Observación eliminada');
        await syncFromD1();
      } catch (e) {
        toast('Error: ' + e.message);
        b.disabled = false;
      }
    });
  });
}

          <button class="confirm-btn-danger" id="btn-confirm-logout">Cerrar sesión</button>

    overlay.classList.add('active');

  const cancelBtn  = overlay.querySelector('#btn-cancel-logout');

    inAction = true;
    overlay.classList.remove('active');
    setTimeout(() => {
      overlay.remove();
    }, 260);
  }

  cancelBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });

  const onKey = (e) => {
    if (e.key === 'Escape') {
      document.removeEventListener('keydown', onKey);
      closeModal();
    }
  };
  document.addEventListener('keydown', onKey);

  confirmBtn.addEventListener('click', async () => {
    if (inAction) return;
    inAction = true;
    document.removeEventListener('keydown', onKey);

    confirmBtn.disabled = true;
    cancelBtn.disabled = true;

    // Cambiar al spinner con "Cerrando sesión..."
    content.innerHTML = `
      <div class="confirm-modal-loading">
        <span class="modal-spinner"></span>
        <span class="login-modal-text">Cerrando sesión...</span>
      </div>
    `;

    // Mantener durante ~700 ms
    await new Promise(res => setTimeout(res, 700));

    // Transición suave de salida hacia el login
    const shell = document.querySelector('.g-shell');
    if (shell) {
      shell.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
      shell.style.opacity = '0';
      shell.style.transform = 'scale(0.99)';
    }
    overlay.style.transition = 'opacity 0.35s ease';
    overlay.style.opacity = '0';

    await new Promise(res => setTimeout(res, 350));

    overlay.remove();
    api.setToken(null);
    saveSession(null);
    render();
  });
}

function wireLayout(root) {
  /* Logout (Sidebar, Mobile Header y Top Navbar) */
  const lo    = root.querySelector('#lo');
  const loM   = root.querySelector('#lo-m');
  const loTop = root.querySelector('#lo-top');
  if (lo)    lo.addEventListener('click', confirmLogout);
  if (loM)   loM.addEventListener('click', confirmLogout);
  if (loTop) loTop.addEventListener('click', confirmLogout);

  /* Navigation (sidebar + mobile) */
  root.querySelectorAll('.nb').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.tab) { S.tab = b.dataset.tab; render(); }
  }));
}

  const btnSaveStore = root.querySelector('#btn-save-store-records');
  if (btnSaveStore) {
    btnSaveStore.addEventListener('click', async () => {
      const acc = parseFloat((root.querySelector('#store-acc-sales') || {}).value) || 0;

      const pollos = parseFloat((root.querySelector('#store-total-pollos') || {}).value) || 0;
      btnSaveStore.disabled = true;
      try {
        await api.saveStoreRecord({
          period_month: S.selectedMonth,
          accumulated_sales: acc,
          monthly_target: target,

        });
        toast('Datos de tienda actualizados');
        await syncFromD1();
      } catch (e) {
        toast('Error: ' + e.message);
        btnSaveStore.disabled = false;
      }
    });
  }

  const btnSaveStoreProds = root.querySelector('#btn-save-store-products');
  if (btnSaveStoreProds) {
    btnSaveStoreProds.addEventListener('click', async () => {
      btnSaveStoreProds.disabled = true;
      try {
        const prods = (S.products || []).filter(p => p.active);
        for (const p of prods) {
          const tInp = root.querySelector(`.store-prod-target[data-pid="${p.id}"]`);
          const aInp = root.querySelector(`.store-prod-actual[data-pid="${p.id}"]`);
          if (tInp && aInp) {
            const targetUnits = parseInt(tInp.value, 10) || 0;
            const actualUnits = parseInt(aInp.value, 10) || 0;
            await api.saveStoreProduct({
              period_month: S.selectedMonth,
              product_id: p.id,
              target_units: targetUnits,
              actual_units: actualUnits
            });
          }

        await syncFromD1();
      } catch (e) {
        toast('Error: ' + e.message);
        btnSaveStoreProds.disabled = false;
      }
    });
  }

  /* ── PROYECTADO: RECÁLCULO DINÁMICO Y GUARDADO ── */
  function recalcDailyProjectionRow(day) {
    const tInp = root.querySelector(`.proj-day-target[data-day="${day}"]`);
    const aInp = root.querySelector(`.proj-day-actual[data-day="${day}"]`);
    const cell = root.querySelector(`.proj-diff-cell[data-day="${day}"]`);
    if (!tInp || !aInp || !cell) return;
    const target = parseFloat(tInp.value) || 0;
    const actual = parseFloat(aInp.value) || 0;
    const diff = actual - target;
    const isPos = diff >= 0;
    cell.textContent = (isPos ? '+' : '') + money(diff);
    cell.style.color = isPos ? 'var(--green)' : 'var(--red)';
    
    let totTarget = 0, totActual = 0;
    root.querySelectorAll('.proj-day-target').forEach(i => totTarget += (parseFloat(i.value) || 0));
    root.querySelectorAll('.proj-day-actual').forEach(i => totActual += (parseFloat(i.value) || 0));
    const totDiff = totActual - totTarget;
    const totTEl = root.querySelector('#proj-tot-target');
    const totAEl = root.querySelector('#proj-tot-actual');
    const totDEl = root.querySelector('#proj-tot-diff');
    if (totTEl) totTEl.textContent = money(totTarget);
    if (totAEl) totAEl.textContent = money(totActual);
    if (totDEl) {
      totDEl.textContent = (totDiff >= 0 ? '+' : '') + money(totDiff);
      totDEl.style.color = totDiff >= 0 ? 'var(--green)' : 'var(--red)';
    }
  }

  root.querySelectorAll('.proj-day-target, .proj-day-actual').forEach(inp => {
    inp.addEventListener('input', () => recalcDailyProjectionRow(parseInt(inp.dataset.day, 10)));
  });

  async function saveAllProjections() {
    const rows = [];
    root.querySelectorAll('.proj-day-target').forEach(tInp => {
      const day = parseInt(tInp.dataset.day, 10);
      const aInp = root.querySelector(`.proj-day-actual[data-day="${day}"]`);
      const target = parseFloat(tInp.value) || 0;
      const actual = aInp ? (parseFloat(aInp.value) || 0) : 0;
      rows.push({ day, target_amount: target, actual_amount: actual });
    });
    if (rows.length === 0) return;
    try {
      await api.saveDailyProjections(S.selectedMonth, rows);
      toast('Proyecciones diarias guardadas');
      await syncFromD1();
    } catch (e) {
      toast('Error guardando proyecciones: ' + e.message);
    }
  }
  const bsp1 = root.querySelector('#btn-save-projections');
  const bsp2 = root.querySelector('#btn-save-projections-bottom');
  if (bsp1) bsp1.addEventListener('click', saveAllProjections);
  if (bsp2) bsp2.addEventListener('click', saveAllProjections);

  const isAdmin = S.session && S.session.role === 'ADMIN';

  /* ── FECHA DE EVALUACIÓN EN VENTAS ── */
  const sDateInp = root.querySelector('#sales-date');
  if (sDateInp) {
    sDateInp.addEventListener('change', () => {
      S.selectedSaleDate = sDateInp.value;
    });
  }

  /* ── BOTÓN AJUSTAR / DESCONTAR ── */
  root.querySelectorAll('[data-adjust-btn]').forEach(btn => {
    btn.addEventListener('click', () => {
      const pid = btn.dataset.adjustBtn;
      const wid = btn.dataset.wid || (S.session ? S.session.id : '');
      openM('adjust-sale', { productId: pid, workerId: wid });
    });
  });

  /* ── REGISTRO DE VENTAS (USUARIO) ── */
  if (!isAdmin && S.tab === 'ventas') {
    const wid = S.session ? S.session.id : null;
    const btnSaveAll = root.querySelector('#btn-save-all-sales');
    const rowInputs = Array.from(root.querySelectorAll('.sale-qty-input:not(.admin-sale-input)'));

    function updateSaveAllState() {
      if (!btnSaveAll) return;
      const valid = rowInputs.filter(inp => (parseInt(inp.value, 10) || 0) > 0);
      if (valid.length >= 2) {
        btnSaveAll.disabled = false;
        btnSaveAll.style.opacity = '1';
        btnSaveAll.style.cursor = 'pointer';
        btnSaveAll.innerHTML = `⚡ Guardar todos (${valid.length} productos)`;
      } else {
        btnSaveAll.disabled = true;
        btnSaveAll.style.opacity = '0.4';
        btnSaveAll.style.cursor = 'not-allowed';
        btnSaveAll.innerHTML = '⚡ Guardar todos';
      }
    }

    async function submitSingleRow(pid, input, btnSend) {
      const qty = parseInt(input.value, 10);
      if (isNaN(qty) || qty <= 0) return;

      const sDate = S.selectedSaleDate || (root.querySelector('#sales-date') ? root.querySelector('#sales-date').value : localDateStr());

      btnSend.disabled = true;
      btnSend.style.opacity = '0.6';
      btnSend.innerHTML = '<span class="modal-spinner" style="width:12px;height:12px;border-width:2px;display:inline-block"></span>';
      input.disabled = true;

      const tempId = 'temp_' + Date.now();
      S.sales.push({
        id: tempId,
        worker_id: wid,
        product_id: pid,
        quantity: qty,
        sale_date: sDate,
        payment_method: 'EFECTIVO'
      });

      try {
        await api.recordSale({
          worker_id: wid,
          product_id: pid,
          quantity: qty,
          sale_date: sDate,
          payment_method: 'EFECTIVO'
        });
        const prod = S.products.find(p => p.id === pid);
        toast(`✓ +${qty} ${prod ? prod.name : 'unidades'} registrado`);
        input.value = '';
        input.disabled = false;
        await syncFromD1();
      } catch (e) {
        S.sales = S.sales.filter(s => s.id !== tempId);
        input.disabled = false;
        btnSend.disabled = false;
        btnSend.style.opacity = '1';
        btnSend.textContent = 'Enviar';
        render();
        toast('Error: ' + e.message);
      }
    }

    rowInputs.forEach(input => {
      const pid = input.dataset.pid;
      const btnSend = root.querySelector(`.btn-send-sale[data-send-pid="${pid}"]`);

      input.addEventListener('keydown', e => {
        if (['e', 'E', '+', '-', '.', ','].includes(e.key)) {
          e.preventDefault();
          return;
        }
        if (e.key === 'ArrowDown' && (parseInt(input.value, 10) || 0) <= 0) {
          e.preventDefault();
          input.value = '';
          if (btnSend) { btnSend.disabled = true; btnSend.style.opacity = '0.4'; btnSend.style.cursor = 'not-allowed'; }
          updateSaveAllState();
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          if (btnSend && !btnSend.disabled) {
            submitSingleRow(pid, input, btnSend);
          }
        }
      });

      input.addEventListener('input', () => {
        let clean = input.value.replace(/[^0-9]/g, '');
        if (clean.length > 1 && clean.startsWith('0')) {
          clean = clean.replace(/^0+/, '');
        }
        if (input.value !== clean) input.value = clean;

        const val = parseInt(input.value, 10) || 0;
        if (btnSend) {
          if (val > 0) {
            btnSend.disabled = false;
            btnSend.style.opacity = '1';
            btnSend.style.cursor = 'pointer';
          } else {
            btnSend.disabled = true;
            btnSend.style.opacity = '0.4';
            btnSend.style.cursor = 'not-allowed';
          }
        }
        updateSaveAllState();
      });

      if (btnSend) {
        btnSend.addEventListener('click', () => {
          submitSingleRow(pid, input, btnSend);
        });
      }
    });

    if (btnSaveAll) {
      btnSaveAll.addEventListener('click', async () => {
        const validInputs = rowInputs.filter(inp => (parseInt(inp.value, 10) || 0) > 0);
        if (validInputs.length === 0) return;

        const sDate = S.selectedSaleDate || (root.querySelector('#sales-date') ? root.querySelector('#sales-date').value : localDateStr());

        btnSaveAll.disabled = true;
        btnSaveAll.style.opacity = '0.7';
        btnSaveAll.innerHTML = '<span class="modal-spinner" style="width:13px;height:13px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px"></span> Guardando...';

        const salesItems = [];
        const tempIds = [];
        const now = Date.now();

        validInputs.forEach((inp, idx) => {
          const pid = inp.dataset.pid;
          const qty = parseInt(inp.value, 10);
          const prod = S.products.find(p => p.id === pid);
          if (prod && qty > 0) {
            const tId = `temp_bulk_${now}_${idx}`;
            tempIds.push(tId);
            S.sales.push({
              id: tId,
              worker_id: wid,
              product_id: pid,
              quantity: qty,
              sale_date: sDate,
              payment_method: 'EFECTIVO'
            });
            salesItems.push({
              product_id: pid,
              worker_id: wid,
              quantity: qty,
              unit_price: 0,
              sale_date: sDate,
              payment_method: 'EFECTIVO'
            });
          }
        });

        try {
          await api.recordSalesBulk({
            worker_id: wid,
            sale_date: sDate,
            payment_method: 'EFECTIVO',
            sales: salesItems
          });
          const totalUnits = salesItems.reduce((acc, c) => acc + c.quantity, 0);
          toast(`✓ ${salesItems.length} productos registrados exitosamente (${totalUnits} u.)`);
          validInputs.forEach(inp => { inp.value = ''; });
          await syncFromD1();
        } catch (err) {
          S.sales = S.sales.filter(s => !tempIds.includes(s.id));
          render();
          toast('Error guardando ventas: ' + err.message);
        }
      });
    }
  }

  /* ── VENTAS ADMIN ── */
  if (isAdmin && S.tab === 'ventas') {
    root.querySelectorAll('[data-toggleuser]').forEach(b => b.addEventListener('click', () => {
      S.expandedWaiter = S.expandedWaiter === b.dataset.toggleuser ? null : b.dataset.toggleuser;

      function updateAdminSaveAll() {

        } else {
          btnAdminSaveAll.disabled = true;
          btnAdminSaveAll.style.opacity = '0.4';
          btnAdminSaveAll.style.cursor = 'not-allowed';
        }
      }

      async function submitAdminRow(pid, input, btnSend) {

          sale_date: sDate,
          payment_method: 'EFECTIVO'
        });

        try {
          await api.recordSale({
            worker_id: wid,

          input.value = '';
          input.disabled = false;
          await syncFromD1();
        } catch (e) {
          S.sales = S.sales.filter(s => s.id !== tempId);
          input.disabled = false;
          btnSend.disabled = false;
          btnSend.style.opacity = '1';
          btnSend.textContent = 'Enviar';
          render();
          toast('Error: ' + e.message);
        }

      workerInputs.forEach(input => {
        const pid = input.dataset.pid;
        const btnSend = root.querySelector(`.btn-admin-send[data-wid="${wid}"][data-pid="${pid}"]`);

        input.addEventListener('keydown', e => {
          if (['e', 'E', '+', '-', '.', ','].includes(e.key)) {
            e.preventDefault();
            return;
          }
          if (e.key === 'ArrowDown' && (parseInt(input.value, 10) || 0) <= 0) {
            e.preventDefault();
            input.value = '';
            if (btnSend) { btnSend.disabled = true; btnSend.style.opacity = '0.4'; btnSend.style.cursor = 'not-allowed'; }
            updateAdminSaveAll();
            return;
          }
          if (e.key === 'Enter') {
            e.preventDefault();
            if (btnSend && !btnSend.disabled) {
              submitAdminRow(pid, input, btnSend);
            }
          }
        });

        input.addEventListener('input', () => {
          let clean = input.value.replace(/[^0-9]/g, '');
          if (clean.length > 1 && clean.startsWith('0')) {
            clean = clean.replace(/^0+/, '');
          }
          if (input.value !== clean) input.value = clean;

          const val = parseInt(input.value, 10) || 0;
          if (btnSend) {
            if (val > 0) {

              btnSend.style.opacity = '1';
              btnSend.style.cursor = 'pointer';
            } else {

              btnSend.style.opacity = '0.4';
              btnSend.style.cursor = 'not-allowed';
            }
          }
          updateAdminSaveAll();

        if (btnSend) {
          btnSend.addEventListener('click', () => {

            render();
            toast('Error guardando ventas: ' + err.message);
          }

  /* ── ACCIONES GENERALES ── */

  const au  = root.querySelector('#add-user');
  if (au) au.addEventListener('click', () => openM('add-user'));

  const aab = root.querySelector('#add-admin-btn');
  if (aab) aab.addEventListener('click', () => openM('add-admin'));

  const at = root.querySelector('#add-task');
  if (at) at.addEventListener('click', () => openM('add-task'));

  const ae = root.querySelector('#add-event');
  if (ae) ae.addEventListener('click', () => openM('add-event'));

  const est = root.querySelector('#edit-store-target');
  if (est) est.addEventListener('click', () => openM('edit-store-target'));

  /* Editar meta diaria */
  root.querySelectorAll('[data-editdaytarget]').forEach(b => b.addEventListener('click', () => {
    const day = parseInt(b.dataset.editdaytarget);
    const target = parseFloat(b.dataset.target) || 0;
    openM('edit-day-target', { day, target });
  }));

  const ce = root.querySelector('#cfg-endpoint');
  if (ce) ce.addEventListener('click', () => openM('config-api'));

  /* ── PRODUCTOS: DESACTIVAR ── */
  root.querySelectorAll('[data-delprod]').forEach(b => b.addEventListener('click', async () => {
    const prodId = b.dataset.delprod;
    const prod   = S.products.find(p => p.id === prodId);
    if (!prod) return;
    if (!confirm(`¿Desactivar el producto "${prod.name}"? Quedará oculto del catálogo.`)) return;
    b.disabled = true;
    try {
      await api.deleteProduct(prodId);
      toast('Producto desactivado');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); b.disabled = false; }
  }));

  /* ── TAREAS: ELIMINAR (admin) ── */
  root.querySelectorAll('[data-deltask]').forEach(b => b.addEventListener('click', async () => {
    const taskId = b.dataset.deltask;
    const task   = S.tasks.find(t => t.id === taskId);
    if (!task) return;
    if (!confirm(`¿Eliminar la tarea "${task.name}"?`)) return;
    b.disabled = true;
    try {
      await api.deleteTask(taskId);
      toast('Tarea eliminada');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); b.disabled = false; }
  }));

  /* ── TAREAS: MARCAR / DESMARCAR ── */
  root.querySelectorAll('[data-donetask]').forEach(b => b.addEventListener('click', () => {
    const tid    = b.dataset.donetask;
    const task   = S.tasks.find(t => t.id === tid);
    const assign = (task.assignees || []).find(a => a.user_id === S.session.id);
    if (assign && assign.completed) {
      api.toggleTask(tid, 0, '').then(() => { toast('Tarea desmarcada'); syncFromD1(); });
    } else {
      openM('task-note', { taskId: tid });
    }
  }));

  /* ── EVENTOS: ELIMINAR ── */
  root.querySelectorAll('[data-delevent]').forEach(b => b.addEventListener('click', async () => {
    try {
      await api.deleteEvent(b.dataset.delevent);
      toast('Evento eliminado');
      await syncFromD1();
    } catch (e) { toast('Error: ' + e.message); }
  }));

  /* ── MODAL: GUARDAR / CANCELAR ── */
  const mc  = root.querySelector('#m-cancel');
  if (mc) mc.addEventListener('click', closeM);

  const mbd = root.querySelector('#mbd');
  if (mbd) mbd.addEventListener('click', e => { if (e.target === mbd) closeM(); });

  const ms = root.querySelector('#m-save');
  if (ms) ms.addEventListener('click', async () => {
    const m = S.modal;
    if (!m) return;
    const v = id => { const el = root.querySelector('#' + id); return el ? el.value.trim() : ''; };
    ms.disabled = true;
    try {
      if (m.type === 'config-api') {
        const url = v('mf-api');
        if (url) { localStorage.setItem(CONFIG_KEY, url); location.reload(); }

      } else if (m.type === 'add-prod') {
        const name     = v('mf-name');
        const category = v('mf-cat') || 'GENERAL';
        const initGoal = parseFloat(v('mf-initial-goal')) || 40;
        const newProd  = await api.createProduct({ name, category, price: 0, target_role: m.data.role });
        if (newProd && newProd.product && newProd.product.id) {
          await api.saveGoal({ type: 'PRODUCT_GOAL', product_id: newProd.product.id, target_quantity: initGoal });
        }
        toast('Producto agregado al catálogo'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-goal') {
        const g = parseFloat(v('mf-goal')) || 0;
        await api.saveGoal({ type: 'PRODUCT_GOAL', product_id: m.data.id, target_quantity: g });
        toast('Meta actualizada'); closeM(); await syncFromD1();

      } else if (m.type === 'add-user') {
        const name = v('mf-name'), code = v('mf-code'), role = v('mf-role');
        await api.createUser({ name, code, role });
        toast('Colaborador creado'); closeM(); await syncFromD1();

      } else if (m.type === 'add-admin') {
        const name = v('mf-name'), code = v('mf-code');
        await api.createUser({ name, code, role: 'ADMIN' });
        toast('Administrador creado'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-profile') {
        const name = v('mf-name'), code = v('mf-code');
        await api.updateUser(m.data.id, { name, code });
        toast('Perfil actualizado'); closeM(); await syncFromD1();

      } else if (m.type === 'add-task') {
        const name = v('mf-name'), deadline = v('mf-date');
        await api.createTask({ name, deadline });
        toast('Tarea creada'); closeM(); await syncFromD1();

      } else if (m.type === 'add-event') {
        const title       = v('mf-name');
        const event_date  = v('mf-date');
        const event_time  = v('mf-time');
        const description = v('mf-desc');
        await api.createEvent({ title, event_date, event_time, description });
        toast('Evento programado'); closeM(); await syncFromD1();

      } else if (m.type === 'task-note') {
        const note = v('mf-note');
        await api.toggleTask(m.data.taskId, 1, note);
        toast('Tarea completada'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-store-target') {
        const target = parseFloat(v('mf-target')) || 350000;
        await api.saveGoal({ type: 'STORE_TARGET', target_amount: target });
        toast('Meta de tienda actualizada'); closeM(); await syncFromD1();

      } else if (m.type === 'edit-day-target') {
        const target = parseFloat(v('mf-day-target')) || 0;
        const periodMonth = (S.kpi && S.kpi.month) || localMonthStr();
        await api.saveGoal({ type: 'STORE_TARGET', period_month: periodMonth, day: m.data.day, target_amount: target });
        toast(`Meta del día ${m.data.day} actualizada a ${money(target)}`); closeM(); await syncFromD1();

      } else if (m.type === 'edit-worker-goal') {
        const workerId = v('mf-worker');
        const periodMonth = v('mf-period') || localMonthStr();
        const targetAmount = parseFloat(v('mf-target')) || 0;
        const cashTargetAmount = parseFloat(v('mf-cash-target')) || 0;
        if (!workerId) throw new Error('Selecciona un colaborador.');
        if (targetAmount <= 0) throw new Error('Ingresa un monto objetivo mayor a 0.');

        await api.saveGoal({
          type: 'WORKER_TARGET',
          worker_id: workerId,
          period_month: periodMonth,
          target_amount: targetAmount,
          cash_target_amount: cashTargetAmount
        });

        const targetUser = S.users.find(u => String(u.id) === String(workerId));
        toast(`Meta de ${money(targetAmount)} (Efectivo: ${money(cashTargetAmount)}) guardada para ${targetUser ? targetUser.name : 'el colaborador'}`);
        closeM();
        await syncFromD1();

      } else if (m.type === 'adjust-sale') {
        const pid = v('mf-adjust-pid');
        const wid = v('mf-adjust-wid');
        const qtyToDeduct = parseInt(v('mf-adjust-qty'), 10) || 0;
        const sDate = v('mf-adjust-date') || localDateStr();
        const notes = v('mf-adjust-notes') || 'Ajuste de venta';

        if (qtyToDeduct <= 0) throw new Error('Ingresa una cantidad mayor a 0 para descontar.');

        await api.recordSale({
          worker_id: wid,
          product_id: pid,
          quantity: -qtyToDeduct,
          sale_date: sDate,
          notes: notes,
          payment_method: S.selectedPaymentMethod || 'EFECTIVO'
        });

        const prod = S.products.find(p => p.id === pid);
        toast(`✓ Descuento de −${qtyToDeduct} ${prod ? prod.name : 'unidades'} registrado.`);
        closeM();
        await syncFromD1();
      }
    } catch (err) {
      toast('Error: ' + err.message);
    } finally {
      ms.disabled = false;
    }
  });
}

function wire(root) {
  wireLayout(root);
  wireContent(root);
}

// ================================================================
// INIT
// ================================================================
render();
if (S.session) syncFromD1();

})();
</script>
</body>
</html>
